      localStorage.setItem('999.practice.speed', String(SPEED.paceRun));
      localStorage.setItem('999.practice.speedtruepace', String(SPEED.paceTrue));
      localStorage.setItem('999.practice.speedadapt', SPEED.adapt ? 'on' : 'off');
    } catch (e) { }
  }
  function speedIdleStage() {
    document.getElementById('speedStage').innerHTML = '';
    document.getElementById('speedStage').appendChild(cardEl(null, true));
    var tr = document.getElementById('speedTrueDk');
    if (tr) tr.hidden = true;
    document.getElementById('speedGo').hidden = false;
    document.getElementById('speedGo').textContent = speedStats().runs ? 'Go again' : 'Start';
    document.getElementById('speedLock').hidden = true;
  }
  function renderSpeed() {
    var mr = document.getElementById('modeRun'), mt = document.getElementById('modeTrue');
    if (mr) mr.classList.toggle('on', SPEED.mode === 'run');
    if (mt) mt.classList.toggle('on', SPEED.mode === 'true');
    var paces = document.querySelectorAll('#speedPaces .sp[data-pace]');
    for (var i = 0; i < paces.length; i++) {
      paces[i].classList.toggle('on', parseFloat(paces[i].getAttribute('data-pace')) === SPEED.pace);
    }
    var ab = document.getElementById('speedAdapt');
    if (ab) ab.classList.toggle('on', SPEED.adapt);
    var stats = speedStats();
    var st = document.getElementById('speedStats');
    st.textContent = stats.runs
      ? 'runs ' + stats.runs + ' \u00b7 ' + stats.right + ' right \u00b7 best ' +
        (stats.bestMs / 1000).toFixed(1) + 's \u00b7 streak ' + stats.streak +
        ' (best ' + stats.bestStreak + ')'
      : (SPEED.mode === 'true'
          ? 'count the stream, divide by the decks left \u2014 one decimal, under the clock'
          : 'count at table speed \u2014 no marks, just the running count');
    if (SPEED.adapt) st.textContent += ' \u00b7 pace ' + SPEED.pace.toFixed(2) + 's';
    /* the personal edge: hits proven down to edgeHi, misses proven
       up to edgeLo — the cadence lives in the gap between them  */
    if (SPEED.adapt && stats.edgeHi != null && stats.edgeLo != null) {
      st.textContent += stats.edgeHi <= stats.edgeLo + 1e-9
        ? (Math.abs(stats.edgeHi - stats.edgeLo) < 1e-9
            ? ' \u00b7 edge ' + stats.edgeHi.toFixed(2) + 's'
            : ' \u00b7 edge ' + stats.edgeHi.toFixed(2) + '\u2013' + stats.edgeLo.toFixed(2) + 's')
        : ' \u00b7 edge \u2248' + ((stats.edgeHi + stats.edgeLo) / 2).toFixed(2) + 's';
    } else if (SPEED.adapt && stats.edgeHi != null) {
      st.textContent += ' \u00b7 hits to ' + stats.edgeHi.toFixed(2) + 's';
    } else if (SPEED.adapt && stats.edgeLo != null) {
      st.textContent += ' \u00b7 misses from ' + stats.edgeLo.toFixed(2) + 's';
    }
    renderCount();                   /* the pill on the main floor carries
                                        the drill's best time and streak */
    if (SPEED.phase === 'idle') speedIdleStage();
  }
  function speedStart() {
    if (SPEED.phase !== 'idle') return;
    var isTrue = SPEED.mode === 'true';
    var N = isTrue ? 15 + Math.floor(Math.random() * 21) : SPEED.N;
    var deck = SHOE999.build(1);
    SPEED.stream = [];
    for (var i = 0; i < N; i++) SPEED.stream.push(deck.pop());
    SPEED.rc = speedTarget(SPEED.stream);
    SPEED.dkStr = isTrue ? ((52 - N) / 52).toFixed(2) : null;
    SPEED.target = isTrue ? trueTargetFor(SPEED.rc, SPEED.dkStr) : SPEED.rc;
    SPEED.idx = 0; SPEED.val = 0; SPEED.phase = 'flash';
    SPEED.runPace = SPEED.pace;    /* what this run was flashed at — the edge ledger prices it */
    if (isTrue) {
      var tr = document.getElementById('speedTrueDk');
      if (tr) { tr.hidden = false; tr.textContent = '1.00 dk left'; }
    }
    document.getElementById('speedVerdict').textContent = '';
    document.getElementById('speedVerdict').className = 'dverdict';
    document.getElementById('speedGo').hidden = true;
    speedFlash();
  }
  function speedFlash() {
    if (SPEED.phase !== 'flash') return;
    var sN = SPEED.stream.length;
    if (SPEED.idx >= sN) { speedRecall(); return; }
    document.getElementById('speedTitle').textContent =
      'Card ' + (SPEED.idx + 1) + ' of ' + sN + ' \u2014 keep the count';
    var stage = document.getElementById('speedStage');
    stage.innerHTML = '';
    stage.appendChild(cardEl(SPEED.stream[SPEED.idx]));
    SPEED.idx++;
    /* the true-count run keeps the tray honest: the readout counts
       the decks LEFT of the 52-card deck — after this card, the
       number the running count divides by at the end */
    if (SPEED.mode === 'true') {
      var tRead = document.getElementById('speedTrueDk');
      if (tRead) tRead.textContent = ((52 - SPEED.idx) / 52).toFixed(2) + ' dk left';
    }
    SPEED.timer = setTimeout(speedFlash, SPEED.pace * 1000);   /* REAL time, not the round clock */
  }
  function speedRecall() {
    SPEED.phase = 'recall';
    SPEED.recallT0 = Date.now();
    var stage = document.getElementById('speedStage');
    if (SPEED.mode === 'true') {
      stage.innerHTML = '<div class="stepper"><button class="dbtn" id="speedMinus" type="button">&minus;</button>' +
        '<span class="dval" id="speedVal">0.0</span>' +
        '<button class="dbtn" id="speedPlus" type="button">+</button></div>' +
        '<p class="sprow"><button class="dbtn" id="speedHalf" type="button">&minus;.1</button>' +
        '<button class="dbtn" id="speedHalfUp" type="button">+.1</button></p>' +
        '<p class="dq" id="speedClock">0.0s</p>';
    } else {
      stage.innerHTML = '<div class="stepper"><button class="dbtn" id="speedMinus" type="button">&minus;</button>' +
        '<span class="dval" id="speedVal">0</span>' +
        '<button class="dbtn" id="speedPlus" type="button">+</button></div>' +
        '<p class="dq" id="speedClock">0.0s</p>';
    }
    document.getElementById('speedTitle').textContent = 'Lock the count';
    if (SPEED.mode === 'true') document.getElementById('speedTitle').textContent =
      'Lock the true count \u2014 RC \u00f7 ' + SPEED.dkStr + ' dk';
    document.getElementById('speedMinus').addEventListener('click', function () { speedStep(-1); });
    document.getElementById('speedPlus').addEventListener('click', function () { speedStep(1); });
    if (SPEED.mode === 'true') {
      document.getElementById('speedHalf').addEventListener('click', function () { speedStep(-0.1); });
      document.getElementById('speedHalfUp').addEventListener('click', function () { speedStep(0.1); });
    }
    document.getElementById('speedLock').hidden = false;   /* the clock is running */
    SPEED.ticker = setInterval(function () {
      var el = document.getElementById('speedClock');
      if (el) el.textContent = ((Date.now() - SPEED.recallT0) / 1000).toFixed(1) + 's';
    }, 100);
  }
  function speedStep(d) {
    if (SPEED.phase !== 'recall') return;
    SPEED.val = Math.round((SPEED.val + d) * 10) / 10;
    document.getElementById('speedVal').textContent =
      SPEED.mode === 'true' ? fmtCount(SPEED.val) : fmtCount(Math.round(SPEED.val));
  }
  function speedLock() {
    if (SPEED.phase !== 'recall') return;
    clearInterval(SPEED.ticker);
    var ms = Date.now() - SPEED.recallT0;
    var ok = SPEED.val === SPEED.target;
    var stats = speedStats();
    var isTrue = SPEED.mode === 'true';
    var prevStreak = stats.streak;   /* the streak this run walks into */
    stats.runs++;
    var isBest = false;
    if (ok) {
      stats.right++;
      stats.streak++;
      if (stats.streak > stats.bestStreak) stats.bestStreak = stats.streak;
      if (!stats.bestMs || ms < stats.bestMs) { stats.bestMs = ms; isBest = true; }
      stats.edgeHi = stats.edgeHi != null ? Math.min(stats.edgeHi, SPEED.runPace) : SPEED.runPace;
    } else {
      stats.streak = 0;
      stats.edgeLo = stats.edgeLo != null ? Math.max(stats.edgeLo, SPEED.runPace) : SPEED.runPace;
    }
    /* the cadence learns between runs, never mid-stream: a hit
       tightens the next run, a miss eases it — and the verdict
       says which way the drill moved                      */
    var cadence = '';
    if (SPEED.adapt) {
      var before = SPEED.pace;
      SPEED.pace = nextPace(SPEED.pace, ok, ok ? stats.streak : prevStreak);
      if (isTrue) SPEED.paceTrue = SPEED.pace; else SPEED.paceRun = SPEED.pace;
      cadence = SPEED.pace === before
        ? (ok ? ' \u00b7 at the floor' : ' \u00b7 at the ceiling')
        : (ok ? ' \u00b7 cadence up \u2192 ' + SPEED.pace.toFixed(2) + 's'
              : ' \u00b7 eased to ' + SPEED.pace.toFixed(2) + 's');
    }
    saveSpeed();
    var v = document.getElementById('speedVerdict');
    v.className = 'dverdict ' + (ok ? 'ok' : 'miss');
    v.textContent = ok
      ? '\u2713 ' + fmtCount(SPEED.target) + ' \u00b7 ' + (ms / 1000).toFixed(1) + 's' + (isBest ? ' \u2014 best!' : '') + cadence
      : 'It was ' + fmtCount(SPEED.target) + ' \u2014 you said ' + fmtCount(SPEED.val) + ' \u00b7 ' + (ms / 1000).toFixed(1) + 's' + cadence;
    if (isTrue) {
      v.textContent += ok ? '' : ' \u00b7 RC ' + fmtCount(SPEED.rc) +
        ' over ' + SPEED.dkStr + ' dk';
    }
    coachCue(ok);
    SPEED.phase = 'idle';
    speedIdleStage();
    renderSpeed();
  }
  function toggleSpeed() {
    if (inHand()) { setStatus('Finish the hand \u2014 the speed drill waits'); return; }
    SPEED.on = !SPEED.on;
    document.getElementById('speedBox').hidden = !SPEED.on;
    if (SPEED.on) { renderSpeed(); setStatus('Speed counting \u2014 the deck flashes, you recall'); }
    else if (phase === 'betting') setStatus('Place your bet');
  }
  function speedClose() {
    if (SPEED.ticker) clearInterval(SPEED.ticker);
    if (SPEED.timer) clearTimeout(SPEED.timer);
    SPEED.on = false; SPEED.phase = 'idle';
    document.getElementById('speedBox').hidden = true;
    if (phase === 'betting') setStatus('Place your bet');
  }
  document.getElementById('btnSpeed').addEventListener('click', toggleSpeed);
  document.getElementById('speedGo').addEventListener('click', speedStart);
  document.getElementById('speedBack').addEventListener('click', speedClose);
  document.getElementById('speedLock').addEventListener('click', speedLock);
  document.getElementById('modeRun').addEventListener('click', function () { speedMode('run'); });
  document.getElementById('modeTrue').addEventListener('click', function () { speedMode('true'); });
  (function () {
    var paces = document.querySelectorAll('#speedPaces .sp[data-pace]');
    for (var i = 0; i < paces.length; i++) {
      paces[i].addEventListener('click', function (e) {
        var v2 = parseFloat(e.currentTarget.getAttribute('data-pace'));
        if (!isFinite(v2)) return;
        SPEED.pace = v2;
        if (SPEED.mode === 'true') SPEED.paceTrue = v2; else SPEED.paceRun = v2;
        renderSpeed();
      });
    }
  })();
  document.getElementById('speedAdapt').addEventListener('click', function () {
    SPEED.adapt = !SPEED.adapt;
    saveSpeed();
    renderSpeed();
  });

  /* ============================================================
     The line: probe our own origin; when it returns, offer the
     door back to the page the player was bound for — instantly
     when only the shoe is running, never out of a live hand.   */
  var pillTxt = document.getElementById('pillTxt');
  var pillBtn = document.getElementById('pillBtn');
  var dest = './table-16x9.html';
  try {
    var from = new URL(location.href).searchParams.get('from');
    if (from) {
      var u = new URL(from, location.href);
      /* same origin only, and never back into this page */
      if (u.origin === location.origin && !/offline\.html$/i.test(u.pathname)) dest = u.href;
    }
  } catch (e) { }

  var back = false, retryTimer = 0, goTimer = 0, stayed = false;
  try {
    if (new URL(location.href).searchParams.get('stay') === '1') stayed = true;   /* the player (or a link) asked to stay */
  } catch (e) { }
  function go() { location.replace(dest); }
  function inHand() {
    return bet > 0 || phase === 'dealing' || phase === 'acting' || phase === 'dealer' || phase === 'settle';
  }

  function setLine(ok) {
    if (ok === back) return;
    back = ok;
    document.body.classList.toggle('back', ok);
    clearTimeout(retryTimer);
    clearTimeout(goTimer);
    if (!ok) {
      pillTxt.textContent = 'The line is down \u2014 practice mode';
      pillBtn.hidden = false;
      pillBtn.textContent = 'Retry';
      return;
    }
    pillBtn.hidden = false;
    if (!inHand() && !stayed) {
      pillTxt.textContent = 'Returning to the floor…';
      pillBtn.textContent = 'Stay & practice';
      goTimer = setTimeout(go, 2500);      /* a beat to read it, then the floor */
    } else {
      pillTxt.textContent = 'The floor is back';
      pillBtn.textContent = 'Return to the floor';
    }
  }

  function probe() {
    if (back) return;
    fetch('./manifest.webmanifest?probe=' + Date.now(), { cache: 'no-store' })
      .then(function () { setLine(true); })
      .catch(function () {
        pillTxt.textContent = 'The line is down \u2014 practice mode';
        pillBtn.hidden = false;
        pillBtn.textContent = 'Retry';
        clearTimeout(retryTimer);
        retryTimer = setTimeout(probe, 4000); /* the line comes back quietly */
      });
  }

  pillBtn.addEventListener('click', function () {
    if (!back) { pillTxt.textContent = 'Checking the line…'; probe(); return; }
    clearTimeout(goTimer);
    if (pillBtn.textContent === 'Stay & practice') {
      stayed = true;
      pillTxt.textContent = 'The floor is back';
      pillBtn.textContent = 'Return to the floor';
      return;
    }
    go();
  });
  window.addEventListener('online', probe);
  window.addEventListener('pageshow', probe);
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) probe();
  });

  /* ---- boot --------------------------------------------- */
  buildShoe();
  renderShoe();
  renderBank();
  renderBet();
  renderTotals();
  syncUI();
  renderCoach();
  renderCount();
  renderEvStrip();                 /* the restored book draws at boot, beside the pill */
  setStatus('Place your bet');
  probe();
})();
</script>
</body>
</html>
