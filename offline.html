<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b2b1d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>999 Casino — Practice shoe</title>
<link rel="icon" href="media/icon-192.png">
<link rel="apple-touch-icon" href="media/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  /* the floor's own tokens (see login-16x9.html) — the offline
     state is not a waiting room: it IS a table. A practice shoe,
     cosmetic chips, no ledger — the felt keeps you in the game
     until the line returns.                                  */
  :root {
    --felt:  #1f6b45;
    --deep:  #0b2b1d;
    --rail:  #241a12;
    --accent:#d8b56a;
    --ink:   #f4ead2;
    --print: #f7f1e2;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; display: flex; flex-direction: column; overflow: hidden;
    background: var(--deep); color: var(--ink); user-select: none;
    font-family: -apple-system, "SF Pro Display", "Segoe UI", Roboto, system-ui, sans-serif;
  }

  /* ---- top bar: brand, the line, the tray ---------------- */
  .top {
    display: flex; align-items: center; gap: 0.8em; flex-wrap: wrap;
    padding: 0.5em 0.9em; padding-top: calc(0.5em + env(safe-area-inset-top));
    background: rgba(5, 14, 10, 0.55);
  }
  .brand { display: flex; align-items: center; gap: 0.55em; }
  .brand svg { width: 2em; height: 2em; flex: none; }
  .brand b { font-family: Georgia, "Times New Roman", serif; letter-spacing: 0.06em; color: var(--print); }
  .brand span { font-size: 0.7em; letter-spacing: 0.26em; text-transform: uppercase; opacity: 0.62; }
  .bank {
    display: flex; align-items: center; gap: 0.45em;
    font-variant-numeric: tabular-nums; font-weight: 600;
  }
  .bank i {
    width: 1.05em; height: 1.05em; border-radius: 50%; flex: none;
    background: var(--accent); border: 2px dashed var(--deep);
  }
  .pill {
    display: inline-flex; align-items: center; gap: 0.6em;
    padding: 0.32em 0.5em 0.32em 0.85em;
    border: 1px solid color-mix(in srgb, var(--accent) 38%, transparent);
    border-radius: 999px; font-size: 0.78em; letter-spacing: 0.04em;
    color: color-mix(in srgb, var(--ink) 80%, transparent);
  }
  .dot {
    width: 0.6em; height: 0.6em; border-radius: 50%; flex: none;
    background: var(--accent); animation: pulse 1.6s ease-in-out infinite;
  }
  body.back .dot { background: #79d9a4; animation: none; }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%      { opacity: 0.35; transform: scale(0.8); }
  }
  .link {
    border: 0; background: none; padding: 0.2em 0.5em; border-radius: 0.5em;
    font: inherit; font-weight: 600; cursor: pointer;
    color: var(--accent);
  }
  .link:hover, .link:focus-visible { background: rgba(216, 181, 106, 0.14); }
  .link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---- the felt ------------------------------------------ */
  .felt {
    position: relative; flex: 1; min-height: 0; overflow: hidden;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 0.8em 1em;
    background: radial-gradient(115% 105% at 50% 42%, var(--felt), var(--deep) 93%);
  }
  .print {
    position: absolute; inset: 0; pointer-events: none;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.5em;
  }
  .print h2 {
    margin: 0; font-family: Georgia, "Times New Roman", serif; font-weight: 800;
    letter-spacing: 0.32em; text-indent: 0.32em; color: rgba(247, 241, 226, 0.10);
    font-size: clamp(1.1em, 4.4vw, 2.3em);
  }
  .print p {
    margin: 0; font-size: clamp(0.52em, 1.5vw, 0.76em);
    letter-spacing: 0.28em; text-indent: 0.28em; color: rgba(247, 241, 226, 0.09);
  }
  .row { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; gap: 0.4em; }
  .who { font-size: 0.68em; letter-spacing: 0.26em; text-transform: uppercase; opacity: 0.65; }
  .hand {
    display: flex; gap: 0.35em; min-height: calc(clamp(46px, 8.5vw, 74px) * 1.4);
    align-items: flex-end;
  }
  .total {
    min-width: 2.4em; padding: 0.12em 0.6em; border-radius: 999px;
    background: rgba(5, 14, 10, 0.55); border: 1px solid rgba(216, 181, 106, 0.25);
    font-size: 0.82em; font-weight: 700; font-variant-numeric: tabular-nums;
  }
  .total.bust { color: #e0705f; border-color: rgba(224, 112, 95, 0.5); }
  .total.win  { color: #79d9a4; border-color: rgba(121, 217, 164, 0.5); }
  /* a split: two to four hands side by side, each with its own
     total; the hand in play is lit, a finished one dims     */
  .hand.split { gap: 1.1em; align-items: flex-start; }
  .phand { display: flex; flex-direction: column; align-items: center; gap: 0.3em;
    padding: 0.25em 0.4em; border-radius: 10px; border: 1px solid transparent; }
  .phand.active { border-color: rgba(216, 181, 106, 0.55); background: rgba(216, 181, 106, 0.07); }
  .phand.done { opacity: 0.55; }
  .phand-cards { display: flex; gap: 0.28em; align-items: flex-end; }
  .phand-total { min-width: 2.2em; padding: 0.05em 0.5em; border-radius: 999px;
    background: rgba(5, 14, 10, 0.55); border: 1px solid rgba(216, 181, 106, 0.25);
    font-size: 0.72em; font-weight: 700; font-variant-numeric: tabular-nums; }
  .phand-total.bust { color: #e0705f; border-color: rgba(224, 112, 95, 0.5); }

  /* cards — the readable-table rule in 2D: rank prints in the
     corner strip, ten prints "10", red stays red             */
  .card {
    position: relative; width: clamp(46px, 8.5vw, 74px); aspect-ratio: 320 / 448;
    border-radius: 6px; background: #f7f2e6; color: #191410;
    box-shadow: 0 3px 10px rgba(0, 0, 0, 0.4);
    font-family: Georgia, "Times New Roman", serif; font-weight: 700;
    animation: deal 0.45s ease-out both;
  }
  .card.red { color: #b3242c; }
  .card .r  { position: absolute; top: 3%; left: 8%; font-size: 0.8em; line-height: 1.05; }
  .card .rs { position: absolute; top: 20%; left: 8%; font-size: 0.55em; line-height: 1; }
  .card .pip {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 1.45em;
  }
  .card .r2 {
    position: absolute; bottom: 3%; right: 8%; font-size: 0.8em; line-height: 1.05;
    transform: rotate(180deg);
  }
  .card.back {
    background:
      repeating-linear-gradient(45deg,
        rgba(216, 181, 106, 0.14) 0 3px, transparent 3px 8px),
      repeating-linear-gradient(-45deg,
        rgba(216, 181, 106, 0.14) 0 3px, transparent 3px 8px),
      var(--deep);
    border: 2px solid rgba(216, 181, 106, 0.55);
    color: var(--accent);
    display: flex; align-items: center; justify-content: center;
  }
  .card.back span { font-size: 0.85em; letter-spacing: 0.05em; }
  @keyframes deal {
    from { transform: translate(34vw, -24vh) rotate(9deg) scale(0.92); opacity: 0; }
  }

  /* mid: the status, the shoe and its meter ---------------- */
  .mid { position: relative; z-index: 2; display: flex; align-items: center; justify-content: center; }
  .status {
    display: inline-flex; align-items: center; gap: 0.65em; margin: 0;
    padding: 0.42em 1em; border-radius: 999px; max-width: 78%;
    background: rgba(5, 14, 10, 0.5); border: 1px solid rgba(216, 181, 106, 0.18);
    font-size: 0.86em; letter-spacing: 0.04em; text-align: center;
  }
  .status .dot { animation: none; background: var(--accent); }
  .shoe {
    position: absolute; right: 0.2em; top: 50%; transform: translateY(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 0.4em;
  }
  .shoebox {
    position: relative; width: clamp(54px, 9vw, 86px); height: clamp(38px, 6.4vw, 60px);
    border-radius: 6px; background: rgba(5, 14, 10, 0.6);
    border: 1px solid rgba(216, 181, 106, 0.3);
  }
  .half {
    position: absolute; top: 14%; width: 38%; height: 72%; border-radius: 3px;
    background: var(--deep); border: 1.5px solid rgba(216, 181, 106, 0.55);
    transition: transform 0.55s ease;
  }
  .half.a { left: 8%; }
  .half.b { right: 8%; }
  .shoebox.riffle .half.a { transform: translateX(28%) rotate(-6deg); animation: riffleA 1.8s ease-in-out; }
  .shoebox.riffle .half.b { transform: translateX(-28%) rotate(6deg); animation: riffleB 1.8s ease-in-out; }
  @keyframes riffleA {
    0%   { transform: translateX(0) rotate(0); }
    22%  { transform: translateX(30%) rotate(-7deg); }
    75%  { transform: translateX(26%) rotate(-2deg); }
    100% { transform: translateX(20%) rotate(0); }
  }
  @keyframes riffleB {
    0%   { transform: translateX(0) rotate(0); }
    22%  { transform: translateX(-30%) rotate(7deg); }
    75%  { transform: translateX(-26%) rotate(2deg); }
    100% { transform: translateX(-20%) rotate(0); }
  }
  .meter {
    width: clamp(54px, 9vw, 86px); height: 4px; border-radius: 2px;
    background: rgba(5, 14, 10, 0.6); overflow: hidden;
  }
  .meter i { display: block; height: 100%; background: var(--accent); transition: width 0.4s ease; }
  .meterlabel { font-size: 0.62em; letter-spacing: 0.18em; text-transform: uppercase; opacity: 0.55; }

  /* the bet spot + cosmetic chips -------------------------- */
  .spot {
    position: relative; margin-top: 0.2em;
    min-width: 7.5em; min-height: 2.2em;
    border: 1px dashed rgba(247, 241, 226, 0.22); border-radius: 999px;
    display: flex; align-items: center; justify-content: center;
  }
  .stack { position: absolute; bottom: 0.25em; left: 0.6em; height: 2.6em; }
  .chev {
    position: absolute; width: 1.55em; height: 1.55em; border-radius: 50%;
    border: 3px dashed rgba(5, 14, 10, 0.75);
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.45), inset 0 0 0 2px rgba(255, 255, 255, 0.18);
    animation: drop 0.32s ease-out both;
  }
  @keyframes drop {
    from { transform: translateY(-1.4em) scale(0.85); opacity: 0; }
  }
  .betamt { font-size: 0.88em; font-weight: 700; font-variant-numeric: tabular-nums; padding: 0 0.4em; }

  .pay {
    position: absolute; left: 50%; top: -1.7em; transform: translateX(-50%);
    font-weight: 800; font-size: 1.05em; pointer-events: none;
    color: #79d9a4; text-shadow: 0 2px 6px rgba(0, 0, 0, 0.55);
    animation: payrise 1.7s ease-out both;
  }
  .pay.lose { color: #e0705f; }
  @keyframes payrise {
    0%   { opacity: 0; transform: translate(-50%, 0.6em); }
    14%  { opacity: 1; }
    75%  { opacity: 1; }
    100% { opacity: 0; transform: translate(-50%, -1.3em); }
  }

  /* ---- action bar ---------------------------------------- */
  .bar {
    display: flex; align-items: center; justify-content: center; gap: 0.55em; flex-wrap: wrap;
    padding: 0.6em 0.9em; padding-bottom: calc(0.6em + env(safe-area-inset-bottom));
    background: rgba(5, 14, 10, 0.55);
  }
  .chipbtn {
    width: 2.9em; height: 2.9em; border-radius: 50%; cursor: pointer;
    border: 4px dashed rgba(5, 14, 10, 0.75);
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.45), inset 0 0 0 2px rgba(255, 255, 255, 0.2);
    font: inherit; font-weight: 800; font-size: 0.8em; color: var(--ink);
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
  }
  .chipbtn:active { transform: translateY(1px); }
  .chipbtn:disabled { opacity: 0.35; cursor: default; }
  .chipbtn.c25  { background: #2f9e63; }
  .chipbtn.c100 { background: #241a12; color: var(--accent); }
  .chipbtn.c500 { background: #c84444; }
  .btn {
    padding: 0.72em 1.35em; border: 0; border-radius: 0.8em;
    font: inherit; font-weight: 700; letter-spacing: 0.05em; cursor: pointer;
    color: var(--rail);
    background: linear-gradient(180deg,
      color-mix(in srgb, var(--accent) 88%, white),
      color-mix(in srgb, var(--accent) 78%, black));
  }
  .btn.ghost {
    color: var(--ink); background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.14);
  }
  .btn:active { transform: translateY(1px); }
  .btn:disabled { opacity: 0.35; cursor: default; transform: none; }
  .btn:focus-visible, .chipbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  @media (prefers-reduced-motion: reduce) {
    .card, .chev, .pay, .dot { animation: none; }
    .half, .meter i { transition: none; }
    .leaks .evleft .evbar i { animation: none; }   /* the bars and the numbers they
                                                       accompany hold still together */
    .evstrip b.luck.crossed { animation: none; }   /* the crossings still MARK: the
                                                       colour and the band are the
                                                       fact, the bloom is only emphasis */
  }
  /* ---- the coach: book marks + the session score --------- */
  .coachpill {
    display: inline-flex; align-items: center; gap: 0.45em;
    padding: 0.5em 0.85em; border-radius: 999px; border: 1px solid rgba(255,255,255,0.16);
    background: rgba(255,255,255,0.06); color: inherit; font: inherit; font-size: 0.78em;
    letter-spacing: 0.06em; cursor: pointer;
  }
  .coachpill.off { opacity: 0.55; }
  .coachhint {
    margin: 0.35em 0 0; min-height: 1em; font-size: 0.72em; letter-spacing: 0.12em;
    text-transform: uppercase; color: rgba(255,255,255,0.72);
  }
  .coachhint.ok { color: #43c98a; }
  .coachhint.miss { color: #e2705f; }
  .btn.book { position: relative; outline: 2px solid #2f9e63; outline-offset: 2px; }
  .btn.book::after {
    content: 'book'; position: absolute; top: -0.72em; right: -0.28em;
    font-size: 0.58em; letter-spacing: 0.14em; text-transform: uppercase;
    color: #0d1c13; background: #43c98a; border-radius: 999px; padding: 0.22em 0.62em;
  }
  .btn.hit-ok { outline: 2px solid #43c98a; outline-offset: 2px; }
  .btn.miss { outline: 2px solid #c84444; outline-offset: 2px; animation: coachMiss 0.55s ease; }
  @keyframes coachMiss {
    0% { transform: translateX(0); }
    22% { transform: translateX(-3px); }
    44% { transform: translateX(3px); }
    66% { transform: translateX(-2px); }
    100% { transform: translateX(0); }
  }
  /* ---- Hi-Lo counting drills ---------------------------- */
  .countlabel {
    margin-top: 0.35em; font-size: 0.72em; letter-spacing: 0.12em;
    text-transform: uppercase; color: rgba(255,255,255,0.72);
  }
  .countlabel.pos { color: #43c98a; }
  .countlabel.neg { color: #e2705f; }
  .bethint { margin: 0.25em 0 0; font-size: 0.68em; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(216,181,106,0.8); }
  .drill {
    position: fixed; left: 50%; bottom: 5.4em; transform: translateX(-50%);
    width: min(21em, 86vw); padding: 0.85em 1em 1em; border-radius: 1em;
    background: rgba(14, 20, 18, 0.94); border: 1px solid rgba(255,255,255,0.14);
    box-shadow: 0 0.7em 2em rgba(0,0,0,0.45); text-align: center; z-index: 40;
  }
  .drill .dq { margin: 0 0 0.6em; font-size: 0.72em; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(255,255,255,0.72); }
  .stepper { display: flex; align-items: center; justify-content: center; gap: 0.7em; margin-bottom: 0.7em; }
  .dval { font-size: 1.5em; font-weight: 700; min-width: 2.4em; }
  .dbtn {
    width: 2.4em; height: 2.4em; border-radius: 0.8em; border: 1px solid rgba(255,255,255,0.18);
    background: rgba(255,255,255,0.08); color: inherit; font: inherit; font-size: 1.1em; cursor: pointer;
  }
  .drill .btn { margin: 0 0.3em; }
  .dverdict { margin: 0.6em 0 0; min-height: 1em; font-size: 0.78em; letter-spacing: 0.08em; text-transform: uppercase; }
  .dverdict.ok { color: #43c98a; }
  .dverdict.miss { color: #e2705f; }
  .leaks {
    position: relative; z-index: 1;   /* the panels read and take taps above the shoe */
    margin: 0.7em auto 0; max-width: 30em; text-align: left;
    background: rgba(0,0,0,0.25); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 8px; padding: 0.6em 0.9em; font-size: 0.78em;
  }
  .leaks h3 { margin: 0 0 0.4em; font-size: 0.8em; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(255,255,255,0.6); }
  .leaks ol { margin: 0; padding-left: 1.2em; }
  .leaks li { margin: 0.15em 0; color: rgba(255,255,255,0.85); }
  .leaks li.grad { opacity: 0.55; }
  .leaks li.master { color: #d8b56a; }   /* mastered: out of the drill, worn in gold */
  .leaks li.cooling { opacity: 0.5; }    /* cooled past half its toll: the row fades */
  .leaks .cool { margin-left: 0.35em; color: #7fa7c4; font-size: 0.9em; white-space: nowrap; }
  .leaks .pull { color: rgba(255,255,255,0.6); font-size: 0.9em; white-space: nowrap; }  /* the cooled pull, beside the honest cost */
  .leaks .leakwin { margin: 0.4em 0 0; font-size: 0.9em; letter-spacing: 0.04em; color: rgba(255,255,255,0.55); }
  /* both memories share the row and the chip's own look: the age
     picks and the drill-hand picks are the same kind of control  */
  .leaks .leakwin .lw, .leaks .leakwin .dh, .leaks .leakwin .df { cursor: pointer; color: rgba(255,255,255,0.5); text-decoration: underline dotted; }
  .leaks .leakwin .lw.on, .leaks .leakwin .dh.on, .leaks .leakwin .df.on { color: #d8b56a; text-decoration: none; font-weight: bold; }   /* the live half-life */
  .leaks .viewtabs { margin: 0 0 0.45em; font-size: 0.9em; letter-spacing: 0.06em; }
  .leaks .viewtabs span { cursor: pointer; color: rgba(255,255,255,0.45); text-decoration: underline dotted; }
  .leaks .viewtabs span.on { color: #d8b56a; text-decoration: none; font-weight: bold; }
  .leaks .drilltap { cursor: pointer; color: #d8b56a; text-decoration: underline dotted; white-space: nowrap; }
  .leaks .wk { margin-left: 0.35em; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .leaks .wk.down { color: #43c98a; }   /* bleeding less than last week: the fix holds */
  .leaks .wk.up { color: #e2705f; }     /* bleeding more: the row warns */
  .leaks .wk.flat { color: rgba(255,255,255,0.45); }
  .leaks .spark { margin-left: 0.35em; font-size: 1.1em; line-height: 1; letter-spacing: -0.06em;
                   white-space: nowrap; }   /* the glyphs are ONE run: wrapped they read as a block */
  /* the line is a control: a dotted underline says so, a focus ring
     says it to a keyboard, and the open shape says it to everyone  */
  .leaks .sparktap { cursor: pointer; display: inline-block; vertical-align: baseline; }
  .leaks .sparktap .spark { margin-left: 0.35em; text-decoration: underline dotted rgba(255,255,255,0.28); text-underline-offset: 0.22em; }
  .leaks .sparktap:hover .spark, .leaks .sparktap:focus-visible .spark { text-decoration-color: rgba(255,255,255,0.7); }
  .leaks .sparktap:focus-visible { outline: 1px solid #d8b56a; outline-offset: 2px; border-radius: 2px; }
  /* the ladder opens as its row's OWN next line, never over the next
     one: it is the same series unrolled, so it wants the row's space */
  .leaks .sparkdetail { display: flex; flex-wrap: wrap; gap: 0.15em 0.75em; margin: 0.3em 0 0.1em 0.4em;
                        padding-left: 0.5em; border-left: 2px solid rgba(255,255,255,0.14);
                        font-variant-numeric: tabular-nums; font-size: 0.9em; color: rgba(255,255,255,0.75); }
  .leaks .sparkdetail .sw { white-space: nowrap; }
  .leaks .sparkdetail .sw b { color: rgba(255,255,255,0.5); font-weight: 400; }
  .leaks .sparkdetail .sw.sum { color: #d8b56a; }
  .leaks .sparkdetail .sw.sum b { color: #d8b56a; }
  /* inside a bar row the panel is narrow, so the ladder reads tighter
     and never claims the bar's own line width                   */
  .leaks .evrow + .sparkdetail { font-size: 0.84em; line-height: 1.5; gap: 0 0.55em; }
  .leaks .spark.down { color: #43c98a; }   /* the line falls: leaking less than it used to */
  .leaks .spark.up { color: #e2705f; }     /* the line climbs: leaking more */
  .leaks .spark.flat { color: rgba(255,255,255,0.5); }
  .leaks b { color: #e2705f; }
  .idx b { color: #d8b56a; }
  .idx li.live { color: #d8b56a; }   /* a flip: the row goes gold the count it crosses */
  .idx .ixrec { font-variant-numeric: tabular-nums; }
  .idx .ixrec.all { color: #43c98a; }    /* every offer taken: the play is owned */
  .idx .ixrec.never { color: #e2705f; }  /* no offer taken: the play keeps missing */
  .idx .ixrec.ixtap { cursor: pointer; text-decoration: underline dotted; }  /* the never record drills from the sheet */
  .idx .ixasktap { cursor: pointer; text-decoration: underline dotted; }  /* a just-refused ask comes straight back */
  .idx .ixpull { color: rgba(255,255,255,0.72); }  /* the weighting the draw is reading right now */
  .idx .ixdrill { cursor: pointer; color: #d8b56a; text-decoration: underline dotted; white-space: nowrap; }  /* a grade's miss, one tap from the drill */
  .idx .ixrec.part { color: rgba(255,255,255,0.6); }
  .idx .ixrecent { color: rgba(255,255,255,0.62); }
  .idx .ixbadge { text-transform: uppercase; letter-spacing: 0.08em; font-size: 0.92em; }

<script>
(function () {
  'use strict';

  /* ============================================================
     The practice shoe (no ledger, cosmetic chips).

     This page IS the offline state: not a waiting room but a
     single-player table. Two decks at the shoe, a cut card at
     75% penetration, the riffle ceremony between shoes, and the
     same audio vocabulary as the live table — all synthesis,
     gated by the app's own 🔊 toggle (999.table.audio).

     Settlement lives in ONE place (settle): blackjack pays 3:2,
     a win 1:1, a push returns the stake — the felt never
     re-derives the money. Chips are cosmetic; the real ledger
     belongs to the floor and the hub behind it.

     The worker lands the player here carrying the page they were
     bound for (offline.html?from=<url>); when the line returns
     the pill offers the door straight back to exactly that page —
     immediately when only the shoe is running, never yanked out
     of a hand in play. Connectivity is probed against our OWN
     origin with a no-store touch the worker passes through and
     never caches. No external hosts, ever.                    */

  /* ---- the practice state ------------------------------- */
  var DECKS = 2;                    /* a double-deck shoe */
  var CUT = 26;                     /* the cut: cards REMAINING before the riffle (reshaped per shoe) */
  var SUIT = ['\u2660', '\u2665', '\u2666', '\u2663'];   /* spade heart diamond club */
  var RED = [false, true, true, false];

  var phase = 'betting';            /* betting | shuffling | dealing | acting | dealer | settle */
  var drillFree = false;           /* a bar tap's hand: the house staked it, so it
                                     never books - no chips, no luck figure, no
                                     EV-left entry invented for a hand nobody bet on */
  var drillReopen = false;         /* that tap wants its panel back on the next hand */
  var drillChart = null;           /* the chart drill in flight: the cell a bar named */
  var drillReport = null;          /* and what that one hand of it actually recovered */
  var bank = 1000, bet = 0, doubled = false;
  var you = [], dealerArr = [], shoeArr = [];
  /* the round's hands: a clean deal is one hand, a split is two to
     four. `you` always points at the ACTIVE hand's cards, so the
     coach, the price and the drill read the hand in play; the meta
     rides beside it. DAS on, resplit to four, split aces take one
     card and stand.                                        */
  var hands = [], splitActive = 0;
  function activeHand() { return hands[splitActive] || null; }
  function syncYou() { var h = activeHand(); you = h ? h.cards : []; }
  function handStakeTotal() { var s = 0, i; for (i = 0; i < hands.length; i++) s += hands[i].stake; return s; }
  function handRank(card) {
    return card.rank === 'A' ? 'A' : ['10', 'J', 'Q', 'K'].indexOf(card.rank) >= 0 ? '10' : card.rank;
  }
  function pairRank(cards) {          /* the pair's split rank-value ('A','10','2'..'9'), or null */
    if (!cards || cards.length !== 2) return null;
    var a = handRank(cards[0]), b = handRank(cards[1]);
    return a === b ? a : null;
  }
  function canSplitHand(h) {
    if (!h || h.aces || h.done || h.cards.length !== 2) return false;
    return !!(pairRank(h.cards) && hands.length < 4 && bank >= bet);
  }

  try {
    /* parseFloat: 3:2 payouts leave half-chips behind and the
       tray keeps every one of them                       */
    var saved = parseFloat(localStorage.getItem('999.practice.stack'));
    if (isFinite(saved) && saved >= 0) bank = saved;
  } catch (e) { }
  if (bank < 25) { bank = 1000; saveBank(); }   /* a stranded tray refills at boot */
  function saveBank() {
    try { localStorage.setItem('999.practice.stack', String(bank)); } catch (e) { }
  }
  function fmt(n) { return n % 1 ? n.toFixed(1) : n.toLocaleString(); }

  /* ---- the coach: basic strategy + the session score ------ */
  /* The book for THIS shoe: two decks, S17, no split. The
     coach marks the book play at every decision, judges the
     click against it and keeps the score — the practice
     floor's whole advantage over the live table.            */
  var coachOn = true;
  var coachStats = { decisions: 0, book: 0, streak: 0, best: 0, loss: 0, lossBase: 0 };
  /* the leak ledger: every miss lands on its book cell —
     "hard 16 v 10" — with the chips it cost, so the coach
     knows where the money leaks and can drill it later      */
  var leaks = {};
  try {
    var lk = JSON.parse(localStorage.getItem('999.practice.leaks') || 'null');
    if (lk && typeof lk === 'object') leaks = lk;
  } catch (e) { }
  function leakKey(soft, t, up) {
    return (soft ? 'soft ' : 'hard ') + t + ' v ' + up;
  }
  /* a ledger kept for months measures months. The drills
     should follow THIS week's leaks, so a cell's pull on the
     queue is its toll decayed by age — a week's half-life, so
     a month-old blow is worth a sixteenth — AND by the drill
     itself: heavy drilling retires stale leaks on its own, so
     the pull also halves every LEAK_DRILL_HALF hands served
     since the cell was last stamped. The two decay factors
     bite together and the result is CAPPED, so one distant
     disaster can never sit at the top of the queue for good.
     The stored cost stays honest for the panel; only the
     ranking cools. A cell the felt never stamped reads as
     fresh: the decay begins at its first re-stamp.          */
  var LEAK_CAP = 100, LEAK_DRILL_HALF = 250;
  /* the fade window: how fast a leak cools with AGE. A week is
     the default, but the player sets it — a grind-heavy stretch
     wants a short memory, a long-running ledger a long one. The
     presets below are the whole menu and the pick persists.
     LEAK_HALF is the live half-life leakWeight reads.          */
  var LEAK_HALF_DEFAULT = 7 * 24 * 60 * 60 * 1000;
  var LEAK_WINDOWS = [
    { ms: 3 * 24 * 60 * 60 * 1000, label: '3d' },
    { ms: 7 * 24 * 60 * 60 * 1000, label: '1w' },
    { ms: 14 * 24 * 60 * 60 * 1000, label: '2w' },
    { ms: 30 * 24 * 60 * 60 * 1000, label: '1m' }
  ];
  var LEAK_HALF = LEAK_HALF_DEFAULT;
  try {
    var lhRaw = JSON.parse(localStorage.getItem('999.practice.leakhalf') || 'null');
    if (lhRaw && typeof lhRaw.ms === 'number' && lhRaw.ms > 0) LEAK_HALF = lhRaw.ms;
  } catch (e) { }
  function saveHalf() {
    try { localStorage.setItem('999.practice.leakhalf', JSON.stringify({ ms: LEAK_HALF })); } catch (e) { }
  }
  function leakWindowLabel() {
    var i;
    for (i = 0; i < LEAK_WINDOWS.length; i++) if (LEAK_WINDOWS[i].ms === LEAK_HALF) return LEAK_WINDOWS[i].label;
    return Math.round(LEAK_HALF / (24 * 60 * 60 * 1000)) + 'd';
  }
  function setLeakHalf(ms) {
    if (!(ms > 0)) return false;
    LEAK_HALF = ms;
    saveHalf();
    return true;
  }
  /* the drill's own half-life is the player's too: hands served since
     the stamp, each LEAK_DRILL_HALF of them halving the pull. Age and
     drilling are two different memories and a player may want one
     short and the other long, so both are set in the same panel row
     and both persist. The presets are the whole menu; the pick rides
     beside the window's, so neither reset touches the other.    */
  var LEAK_DRILLS = [
    { n: 100, label: '100' },
    { n: 250, label: '250' },
    { n: 500, label: '500' },
    { n: 1000, label: '1k' }
  ];
  try {
    var dhRaw = JSON.parse(localStorage.getItem('999.practice.drillhalf') || 'null');
    if (dhRaw && typeof dhRaw.n === 'number' && dhRaw.n > 0) LEAK_DRILL_HALF = dhRaw.n;
  } catch (e) { }
  function saveDrillHalf() {
    try { localStorage.setItem('999.practice.drillhalf', JSON.stringify({ n: LEAK_DRILL_HALF })); } catch (e) { }
  }
  function drillHalfLabel() {
    var i;
    for (i = 0; i < LEAK_DRILLS.length; i++) if (LEAK_DRILLS[i].n === LEAK_DRILL_HALF) return LEAK_DRILLS[i].label;
    return String(LEAK_DRILL_HALF);
  }
  function setDrillHalf(n) {
    if (!(n > 0)) return false;
    LEAK_DRILL_HALF = n;
    saveDrillHalf();
    return true;
  }
  /* which mistake source feeds the drill is the player's too: the felt
     (a hand played against the book) and the quiz (a card blown) both
     pour into the same ledger, and a player may want only one of them
     in it — a quiz-only ledger drills what the cards catch, a felt-only
     one what the shoe catches, without the other's noise. The tolls
     already in the ledger stay; the switch only shut the taps.       */
  var DRILL_FEEDS = [
    { id: 'both', label: 'both' },
    { id: 'felt', label: 'felt only' },
    { id: 'quiz', label: 'quiz only' }
  ];
  var drillFeed = 'both';
  try {
    var dfRaw = JSON.parse(localStorage.getItem('999.practice.drillfeed') || 'null');
    if (dfRaw && DRILL_FEEDS.some(function (f) { return f.id === dfRaw.src; })) drillFeed = dfRaw.src;
  } catch (e) { }
  function saveDrillFeed() {
    try { localStorage.setItem('999.practice.drillfeed', JSON.stringify({ src: drillFeed })); } catch (e) { }
  }
  function setDrillFeed(src) {
    if (DRILL_FEEDS.every(function (f) { return f.id !== src; }) || src === drillFeed) return false;
    drillFeed = src;
    saveDrillFeed();
    return true;
  }
  function drillFeeds(src) { return drillFeed === 'both' || drillFeed === src; }
  /* a cooled cell should read as fading, not merely rank lower:
     COOL_AT is the share of its toll below which a row wears the
     fade. The retention itself is just the ranking's own weight
     over the honest cost — the two decay factors, made visible. */
  var COOL_AT = 0.5;
  function leakWeight(e, now, drills) {
    if (!e || !e.n) return 0;

  function burst(c, t, dur, type, freq, q, gain, out) {
    var s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = noise(c);
    f.type = type; f.frequency.value = freq;
    if (q) f.Q.value = q;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(gain, t + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(out || master);
    s.start(t); s.stop(t + dur + 0.03);
  }
  function cardWhoosh(delay, panFrom, panTo) {
    /* the slide carries the card's seat: it pans from the shoe
       to the hand it lands in - on this table a short slide,
       the shoe sits just right of the felt's center        */
    var c = ready(); if (!c) return;
    var t = c.currentTime + (delay || 0), D = 0.4;
    var s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = noise(c);
    f.type = 'bandpass'; f.Q.value = 0.8;
    f.frequency.setValueAtTime(720 + Math.random() * 260, t);
    f.frequency.exponentialRampToValueAtTime(2100, t + D * 0.7);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.05, t + D * 0.45);
    g.gain.exponentialRampToValueAtTime(0.0001, t + D);
    s.connect(f); f.connect(g);
    if (panFrom != null && c.createStereoPanner) {
      var p = c.createStereoPanner();
      p.pan.setValueAtTime(panSeatClamp(panFrom, -1, 1), t);
      if (panTo != null) p.pan.linearRampToValueAtTime(panSeatClamp(panTo, -1, 1), t + D);
      g.connect(p); p.connect(master);
    } else {
      g.connect(master);
    }
    s.start(t); s.stop(t + D + 0.03);
  }
  function cardSnap(delay, pan) {
    var c = ready(); if (!c) return;
    var t = c.currentTime + (delay || 0);
    var out = null;
    if (pan != null && c.createStereoPanner) {
      out = c.createStereoPanner();
      out.pan.setValueAtTime(panSeatClamp(pan, -1, 1), t);
      out.connect(master);
    }
    burst(c, t, 0.045, 'bandpass', 3000, 0.9, 0.2, out);
    burst(c, t, 0.02, 'highpass', 5200, 0, 0.09, out);
  }
  function chipClack(delay) {
    var c = ready(); if (!c) return;
    var t = c.currentTime + (delay || 0);
    burst(c, t, 0.05, 'bandpass', 2600, 1.6, 0.28);
    tone(c, 300, t, 0.075, 'triangle', 0.18, 170);
  }
  function riffleSound(pan) {
    /* the halves lift, the riffle runs, the deck squares up —
       and all of it happens at the SHOE, seated from the shoe's
       own screen position: the ceremony that made this deck used
       to sound like it came from nowhere, while every card left
       it a beat later from exactly this place. It is all paper
       standing still, so the pan is a HELD seat, never a slide.
       No pan: the plain centre the floor had before          */
    var c = ready(); if (!c) return;
    var t = c.currentTime + 0.02;
    var out = null;
    if (pan != null && c.createStereoPanner) {
      out = c.createStereoPanner();
      out.pan.setValueAtTime(panSeatClamp(pan, -1, 1), t);
      out.connect(master);
    }
    burst(c, t + 0.04, 0.3, 'bandpass', 850, 0.7, 0.08, out);
    for (var k = 0; k < 14; k++) {
      var at = t + 0.4 + k * 0.05;
      burst(c, at, 0.05, 'bandpass', 1500 + Math.random() * 1400, 2.6, 0.1, out);
      if (k % 3 === 0) tone(c, 240 + Math.random() * 60, at, 0.05, 'triangle', 0.03, 170, out);
    }
    burst(c, t + 1.25, 0.05, 'bandpass', 1900, 1.2, 0.11, out);
    tone(c, 190, t + 1.25, 0.09, 'triangle', 0.13, 120, out);
    burst(c, t + 1.45, 0.05, 'bandpass', 1500, 1.2, 0.1, out);
    tone(c, 165, t + 1.45, 0.11, 'triangle', 0.12, 105, out);
  }
  /* the coach's voice: a bright two-note tick at a book play,
     a low sigh at a deviation — quiet, and never over the felt */
  function coachCue(ok) {
    var c = ready(); if (!c) return;
    var t = c.currentTime;
    if (ok) {
      tone(c, 880, t, 0.09, 'triangle', 0.05);
      tone(c, 1318.51, t + 0.075, 0.13, 'triangle', 0.04);
    } else {
      tone(c, 220, t, 0.18, 'triangle', 0.05, 165);
    }
  }
  function stinger(kind) {
    var c = ready(); if (!c) return;
    var t = c.currentTime + 0.02;
    if (kind === 'win') {
      tone(c, 523.25, t, 0.32, 'triangle', 0.17);
      tone(c, 659.25, t + 0.09, 0.32, 'triangle', 0.17);
      tone(c, 783.99, t + 0.18, 0.55, 'triangle', 0.19);
      tone(c, 1567.98, t + 0.18, 0.5, 'sine', 0.06);
    } else {
      tone(c, 392, t, 0.22, 'triangle', 0.14, 262);
      tone(c, 196, t + 0.13, 0.42, 'sine', 0.12, 147);
    }
  }

  /* ---- rendering ---------------------------------------- */
  var elBank = document.getElementById('bankTxt');
  var elBet = document.getElementById('betAmt');
  var elStack = document.getElementById('betStack');
  var elYou = document.getElementById('youCards');
  var elDealer = document.getElementById('dealerCards');
  var elYouTotal = document.getElementById('youTotal');
  var elDealerTotal = document.getElementById('dealerTotal');
  var statusTxt = document.getElementById('statusTxt');
  /* the settle line is a score line too: its luck clause arrives as
     its own argument so it can ride as the same tap the pill's
     carries, instead of being flattened into the sentence. Every
     other caller passes one string and is unaffected.           */
  function setStatus(s, luck) { setScore(statusTxt, s, luck || '', ''); }

  var CHIP_VIEWS = [{ v: 25, c: '#2f9e63' }, { v: 100, c: '#241a12' }, { v: 500, c: '#c84444' }];

  function cardEl(card, faceDown) {
    var el = document.createElement('div');
    el.className = 'card' + (faceDown ? ' back' : (RED[card.suit] ? ' red' : ''));
    if (faceDown) {
      el.innerHTML = '<span>999</span>';
    } else {
      el.innerHTML = '<span class="r">' + card.rank + '</span>' +
        '<span class="rs">' + SUIT[card.suit] + '</span>' +
        '<span class="pip">' + SUIT[card.suit] + '</span>' +
        '<span class="r2">' + card.rank + '</span>';
    }
    return el;
  }
  function renderHand(el, hand) {
    el.innerHTML = '';
    for (var i = 0; i < hand.length; i++) el.appendChild(cardEl(hand[i]));
  }
  function landCard(el, card) {
    /* the card lands where it flew — append, never redraw, so
       the cards already on the cloth stay put                */
    el.appendChild(cardEl(card));
    /* on a split, the hand's own total badge follows its landing */
    if (el === elYou && hands.length > 1) {
      var ph = elYou.querySelectorAll('.phand')[splitActive];
      var tot = ph && ph.querySelector('.phand-total');
      if (tot && hands[splitActive]) {
        var t = total(hands[splitActive].cards);
        tot.textContent = t > 21 ? 'BUST' : String(t);
        tot.className = 'phand-total' + (t > 21 ? ' bust' : '');
      }
    }
  }
  /* the felt's player side: one hand draws as ever; a split draws
     two to four, each with its own total and the hand in play lit */
  function youTarget() {                       /* where the active hand's cards land */
    if (hands.length <= 1) return elYou;
    var ph = elYou.querySelectorAll('.phand')[splitActive];
    return (ph && ph.querySelector('.phand-cards')) || elYou;
  }
  function renderYou() {
    if (hands.length <= 1) { renderHand(elYou, hands[0] ? hands[0].cards : you); renderYouTotal(); return; }
    elYou.innerHTML = '';
    for (var i = 0; i < hands.length; i++) {
      var ph = document.createElement('div');
      ph.className = 'phand' + (i === splitActive ? ' active' : '') + (hands[i].done ? ' done' : '');
      var box = document.createElement('div');
      box.className = 'phand-cards';
      for (var c = 0; c < hands[i].cards.length; c++) box.appendChild(cardEl(hands[i].cards[c]));
      var tot = document.createElement('span');
      var t = total(hands[i].cards);
      tot.className = 'phand-total' + (t > 21 ? ' bust' : '');
      tot.textContent = t > 21 ? 'BUST' : String(t);
      ph.appendChild(box); ph.appendChild(tot);
      elYou.appendChild(ph);
    }
    renderYouTotal();
  }
  function renderYouTotal() {
    elYouTotal.className = 'total';
    if (hands.length > 1) { elYouTotal.textContent = hands.length + ' hands'; return; }
    var h = hands[0];
    if (h && h.cards.length) {
      var y = total(h.cards);
      elYouTotal.textContent = y > 21 ? 'BUST' : String(y);
      if (y > 21) elYouTotal.className = 'total bust';
    } else elYouTotal.textContent = '\u2014';
  }
  function renderTotals() {
    renderYouTotal();
    elDealerTotal.className = 'total';
    if (dealerArr.length) {
      var d = total(dealerArr);
      elDealerTotal.textContent = d > 21 ? 'BUST' : String(d);
      if (d > 21) elDealerTotal.className = 'total bust';
    } else elDealerTotal.textContent = '\u2014';
  }
  function renderBet() {
    elBet.textContent = 'Bet ' + fmt(bet) + (insBet ? ' + ' + fmt(insBet) + ' ins' : '');
    elStack.innerHTML = '';
    /* the felt keeps the chips: one chevron per denomination     */
    var left = bet, slot = 0;
    for (var i = CHIP_VIEWS.length - 1; i >= 0; i--) {
      while (left >= CHIP_VIEWS[i].v) {
        var ch = document.createElement('span');
        ch.className = 'chev';
        ch.style.background = CHIP_VIEWS[i].c;
        ch.style.bottom = (slot % 6) * 0.22 + 'em';
        ch.style.left = Math.floor(slot / 6) * 0.34 + 'em';
        elStack.appendChild(ch);
        left -= CHIP_VIEWS[i].v;
        slot++;
      }
    }
  }
  function renderShoe() {
    document.getElementById('meterFill').style.width = shoePct() + '%';
    document.getElementById('shoeLabel').textContent = 'Shoe ' + shoePct() + '%' +
      (countingOn ? ' \u00b7 ' + (shoeArr.length / 52).toFixed(1) + ' dk' : '');   /* the counter's decks left */
  }
  function renderBank() { elBank.textContent = fmt(bank); }

  function syncUI() {
    var betting = phase === 'betting', acting = phase === 'acting';
    document.getElementById('chip25').disabled = !betting || bank < 25;
    document.getElementById('chip100').disabled = !betting || bank < 100;
    document.getElementById('chip500').disabled = !betting || bank < 500;
    document.getElementById('btnClear').disabled = !betting || !bet;
    document.getElementById('btnDeal').disabled = !betting || !bet || drillOpen;
    document.getElementById('btnHit').disabled = !acting;
    document.getElementById('btnStand').disabled = !acting;
    var ah = activeHand(), aStake = ah ? ah.stake : bet;
    document.getElementById('btnDouble').disabled = !acting || !ah || ah.aces || ah.cards.length !== 2 || bank < aStake;
    var bsp = document.getElementById('btnSplit');
    if (bsp) bsp.disabled = !acting || !canSplitHand(ah);
    var insuring = phase === 'insurance';
    document.getElementById('btnInsYes').hidden = !insuring;
    document.getElementById('btnInsNo').hidden = !insuring;
    renderCount();                 /* the hint follows the phase */
    syncMuteBtn();
  }

  /* cosmetic chips: bank -> felt the moment the chip lands,
     back -> bank on Clear. The bank is memory only — no ledger. */
  function placeChip(v) {
    if (phase !== 'betting' || bank < v) return;
    bank -= v; bet += v;
    chipClack(0.03);
    renderBank(); renderBet(); syncUI();
  }
  function clearBet() {
    if (phase !== 'betting' || !bet) return;
    bank += bet; bet = 0;
    chipClack(0.03);
    renderBank(); renderBet(); syncUI();
  }

  /* ---- the round machine -------------------------------- */
  /* Deal order (spec 4.5, European, one box): one to the box,
     one to the dealer, a second to the box — ~0.62s apart, each
     card a whoosh in the air and a snap on the cloth.          */
  var DEAL_BEAT = 620;

  function dealCard(to) {
    var hand = to === 'you' ? you : dealerArr;
    /* the card is captured at the shoe: a landing that runs
       late must land THIS card, never the next one. Its sound
       carries the seat: a whoosh from the shoe's screen side to
       the hand it lands in, and the snap lands at that hand   */
    var card = draw();
    hand.push(card);
    var dest = to === 'you' ? youTarget() : elDealer;
    var seat = panForSeat(to === 'you' ? elYou : elDealer);
    cardWhoosh(0, panForSeat(document.getElementById('shoeBox')), seat);
    cardSnap(0.42, seat);
    later(430, function () {
      landCard(dest, card);
      renderTotals();
      renderShoe();
      tagCard(card.rank);   /* the counter sees the card when it lands */
    });
  }

  function deal() {
    if (phase !== 'betting' || (!bet && !drillFree)) return;
    if (SPEED.on && SPEED.phase !== 'idle') speedClose();   /* a deal kills a running drill */
    token++;
    doubled = false;
    insBet = 0; insOpen = false;
    roundNo++;
    evRound = !reviewMode && !drillFree; evPriced = false; evRoundExp = 0; evInsExp = 0;
    spreadUnitsStake = { units: bet / 25, tc: trueCount() };   /* the stake rides the count it was laid at */
    hands = [{ cards: [], stake: bet, doubled: false, aces: false, done: false, split: false }];
    splitActive = 0;
    you = hands[0].cards;
    dealerArr = [];
    leakDeal();                                   /* leaks mode stacks the shoe here */
    reviewDeal();                                 /* review mode reals the reel here */
    replayBookBook();                             /* the book's play rides along */
    if (reviewMode) {                             /* the house stakes the replay: the
                                                     stake comes straight back, so a
                                                     win is pure upside and a miss
                                                     costs nothing the second time  */
      bank += bet;
      saveBank();
      renderBank();
    }
    renderYou(); renderHand(elDealer, dealerArr); renderTotals();
    phase = 'dealing';
    syncUI();
    setStatus('Dealing \u2014 one to the box, one to the dealer');
    later(250, function () { dealCard('you'); });
    later(250 + DEAL_BEAT, function () { dealCard('dealer'); });
    later(250 + DEAL_BEAT * 2, function () { dealCard('you'); });
    later(250 + DEAL_BEAT * 3 + 300, maybeInsurance);
  }

  function advanceHand() {                 /* the next hand still to act, or none */
    var i;
    for (i = splitActive + 1; i < hands.length; i++) if (!hands[i].done) { splitActive = i; syncYou(); return true; }
    for (i = 0; i < hands.length; i++) if (!hands[i].done) { splitActive = i; syncYou(); return true; }
    return false;
  }
  function handDone() {                    /* this hand is finished: the next, or the dealer */
    var h = activeHand();
    if (h) h.done = true;
    renderYou();
    if (advanceHand()) beginTurn();
    else dealerTurn();
  }
  function beginTurn() {
    var h = activeHand();
    if (h && h.done) { if (!advanceHand()) { dealerTurn(); return; } h = activeHand(); }
    if (!h) { dealerTurn(); return; }
    syncYou();
    if (total(h.cards) >= 21) {          /* 21 or bust stands, then the next hand */
      coachHide(); h.done = true; renderYou();
      later(650, function () { if (advanceHand()) beginTurn(); else dealerTurn(); });
      return;
    }
    phase = 'acting';
    syncUI();
    renderYou();
    setStatus(hands.length > 1
      ? 'Hand ' + (splitActive + 1) + ' of ' + hands.length + ' \u2014 hit, stand' + (canSplitHand(h) ? ', split' : '') + ' or double'
      : 'Your move \u2014 hit, stand or double');
    coachMark();
  }
  function hit() {
    if (phase !== 'acting') return;
    evPrice('hit');
    coachVerdict('hit');
    phase = 'dealing';
    syncUI();
    dealCard('you');
    if (fork && fork.kind === 'hit' && fork.branch === 0) {
      shoeArr.push(you[you.length - 1]);   /* the book leg meets this same card */
      fork.branch = 1;
    }
    later(650, beginTurn);
  }
  function stand() {
    if (phase !== 'acting') return;
    evPrice('stand');
    coachVerdict('stand');
    handDone();
  }
  function doubleDown() {
    var h = activeHand();
    if (phase !== 'acting' || !h || h.aces || h.cards.length !== 2 || bank < h.stake) return;
    evPrice('double');
    coachVerdict('double');
    bank -= h.stake; h.stake *= 2; h.doubled = true;
    renderBank(); renderBet();
    chipClack(0.03);
    phase = 'dealing';
    syncUI();
    dealCard('you');
    if (fork && fork.kind === 'double' && fork.branch === 0) {
      shoeArr.push(you[you.length - 1]);   /* the book's double draws this same card */
      fork.branch = 1;
    }
    /* one card, then it stands — the double's price */
    later(650, function () { var hh = activeHand(); if (hh) hh.done = true; if (advanceHand()) beginTurn(); else dealerTurn(); });
  }
  /* split: the pair separates into two hands, each staked, each
     drawing one card. Split aces take one card and stand; DAS is
     on; a fresh pair may be split again up to four hands.     */
  function splitHand() {
    var h = activeHand();
    if (phase !== 'acting' || !canSplitHand(h)) return;
    evPrice('split');                       /* a split carries no placed price */
    coachVerdict('split');
    bank -= bet;                            /* the second stake, laid on the new hand */
    var a = h.cards[0], b = h.cards[1];
    var left = { cards: [a], stake: bet, doubled: false, aces: handRank(a) === 'A', done: false, split: true };
    var right = { cards: [b], stake: bet, doubled: false, aces: handRank(b) === 'A', done: false, split: true };
    hands.splice(splitActive, 1, left, right);   /* the left hand keeps the floor */
    syncYou();
    left.cards.push(draw());                /* each new hand draws one card */
    right.cards.push(draw());
    if (left.aces) left.done = true;        /* split aces: one card each, then stand */
    if (right.aces) right.done = true;
    renderBank(); renderBet(); renderShoe();
    chipClack(0.03);
    phase = 'dealing';
    syncUI();
    renderYou();
    setStatus(left.aces && right.aces
      ? 'Split aces \u2014 one card each, then the dealer'
      : 'Split \u2014 ' + hands.length + ' hands, hand ' + (splitActive + 1) + ' first');
    later(650, beginTurn);
  }

  /* ---- insurance: the count's own bet ----------------------
     No chart row — insurance is pure composition. Half the
     stake pays 2:1 when the dealer's hole card is a ten, so
     the bet turns when tens fill the shoe: true +3 by the
     index, or sooner where the exact density already says so.
     The house shows the ace, the player answers, and the
     coach explains whichever way the count points.           */
  var insBet = 0, insOpen = false, insBook = null;
  var roundNo = 0;                     /* the reel tags each miss with its round,
                                          so settle can back-fill the hole card */
  function bookInsurance() {
    var tc = trueCount(), edge = INDEX999.insEdge(shoeArr);
    return { play: (tc >= INDEX999.INSURE_AT || edge > 0) ? 'insure' : 'no', tc: tc, edge: edge };
  }
  function coachInsuranceMark() {
    insBook = null;
    clearCoachMarks();
    if (!coachOn) return;
    insBook = bookInsurance();
    var b = document.getElementById(insBook.play === 'insure' ? 'btnInsYes' : 'btnInsNo');
    if (b) b.classList.add('book');
    coachHint.hidden = false;
    coachHint.className = 'coachhint';
    coachHint.textContent = insBook.play === 'insure'
      ? 'Book: Insure \u2014 ' + INDEX999.INS_WHY_IN +
        ' (true ' + fmtCount(insBook.tc) + ', edge ' +
        (insBook.edge >= 0 ? '+' : '\u2212') + Math.abs(insBook.edge * 100).toFixed(1) + '%)'
      : 'Book: Decline \u2014 ' + INDEX999.INS_WHY_OUT +
        ' (now true ' + fmtCount(insBook.tc) + ')';
  }
  function coachInsuranceVerdict(choice) {
    if (!coachOn || !insBook) return;
    var pick = choice === 'insure' ? 'insure' : 'no';   /* the click's word vs
                                    the book's word — same bet, one name */
    var ok = pick === insBook.play;
    var cost = 0;
    if (!ok) cost = Math.abs(insBook.edge) * Math.max(1, Math.floor(bet / 2));
    coachStats.decisions++;
    if (insBook.play === 'insure') {       /* the count's own bet against the chart's
                                              decline — an index ask like any other */
      ixStats.asked++;
      if (ok) ixStats.followed++;
      var ibc = ixStats.byCell['insurance v ace'] || (ixStats.byCell['insurance v ace'] = { asked: 0, followed: 0 });
      ibc.asked++;
      if (ok) ibc.followed++;
      noteIxSit('insurance v ace', ok);
      pushIxAsk('insurance v ace', insBook.tc, ok);
      saveIx();
    }
    if (ok) {
      coachStats.book++;
      coachStats.streak++;
      if (coachStats.streak > coachStats.best) coachStats.best = coachStats.streak;
      gradClean('insurance v ace');          /* a clean answer counts toward graduation */
    } else {
      coachStats.streak = 0;
      coachStats.loss += cost;
      /* the side bet lands in the ledgers by the same path a hand miss
         does — the drill clock stamps it, and a first of its class
         opens the panel on its own */
      if (drillFeeds('felt') && leakMiss('insurance v ace', cost)) leakAutoOpen();
      replay.push({                    /* the reel keeps it like any other miss */
        yc: [you[0].rank, you[1].rank], ys: [you[0].suit, you[1].suit],
        up: 'A', us: dealerArr[0].suit,
        t: total(you), soft: isSoft(you),
        choice: pick === 'no' ? 'decline' : 'insure',
        book: insBook.play === 'no' ? 'decline' : 'insure',
        cost: Math.round(cost * 100) / 100,
        cell: 'insurance v ace', round: roundNo
      });
      if (replay.length > 12) replay.shift();
      saveReplay();
      var rb = document.getElementById('btnReview');
      if (rb) rb.hidden = false;
    }
    saveCoach();
    renderCoach();
    ['btnInsYes', 'btnInsNo'].forEach(function (id) {
      var el = document.getElementById(id);
      if (el) el.classList.remove('book');
    });
    var b = document.getElementById(choice === 'insure' ? 'btnInsYes' : 'btnInsNo');
    if (b) b.classList.add(ok ? 'hit-ok' : 'miss');
    coachHint.hidden = false;
    coachHint.className = 'coachhint ' + (ok ? 'ok' : 'miss');
    coachHint.textContent = ok ? '\u2713 Book play'
      : 'Book says ' + (insBook.play === 'insure' ? 'Insure' : 'Decline') +
        ' \u2014 ' + (insBook.play === 'insure' ? INDEX999.INS_WHY_IN : INDEX999.INS_WHY_OUT);
    coachCue(ok);
    insBook = null;
    later(2400, function () {
      ['btnInsYes', 'btnInsNo'].forEach(function (id) {
        var el = document.getElementById(id);
        if (el) el.classList.remove('miss', 'hit-ok');
      });
      if (coachHint && lastBook === null) coachHint.hidden = true;   /* a newer
        mark (the hand's own book badge) is not ours to take */
    });
  }
  function takeInsurance(yes) {
    if (!insOpen) return;
    insOpen = false;
    coachInsuranceVerdict(yes ? 'insure' : 'decline');
    if (yes) {
      insBet = Math.floor(bet / 2);
      evInsPrice();
      bank -= insBet;
      saveBank();
      renderBank();
      renderBet();                     /* the tray shows the side bet */
      chipClack(0.03);
    }
    if (yes) setStatus('Insured for ' + fmt(insBet));
    else setStatus('No insurance \u2014 play the hand');
    if (coachOn) later(1400, beginTurn);   /* the verdict gets its beat before
                                              the book re-marks the hand    */
    else beginTurn();
  }

  /* insurance is offered the moment the ace shows, before the

  /* settlement (spec 5) — computed HERE and nowhere else:
     blackjack 3:2, win 1:1, push returns the stake.           */
  function settle() {
    phase = 'settle';
    var insStake = insBet;        /* the strip prices the side bet's movement too */
    /* insurance resolves first: the count's side bet pays 2:1
       when the hole card completes the dealer's natural        */
    var insWin = 0;
    if (insBet) {
      if (dealerArr.length === 2 && SHOE999.total(dealerArr) === 21) insWin = insBet * 3;
      bank += insWin;
      insBet = 0;
      saveBank();
      renderBank();
      renderBet();                     /* the tray drops the side bet */
    }
    /* settle every hand by the canon against the same dealer hand:
       a clean deal is one, a split is two to four               */
    var results = [], st = null, totalPrize = 0, myNet = 0, i;
    for (i = 0; i < hands.length; i++) {
      var hs = SHOE999.settle(hands[i].cards, dealerArr, hands[i].stake);
      results.push(hs);
      totalPrize += hs.prize;
      myNet += hs.net;
      if (i === 0) st = hs;                     /* the head hand is the round's face */
    }
    if (!st) st = SHOE999.settle(you, dealerArr, bet);   /* safety: never */
    var myStake = handStakeTotal();
    /* the settle line's luck note, the table's own sentence: the
       round's felt against the round's engine price, the one number
       both books bank. Built only when the round was priced, so an
       unpriced round narrates nothing it cannot stand behind.   */
    var luckNote = '';
    /* the strip's own arithmetic: the engine's expectation against
       the felt's movement - one round, committed once             */
    if (evRound && evPriced) {
      evSession.rounds++;
      evSession.ev += evRoundExp + evInsExp;
      evSession.felt += myNet + insWin - insStake;
      evSession.sd2 += Math.pow(HAND_SD * (doubled ? 2 * bet : bet), 2);   /* the round's own
                                width — a double rides twice the stake, twice the spread */
      saveEv();
      noteLuck();                      /* the extremes ride the same commit as the band */
      renderEvStrip();
      renderCoach();                   /* the pill's luck reads the same commit */
      luckNote = ' \u00b7 ' + LUCK999.word({ felt: myNet + insWin - insStake, ev: evRoundExp + evInsExp }) +
        ' luck, both felts reconcile';   /* the settle line says it in the table's
                                            own words: one sentence, two surfaces — and
                                            the clause is the way into the strip, so the
                                            number it reports can be opened, not only read */
    }
    /* the reel learns the hole card only now: the European deal
       keeps it in the shoe through the player's decision, so every
       miss recorded this round is back-filled with the card the
       dealer actually held — the review can replay the hand
       against the SAME dealer hand, not one like it           */
    if (dealerArr[1] && replay.length) {
      for (var ri = 0; ri < replay.length; ri++) {
        if (!replay[ri].hole && replay[ri].round === roundNo) {
          replay[ri].hole = dealerArr[1].rank;
          replay[ri].holes = dealerArr[1].suit;
        }
      }
      saveReplay();
    }
    /* side-by-side: the book's leg on the SAME dealer hand — a
       hit/double book pops the same card your play drew; a stand
       book stands on the original two. Both outcomes are kept on
       the reel entry for the panel.                          */
    var bookNote = '';
    if (fork) {
      var cur = replay[(reviewIdx + replay.length - 1) % replay.length];
      /* the book's leg is priced on the ORIGINAL two cards — the hand
         the miss was made on — never on the hand the replay has since
         built, so a stand-book stands where it should and a hit-book
         draws from the original hand                       */
      var fk;
      if (fork.kind === 'split') {
        /* the book's split leg: the pair separates and each hand
           plays out by the chart on the SAME dealer hand        */
        fk = bookSplitLeg(cur, dealerArr, bet);
      } else {
        var bookCards = cur && cur.yc
          ? [{ rank: cur.yc[0], suit: cur.ys ? cur.ys[0] : 0 }, { rank: cur.yc[1], suit: cur.ys ? cur.ys[1] : 0 }]
          : you.slice();
        var bookStake = bet, bookDraw = null;
        if (fork.kind !== 'stand') bookDraw = shoeArr.pop();
        if (bookDraw) bookCards.push(bookDraw);
        if (fork.kind === 'double') bookStake = bet * 2;
        var bs = SHOE999.settle(bookCards, dealerArr, bookStake);
        fk = { net: bs.net, stake: bookStake };
      }
      bookNote = ' \u2014 the book\'s ' + fork.kind + ' would have ' + forkWord(fk.net, fk.stake);
      if (cur) {
        cur.forkYou = forkWord(myNet, myStake);
        cur.forkBook = forkWord(fk.net, fk.stake);
        if (cur.cell) {                        /* the divergence feeds the drill: the
                                                  misplayed hand is queued back to be
                                                  forced the book's way            */
          forkQueue(cur.cell);
          bookNote += ' \u00b7 queued for the drill: ' + cur.cell;
        }
        saveReplay();
      }
      forkStats.forks++;                         /* the fork's own score: did the
                                                    book's leg beat the replayed one */
      if (fk.net > myNet) forkStats.book++;
      saveForks();
      fork = null;
    }
    var wins = 0, loses = 0;
    for (i = 0; i < results.length; i++) {
      if (results[i].kind === 'win' || results[i].kind === 'blackjack') wins++;
      else if (results[i].kind !== 'push') loses++;
    }
    var kind;
    if (results.length <= 1) kind = { 'bust': 'Bust \u2014 the house takes it', 'blackjack': 'Blackjack! Pays 3 to 2',
                 'win': 'You win', 'push': 'Push \u2014 the stake comes back', 'lose': 'Dealer takes it' }[st.kind];
    else kind = myNet > 0 ? 'You win \u2014 ' + wins + ' of ' + results.length + ' hands'
              : myNet < 0 ? 'Dealer takes it \u2014 ' + loses + ' of ' + results.length + ' hands'
              : 'Push \u2014 the hands split the stakes';
    var delta = totalPrize;
    bank += delta;
    saveBank();
    renderBank();
    var net = myNet;
    if (net > 0) elYouTotal.className = 'total win';
    /* the spread judge: was the stake the count's advice? A
       shortfall is priced like a strategy miss — the edge the
       bigger stake would have bought, in chips               */
    var spNote = '';
    if (spreadUnitsStake && countingOn && bet > 0) {
      var laidUnits = Math.round(spreadUnitsStake.units * 10) / 10;
      var wantUnits = spreadUnits(spreadUnitsStake.tc);
      var gapCost = spreadCost(laidUnits, spreadUnitsStake.tc, bet);
      spreadStats.judged++;
      if (gapCost <= 0) spreadStats.onCount++;
      else spreadStats.cost += gapCost;
      saveSpread();
      if (gapCost > 0) {
        spNote = ' \u2014 the spread wanted ' + wantUnits + ' unit' + (wantUnits > 1 ? 's' : '') +
          ' (true ' + fmtCount(spreadUnitsStake.tc) + '): \u2212' + gapCost.toFixed(1) + ' unplayed';
      }
    }
    setStatus(kind + (insWin ? ' \u2014 insurance pays ' + fmt(insWin) : '') + spNote + bookNote, luckNote);
    /* the +delta floats at the total — the settlement's own number */
    if (net !== 0) {
      var pay = document.createElement('div');
      pay.className = 'pay' + (net < 0 ? ' lose' : '');
      pay.textContent = (net > 0 ? '+' : '\u2212') + fmt(Math.abs(net));
      pay.style.left = 'auto'; pay.style.right = '0.2em'; pay.style.top = '-1.2em'; pay.style.transform = 'none';
      document.getElementById('youCards').appendChild(pay);
      later(1800, function () { if (pay.parentNode) pay.parentNode.removeChild(pay); });
    }
    if ((results.length <= 1 && st.kind === 'blackjack') || net > 0) stinger('win');
    else if (net < 0) stinger('lose');
    /* a push is silent apart from its returning chips */
    if (delta) chipClack(0.15);
    syncUI();
    later(2300, newRound);
  }

  /* ---- the speed drill: cards flash, you count, the clock runs
     A fresh single deck streams at a set cadence; you keep the
     running count in your head and recall it against the clock.
     The stream is independent of the table shoe — the session
     meter stays honest and the runs repeat forever. Timing is
     REAL time, outside the round machine's clock.            */
  var SPEED = { on: false, pace: 0.45, N: 15, stream: [], idx: 0, adapt: true, mode: 'run',
                target: 0, val: 0, recallT0: 0, timer: 0, ticker: 0, phase: 'idle' };
  try { SPEED.pace = parseFloat(localStorage.getItem('999.practice.speed')) || 0.45; } catch (e) { }
  try { SPEED.adapt = localStorage.getItem('999.practice.speedadapt') !== 'off'; } catch (e) { }
  try { SPEED.mode = localStorage.getItem('999.practice.speedmode') === 'true' ? 'true' : 'run'; } catch (e) { }
  /* each drill tunes its OWN cadence: the running drill and the
     true-count drill remember separate paces, so pressing one
     never drags the other off its edge                   */
  SPEED.paceRun = SPEED.pace;
  try {
    var paceT = parseFloat(localStorage.getItem('999.practice.speedtruepace'));
    SPEED.paceTrue = isFinite(paceT) ? paceT : SPEED.pace;   /* the true drill
                                                starts where the run drill stands */
  } catch (e) { SPEED.paceTrue = SPEED.pace; }
  if (SPEED.mode === 'true') SPEED.pace = SPEED.paceTrue;
  /* the adaptive cadence chases a PERSONAL edge: a hit tightens
     the stream by 6% of the current pace (never less than 20ms),
     a miss eases it back by 12% (never less than 40ms). A hot
     streak presses harder (8%, min 25ms) and a miss that breaks
     a long streak eases gently (8%, min 20ms) — the drill rides
     your best run without punishing the collapse. Bounded
     between 0.18s and 0.75s a card. The pace buttons still set
     the base each mode evolves from.                           */
  function nextPace(pace, ok, heat) {
    var hot = (heat || 0) >= 3;
    var step = ok ? (hot ? Math.max(0.025, pace * 0.08) : Math.max(0.02, pace * 0.06))
                  : (hot ? Math.max(0.02, pace * 0.08) : Math.max(0.04, pace * 0.12));
    var p = ok ? pace - step : pace + step;
    return Math.round(Math.min(0.75, Math.max(0.18, p)) * 1000) / 1000;
  }
  var speedScore = { runs: 0, right: 0, bestMs: 0, streak: 0, bestStreak: 0 };
  try {
    var sst = JSON.parse(localStorage.getItem('999.practice.speedstats') || 'null');
    if (sst && typeof sst.runs === 'number') speedScore = sst;
  } catch (e) { }
  /* the true-count drill keeps its own books: the same shape, a
     second key, so each mode's accuracy and bests stay honest */
  var speedTrue = { runs: 0, right: 0, bestMs: 0, streak: 0, bestStreak: 0 };
  try {
    var sstt = JSON.parse(localStorage.getItem('999.practice.speedtrue') || 'null');
    if (sstt && typeof sstt.runs === 'number') speedTrue = sstt;
  } catch (e) { }
  function speedStats() { return SPEED.mode === 'true' ? speedTrue : speedScore; }
  function speedMode(m) {
    if (SPEED.mode === m) return;
    SPEED.mode = m;
    SPEED.pace = m === 'true' ? SPEED.paceTrue : SPEED.paceRun;   /* each drill resumes its own cadence */
    try { localStorage.setItem('999.practice.speedmode', m); } catch (e) { }
    renderSpeed();                  /* the books swap, the buttons follow */
  }
  function speedTarget(stream) {
    var t = 0;
    for (var i = 0; i < stream.length; i++) t += (HILO[stream[i].rank] || 0);
    return t;
  }
  /* the true-count stream: a VARIABLE slice of the deck (15-35
     cards), so the decks-left readout is genuinely decimal and
     the answer earns its tenth. The deck is the stream's SOURCE
     of 52: the count rides the cards SEEN, the division by the
     decks LEFT — the same convention as the session meter.     */
  function trueTargetFor(rc, dkStr) {
    return Math.round((rc / parseFloat(dkStr)) * 10) / 10;
  }

      try {
      localStorage.setItem('999.practice.speedstats', JSON.stringify(speedScore));
