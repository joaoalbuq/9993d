<title>999 Casino — The table · fullscreen 16:9</title>
<style>
  /* ============================================================
     table-16x9.html — the fullscreen 16:9 table, REVAMP PREVIEW.
     The next side-by-side page after login-16x9.html: it sits
     beside the existing app and edits nothing.

     House rules kept from the revamp spec:
       · zero runtime dependencies, no CDN, no asset pipeline
       · the 3D stage is raw WebGL with runtime canvas textures
       · safe-area insets on every interactive element
       · no page scroll; the felt-filling stage owns the viewport
       · portrait is primary; landscape widens the camera, never crops
     Geometry follows the spec's table constants (see GEOMETRY).
     ============================================================ */

  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --felt:  #1f6b45;
    --deep:  #0b2b1d;
    --rail:  #241a12;
    --accent:#d8b56a;
    --ink:   #f4ead2;
    --print: #f7f1e2;
  }

  html, body { height: 100%; }
  body {
    background: var(--deep);
    color: var(--ink);
    font-family: -apple-system, "SF Pro Display", "Segoe UI", Roboto, Inter, system-ui, sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-font-smoothing: antialiased;
  }

  #gl {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    display: block; z-index: 0;
    touch-action: none;
  }

  /* projected totals / names — positioned per frame from the 3D camera */
  #labels { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
  .lab {
    position: absolute; transform: translate(-50%, -50%);
    text-align: center; white-space: nowrap;
    text-shadow: 0 2px 10px rgba(0,0,0,.75);
  }
  .lab b { display: block; font-size: 30px; font-weight: 800; letter-spacing: 0.02em; line-height: 1.05; }
  .lab span { display: block; margin-top: 2px; font-size: 11px; font-weight: 700; letter-spacing: 0.28em;
    opacity: 0.72; text-transform: uppercase; }
  .lab.win b { color: color-mix(in srgb, var(--accent) 92%, white); }
  .lab.lose b { opacity: 0.55; }
  .lab.bust b { color: #ff9d8a; }
  .pay {
    position: absolute; transform: translate(-50%, -50%);
    font-size: 26px; font-weight: 800; letter-spacing: 0.02em;
    color: color-mix(in srgb, var(--accent) 92%, white);
    text-shadow: 0 2px 12px rgba(0,0,0,.85); white-space: nowrap;
  }

  /* ---------- the 16:9 stage (HUD over the felt) ----------- */
  #stage {
    position: fixed; left: 50%; top: 50%;
    width: 1600px; height: 900px;
    transform: translate(-50%, -50%) scale(1);
    transform-origin: center;
    font-size: 24px;
    z-index: 2;
    pointer-events: none;
  }
  #stage > * { pointer-events: auto; }

  .hud-top {
    position: absolute; left: 3em; right: 3em; top: 2em;
    display: flex; align-items: center; justify-content: space-between; gap: 1em;
  }
  .brandchip {
    display: flex; align-items: center; gap: 0.7em;
    font-size: 0.72em; font-weight: 700; letter-spacing: 0.34em; text-transform: uppercase;
    color: color-mix(in srgb, var(--ink) 82%, transparent);
    background: rgba(5, 14, 10, 0.5);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
    border-radius: 2em; padding: 0.75em 1.3em;
  }
  .brandchip b { color: var(--accent); letter-spacing: 0.18em; }

  .shotpill {
    font-size: 0.66em; font-weight: 700; letter-spacing: 0.3em; text-transform: uppercase;
    color: color-mix(in srgb, var(--ink) 72%, transparent);
    background: rgba(5, 14, 10, 0.5);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border: 1px solid color-mix(in srgb, var(--accent) 25%, transparent);
    border-radius: 2em; padding: 0.75em 1.3em;
    transition: opacity .3s ease;
  }

  .tools {
    position: absolute; right: 3em; top: 6.2em;
    display: flex; flex-direction: column; align-items: flex-end; gap: 0.8em;
  }
  .tool {
    font: inherit; font-size: 0.68em; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--ink); background: rgba(5, 14, 10, 0.55);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border: 1px solid color-mix(in srgb, var(--accent) 32%, transparent);
    border-radius: 1.4em; padding: 0.8em 1.35em;
    cursor: pointer; text-decoration: none;
    touch-action: manipulation;
    flex-shrink: 0;
    transition: border-color .15s ease, transform .14s ease;
  }
  .tool:hover { border-color: color-mix(in srgb, var(--accent) 70%, transparent); }
  .tool:active { transform: translateY(1px) scale(0.99); }
  /* the signed-in wallet: the name and the balance the hub reported. When
     space is tight the NAME yields (ellipsis) — the balance never does. */
  .tool.wallet { cursor: default; display: flex; align-items: center;
    max-width: min(46vw, 24em); flex-shrink: 1; min-width: 0; }
  .tool.wallet:hover { border-color: color-mix(in srgb, var(--accent) 32%, transparent); }
  .tool.wallet b { color: var(--accent); min-width: 0; overflow: hidden;
    white-space: nowrap; text-overflow: ellipsis; }
  .tool.wallet .chips { flex-shrink: 0; white-space: nowrap; }

  .swatches { display: flex; gap: 0.5em; flex-shrink: 0; background: rgba(5, 14, 10, 0.5);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border: 1px solid color-mix(in srgb, var(--accent) 25%, transparent);
    border-radius: 2em; padding: 0.55em 0.75em; }
  .sw {
    width: 1.7em; height: 1.7em; border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.25);
    cursor: pointer; padding: 0;
    transition: transform .16s ease, box-shadow .16s ease;
  }
  .sw:hover { transform: translateY(-2px); }
  .sw[aria-pressed="true"] {
    box-shadow: 0 0 0 2px var(--deep), 0 0 0 4px var(--accent);
  }

  /* ---------- the thumb action bar ------------------------- */
  .bar {
    position: absolute; left: 50%; bottom: 0;
    transform: translateX(-50%);
    width: min(46em, calc(100% - 4em));
    display: flex; flex-direction: column; align-items: center; gap: 0.85em;
    padding: 1em 1.6em calc(1.1em + env(safe-area-inset-bottom));
    background: linear-gradient(180deg, rgba(5,14,10,0) 0%, rgba(5,14,10,0.72) 32%, rgba(5,14,10,0.92) 100%);
    border-radius: 2em 2em 0 0;
  }
  .status {
    font-size: 0.72em; font-weight: 700; letter-spacing: 0.32em; text-transform: uppercase;
    color: color-mix(in srgb, var(--ink) 82%, transparent);
    text-align: center; min-height: 1.2em;
  }
  .status .dot { display: inline-block; width: 0.62em; height: 0.62em; border-radius: 50%;
    background: var(--accent); margin-right: 0.7em; vertical-align: 0.06em; }
  /* The settle line's luck figure is a WAY IN, not just a number: a tap on it
     opens the reconciliation that measures it, the same gesture the practice
     floor already offers. Dotted so it reads as a door rather than a link to
     somewhere else, and gold because it is this table's own accent. */
  .status .luckclause { cursor: pointer; color: #d8b56a; letter-spacing: inherit;
    text-decoration: underline dotted; text-decoration-color: rgba(216,181,106,0.5);
    border-radius: 3px; }
  .status .luckclause:hover { text-decoration-color: rgba(216,181,106,0.95); }
  .status .luckclause:focus-visible { outline: 1px solid #d8b56a; outline-offset: 2px; }
  /* the overlay blooms once when it is opened by the tap, so the eye is told
     what answered rather than having to hunt for it */
  @keyframes luckopen { 0%, 100% { box-shadow: 0 0 0 rgba(216,181,106,0); }
                        35% { box-shadow: 0 0 1.1em rgba(216,181,106,0.55); } }
  .training.flash { animation: luckopen 1.4s ease-out; }
  @media (prefers-reduced-motion: reduce) {
    .training.flash { animation: none; box-shadow: 0 0 0.9em rgba(216,181,106,0.4); }
  }
  .acts { display: flex; gap: 0.7em; width: 100%; justify-content: center; }
  .act {
    flex: 1 1 0; max-width: 9.5em; height: 3.6em;
    border-radius: 1.3em; border: 1px solid color-mix(in srgb, var(--accent) 34%, transparent);
    background: rgba(255,255,255,0.08);
    color: var(--ink); font: inherit; font-size: 0.92em; font-weight: 700; letter-spacing: 0.06em;
    cursor: pointer; touch-action: manipulation;
    transition: transform .14s ease, filter .14s ease, opacity .14s ease;
  }
  .act.primary {
    border: none;
    background: linear-gradient(180deg,
      color-mix(in srgb, var(--accent) 88%, white),
      color-mix(in srgb, var(--accent) 78%, black));
    color: #171006;
  }
  .act:hover:not([disabled]) { filter: brightness(1.06); }
  .act:active:not([disabled]) { transform: translateY(1px) scale(0.985); }
  .act[disabled] { opacity: 0.38; cursor: default; }
  .act.book {
    box-shadow: 0 0 0 2px rgba(216,181,106,0.85);
    border-color: rgba(216,181,106,0.9);
    color: #f4e9c8;
  }
  .tool.on { color: #d8b56a; border-color: rgba(216,181,106,0.55); }
  .training {
    position: fixed; left: 12px; top: 56px; z-index: 6;
    background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.09);
    border-radius: 8px; padding: 0.5em 0.8em;
    font-size: 0.74em; letter-spacing: 0.06em; line-height: 1.55;
    color: #e8e4d8; font-variant-numeric: tabular-nums;
  }
  .training .evstrip {
    margin: 0.35em 0 0; letter-spacing: 0.08em; text-transform: uppercase;
    color: rgba(255,255,255,0.5);
  }
  .training .evstrip b { color: #d8b56a; font-variant-numeric: tabular-nums; }
  .training .evstrip .sd { text-transform: none; }   /* the sigma keeps its case: σ, not sum's Σ */
  .training .evstrip b.luck.ok { color: #43c98a; }   /* the SIGN alone: run-good, however far it runs */
  .training .evstrip b.luck.out { color: #e2705f; }  /* the felt behind the engine, however slightly */
  .training .evstrip b.luck.crossed { animation: luckpulse 1.2s ease-out; }   /* the draw the gap tops a spread */
  /* an outlier that STAYS out: the number itself carries it, so the eye can
     catch the session without reading the band word beside it. The resting
     shadow is the real signal and the breath only keeps it alive — under
     reduced motion the animation is dropped and the glow stays. */
  .training b.luck.over, .training span.luck.over { text-shadow: 0 0 0.5em currentColor;
    animation: luckglow 2.6s ease-in-out infinite; }
  @keyframes luckglow { 0%, 100% { text-shadow: 0 0 0.4em currentColor; }
                         50% { text-shadow: 0 0 0.85em currentColor; } }
  @keyframes luckpulse { 0%, 100% { text-shadow: 0 0 0 currentColor; } 40% { text-shadow: 0 0 0.7em currentColor; } }   /* a soft bloom in the tone's own colour */
  .training .evleft { margin-top: 0.5em; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 0.45em;
    min-width: 15em; }
  .training.review { max-width: 24em; max-height: calc(100vh - 7.5em); overflow-y: auto; }
    /* the report is placed BELOW the overlay by renderReview, from the
       overlay's own measured height: both panels are fixed at the same corner,
       and opening both is a normal thing to do — the strip stays live while the
       report is read. Pinning by height couples the two to each other's
       content, and pinning to the far corner collides on a narrow felt. */
  .training .rvtitle { margin: 0 0 0.4em; letter-spacing: 0.14em; text-transform: uppercase;
    font-size: 0.9em; color: rgba(255,255,255,0.6); }
  .training .rvnote { margin: 0 0 0.5em; color: rgba(255,255,255,0.5); font-size: 0.9em;
    line-height: 1.35; }
  .training .rvsc { margin: 0 0 0.4em; }
  .training .rvscrow { display: flex; align-items: baseline; gap: 0.45em; margin: 0.12em 0;
    font-variant-numeric: tabular-nums; }
  .training .rvscrow .rvcell { flex: 1 1 auto; color: rgba(255,255,255,0.85); white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }
  .training .rvscrow .rvn { color: rgba(255,255,255,0.45); font-size: 0.85em; }
  .training .rvscrow .rvcost { color: #e2705f; font-size: 0.95em; }
  .training .rvshare { color: rgba(255,255,255,0.45); font-size: 0.85em; }
  .training .rvscrow.evtap { cursor: pointer; border-radius: 3px; padding: 0.05em 0.2em; }
  .training .rvscrow.evtap:hover { background: rgba(216,181,106,0.08); }
  .training .rvscrow.evtap:hover .rvcell { color: #d8b56a; text-decoration: underline dotted; }
  .training .rvscrow.evseeded .rvcell { color: #d8b56a; text-decoration: underline dotted; }
  .training .rvscrow.evno { cursor: default; opacity: 0.55; }
  .training .rvhand { margin: 0.16em 0; color: rgba(255,255,255,0.75); font-size: 0.9em; }
  .training .rvhand b { color: #d8b56a; font-weight: normal; }
  .training .rvexit { cursor: pointer; color: rgba(255,255,255,0.5); text-decoration: underline dotted;
    margin: 0.5em 0 0; font-size: 0.85em; letter-spacing: 0.08em; text-transform: uppercase; }
  .training.review .evleft { margin-top: 0.6em; }
  .training .evleft .evtitle { margin: 0 0 0.35em; color: rgba(255,255,255,0.55); letter-spacing: 0.12em;
    text-transform: uppercase; font-size: 0.9em; }
  .training .evleft .evrow { display: flex; align-items: center; gap: 0.5em; margin: 0.2em 0; }
  .training .evleft .evrow .evcell { flex: 0 0 38%; color: rgba(255,255,255,0.85); white-space: nowrap; }
  .training .evleft .evrow .evbar { flex: 1; height: 0.62em; border-radius: 999px;
    background: rgba(255,255,255,0.12); overflow: hidden; }
  .training .evleft .evrow .evbar i { display: block; height: 100%; background: #e2705f;
    animation: evgrow 0.55s ease-out both; }   /* the bars grow in with the score, worst
    first and each a beat behind the last, so the eye reads them as one sweep
    settling into place rather than one row at a time appearing */
  .training .evleft .evrow .evdir { flex: 0 0 auto; font-size: 0.85em; line-height: 1; }
  .training .evleft .wk { margin-left: 0.35em; font-variant-numeric: tabular-nums;
    white-space: nowrap; }   /* the figures beside the arrow must not wrap away
                                 from it, or a cell reads as two answers */
  .training .evleft .evrow .evdir.down { color: #43c98a; }   /* leaking less than last week */
  .training .evleft .evrow .evdir.up { color: #e2705f; }     /* and leaking more */
  .training .evleft .evrow .evdir.flat { color: rgba(255,255,255,0.4); }
  /* the archived sessions, one to a scale so a run of luck is a shape
     rather than a number list */
  .training .luckhist { margin-top: 0.5em; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 0.45em;
    min-width: 15em; }
  .training .luckhist .lucktitle { margin: 0 0 0.35em; color: rgba(255,255,255,0.55); letter-spacing: 0.12em;
    text-transform: uppercase; font-size: 0.9em; }
  .training .luckhist .luckrow { display: flex; align-items: center; gap: 0.5em; margin: 0.18em 0; }
  /* ---- the Levels panel: hear and tune a voice without a round ---- */
  .levels { margin: 0.55em 0 0; font-size: 0.92em; color: rgba(255,255,255,0.85); }
  .levels .lvhead, .levels .lvfoot { margin: 0 0 0.4em; font-size: 0.9em; letter-spacing: 0.04em; color: rgba(255,255,255,0.55); }
  .levels .lvfoot { margin: 0.4em 0 0; }
  .levels .lvrow { display: flex; align-items: center; gap: 0.45em; margin: 0.16em 0; }
  .levels .lvrow.tuned .lvname { color: #d8b56a; }
  .levels .lvname { flex: 1 1 auto; cursor: help; }
  .levels .lvplay { cursor: pointer; color: #d8b56a; }
  .levels .lvstep { display: inline-flex; align-items: center; gap: 0.15em; }
  .levels .lvstep span { color: rgba(255,255,255,0.45); font-variant-numeric: tabular-nums; min-width: 1.1em; text-align: center; }
  .levels .lvstep .lvdown, .levels .lvstep .lvup { cursor: pointer; min-width: 0; }
  .levels .lvstep .lvdown:hover, .levels .lvstep .lvup:hover { color: #d8b56a; }
  .levels .lvval { color: rgba(255,255,255,0.75); }
  .levels .lvship { cursor: pointer; color: rgba(255,255,255,0.3); }
  .levels .lvrow.tuned .lvship { color: #d8b56a; }
  .levels .lvreset { cursor: pointer; color: #d8b56a; text-decoration: underline dotted; }
  .training .luckhist .luckbar { flex: 1; height: 0.5em; border-radius: 999px;
    background: rgba(255,255,255,0.12); overflow: hidden; }
  .training .luckhist .luckbar i { display: block; height: 100%; background: #d8b56a;
    animation: evgrow 0.55s ease-out both; }
  .training .luckhist .luckrow.good .luckbar i { background: #43c98a; }
  .training .luckhist .luckrow.bad .luckbar i { background: #e2705f; }
  .training .luckhist .luckrow b { flex: 0 0 auto; font-variant-numeric: tabular-nums; }
  .training .luckhist .luckrow.good b { color: #43c98a; }
  .training .luckhist .luckrow.bad b { color: #e2705f; }
  .training .luckhist .luckrow.even b { color: #d8b56a; }
  .training .luckhist .sd { color: rgba(255,255,255,0.4); font-variant-numeric: tabular-nums;
    white-space: nowrap; }   /* the sigma beside each archived row, the strip's own measure */
  .training .luckhist .sd.na { opacity: 0.6; }   /* a book from before the spread: the absence
                                                       reads quieter than a measurement, as on the strip */
  .training .luckhist .luckrow.over b { text-shadow: 0 0 0.5em currentColor;
    animation: luckglow 2.6s ease-in-out infinite; }   /* an archived freak still wears the glow the
                                                           live strip gives it: same test, same mark */
  .training .luckhist .luckrow .luckr { flex: 0 0 auto; color: rgba(255,255,255,0.4); font-size: 0.85em;
    font-variant-numeric: tabular-nums; }
  .training .evleft .evrow b { flex: 0 0 auto; font-variant-numeric: tabular-nums; }
  .training .evleft .evtotal { margin: 0.36em 0 0; color: rgba(255,255,255,0.6); }
  @keyframes evgrow { from { width: 0%; } }
  /* the chart is a way in, the way the practice floor's own bars are: a tap
     names the cell to its drill, and the row wears the name once it lands */
  .training .evleft .evrow.evtap { cursor: pointer; }
  .training .evleft .evrow.evtap:hover { background: rgba(216,181,106,0.08); }
  .training .evleft .evrow.evtap:hover .evcell { color: #d8b56a; text-decoration: underline dotted; }
  .training .evleft .evrow.evseeded .evcell { color: #d8b56a; text-decoration: underline dotted; }
  .training .evleft .evrow.evno { cursor: default; opacity: 0.55; }
  .training .evleft .evrow.evno:hover { background: none; }
  .training .evleft .evrow.evno .evcell { color: rgba(255,255,255,0.85); text-decoration: none; }
  /* the trend line, drawn beside the bar: the floor's sparkline on

  .training .evleft .evrow .spark { flex: 0 0 auto; margin-left: 0.35em; font-size: 1.05em;

  .training .evleft .evrow .sparkwk { cursor: pointer; border-radius: 2px; }
  .training .evleft .evrow .sparkwk:hover, .training .evleft .evrow .sparkwk:focus-visible {

  .training .evleft .evrow .sparkwk.on { color: #d8b56a; }   /* the week the figures are on */

  .training .evstrip .newbook { cursor: pointer; color: #d8b56a; text-decoration: underline dotted;
    text-decoration-color: rgba(216,181,106,0.5); position: relative; z-index: 3; }   /* the strip's own
    tap: a fresh book — lifted above the shoe, which overlays the strip on narrow felt */
  .training .bookreset { margin: 0.6em 0 0; letter-spacing: 0.08em; text-transform: uppercase;
    font-size: 0.85em; }
  .training .bookreset-tap { cursor: pointer; color: #d8b56a; text-decoration: underline dotted;
    text-decoration-color: rgba(216,181,106,0.5); }   /* the overlay's own wipe: the whole persisted book */
  .training .bookreset-tap.armed { color: #e2705f; text-decoration-color: rgba(226,112,95,0.6); }
    /* armed, and armed in the house red: this is the one control here that
       ends a sitting outright, and a stray click must never be one tap away */
  .act.chip.on {
    border-color: var(--accent);
    background: color-mix(in srgb, var(--accent) 26%, rgba(255,255,255,0.08));
  }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }

  /* ---------- phone landscape (short viewport) ------------- */
  body.compact #stage {
    inset: 0; left: 0; top: 0; width: auto; height: 100dvh; transform: none;
    font-size: clamp(11px, 2.7vh, 15px);
  }
  body.compact .hud-top { top: max(0.9em, env(safe-area-inset-top)); left: 1.4em; right: 1.4em; }
  body.compact .tools { top: 4.6em; right: 1.4em; }
  body.compact .bar {
    width: 100%; border-radius: 0;
    padding: 0.7em 1em calc(0.8em + env(safe-area-inset-bottom));
    flex-direction: row; justify-content: center;
  }
  body.compact .status { font-size: 0.62em; }
  body.compact .acts { width: auto; }
  body.compact .act { height: 3.2em; max-width: 7.6em; }

  /* ---------- portrait (phone / iPad upright) -------------- */
  body.stacked #stage {
    inset: 0; left: 0; top: 0; width: auto; height: 100dvh; transform: none;
    font-size: clamp(13px, 3.6vw, 19px);
  }
  body.stacked .hud-top {
    top: max(1em, env(safe-area-inset-top));
    left: max(1em, env(safe-area-inset-left)); right: max(1em, env(safe-area-inset-right));
  }
  body.stacked .shotpill { display: none; }
  /* …and the wallet takes the header's freed right slot, so the tools row
     stays all controls and the name keeps its letters */
  body.stacked .tool.wallet {
    position: fixed;
    top: max(1em, env(safe-area-inset-top));
    right: max(1em, env(safe-area-inset-right));
    max-width: min(52vw, 24em);
  }
  body.stacked .tools {
    top: auto; bottom: calc(9.4em + env(safe-area-inset-bottom));
    right: max(1em, env(safe-area-inset-right));
    max-width: calc(100% - 2em);              /* the row never outgrows the screen */
    flex-direction: row; align-items: center;
  }
  body.stacked .bar {
    width: 100%; border-radius: 2em 2em 0 0;
    padding: 0.9em 1.1em calc(1em + env(safe-area-inset-bottom));
  }
  body.stacked .act { height: 3.9em; }

  /* phones get fatter thumbs */
  body.phone .act { height: 4.1em; font-size: 1em; }
  body.phone .tool { padding: 0.95em 1.5em; }

  /* ---------- the rotate gate: phones/tablets go landscape ---
     Portrait is not an arrangement on a phone or tablet — it is a
     gate: turn sideways and the whole 16:9 screen is the table.   */
  #gate {
    position: fixed; inset: 0; z-index: 60;
    display: none; align-items: center; justify-content: center;
    text-align: center; padding: 2em;
    background:
      radial-gradient(120% 90% at 50% 18%, rgba(31, 107, 69, 0.5), transparent 62%),
      var(--deep);
  }
  body.gated #gate { display: flex; }
  .gate-card { max-width: 22em; }
  .gate-phone {
    width: 2.9em; height: 5.2em; margin: 0 auto 1.5em;
    border: 3px solid var(--accent); border-radius: 0.7em;
    position: relative;
    animation: gateSpin 2.4s cubic-bezier(.6, .05, .35, .95) infinite alternate;
  }
  .gate-phone::after {
    content: ''; position: absolute; left: 50%; bottom: 0.45em;
    width: 0.7em; height: 0.7em; transform: translateX(-50%);
    border: 2px solid var(--accent); border-radius: 50%; opacity: 0.7;
  }
  @keyframes gateSpin { from { transform: rotate(0); } to { transform: rotate(90deg); } }
  .gate-kicker {
    font-size: 0.72em; letter-spacing: 0.38em; text-transform: uppercase;
    color: color-mix(in srgb, var(--ink) 60%, transparent);
  }
  .gate-card h2 { margin-top: 0.55em; font-size: 1.9em; color: var(--print); }
  .gate-sub {
    margin-top: 0.7em; font-size: 0.95em; line-height: 1.55;
    color: color-mix(in srgb, var(--ink) 78%, transparent);
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
    .gate-phone { transform: rotate(90deg); }   /* the end pose, held still */
  }
</style>

<script>
(function () {
  'use strict';

  /* ================= cloth palettes ========================
     VENDORED from 999-bridge/src/theme.js (commit 5185558) —
     the same records as login-16x9.html. Ids are load-bearing:
     they travel in ?theme=<id> and in saved choices — add, do
     not rename. Four tokens per palette: felt (the playing
     surface), rail (the bed the table sits in), accent (the
     lines and edges), ink (the print ON the cloth). This scene
     wears two DERIVED values, computed with the bridge's own
     shade(), never hand-picked:
       deep   the room behind the table = shade(rail, -0.35)
       print  the real `ink` token, printing on the felt        */
  var DEFAULT_PALETTE_ID = 'classic-house';
  var PALETTES = [
    { id: 'classic-house', label: 'Classic House',  felt: '#0B5C3A', rail: '#1A1A1A', accent: '#C9A227', ink: '#D4AF37' },
    { id: 'platinum',      label: 'Night Platinum', felt: '#0E1412', rail: '#121212', accent: '#C0C0C8', ink: '#E8E8EC' },
    { id: 'ocean',         label: 'Ocean Ops',      felt: '#0A2F2C', rail: '#05080C', accent: '#2EC4B6', ink: '#00D4E6' },
    { id: 'felt-noir',     label: 'Felt Noir',      felt: '#0F3D2E', rail: '#0B0F0C', accent: '#1F6B4A', ink: '#F2EFE4' },
    { id: 'amethyst',      label: 'Amethyst Salon', felt: '#1A0F24', rail: '#0A0710', accent: '#B8A0E8', ink: '#D4C4F0' },
    { id: 'black-gold',    label: 'Black Gold',     felt: '#0A0F0C', rail: '#111111', accent: '#D4A017', ink: '#B8860B' }
  ];
  function paletteById(id) {
    for (var i = 0; i < PALETTES.length; i++) if (PALETTES[i].id === id) return PALETTES[i];
    return PALETTES[0];
  }
  function isPaletteId(v) {
    if (typeof v !== 'string') return false;
    for (var i = 0; i < PALETTES.length; i++) if (PALETTES[i].id === v) return true;
    return false;
  }
  /* hex -> hex, walking toward white (t>0) or black (t<0) — verbatim
     from theme.js, so no consumer invents a hue. */
  function shade(hex, t) {
    var m = /^#?([0-9a-f]{6})$/i.exec(String(hex || '').trim());
    if (!m) return hex;
    var n = parseInt(m[1], 16);
    var target = t >= 0 ? 255 : 0;
    var a = Math.min(1, Math.abs(t));
    var ch = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map(function (c) {
      return Math.round(c + (target - c) * a);
    });
    return '#' + ch.map(function (c) { return c.toString(16).padStart(2, '0'); }).join('');
  }
  function clothRecord(p) {
    return {
      id: p.id, label: p.label,
      felt: p.felt, rail: p.rail, accent: p.accent,
      print: p.ink,
      deep: shade(p.rail, -0.35),
      ink: shade(p.ink, 0.55)
    };
  }
  var CLOTHS = PALETTES.map(clothRecord);
  var THEME_KEY = 'maison21.theme';            /* what maison-21/src/theme.ts reads — one choice, three consumers */
  var LEGACY_CLOTH_KEY = '999.login.cloth.v1'; /* pre-bridge key, adopted once */
  function loadClothId() {
    var q = null;
    try { q = new URLSearchParams(location.search).get('theme'); } catch (e) { }
    if (isPaletteId(q)) return q;              /* ids travel in the embed URL */
    var v = null;
    try { v = localStorage.getItem(THEME_KEY); } catch (e) { }
    if (isPaletteId(v)) return v;
    try { v = localStorage.getItem(LEGACY_CLOTH_KEY); } catch (e) { }
    return isPaletteId(v) ? v : DEFAULT_PALETTE_ID;
  }
  function saveClothId(id) {
    try { localStorage.setItem(THEME_KEY, id); } catch (e) { }
    try { localStorage.setItem(LEGACY_CLOTH_KEY, id); } catch (e) { }
  }
  var current = CLOTHS[0];

  /* ================= who is at this table ==================
     The session minted at login lives in storage (canonical
     999.identity.v1, adopted from the legacy royale.* key) — the
     table reads it back, verifies it with the hub, and wears the
     name and the balance the HUB reports, never a local guess.
     Transport is the same vendored makeHubClient as
     login-16x9.html (999-bridge/src/hub-client.js, commit
     5185558): it never throws — every call resolves
     {ok, status, body, error}.                                  */
  var ID_KEYS = { identity: '999.identity.v1' };
  var LEGACY_KEYS = { identity: 'royale.identity.v1' };
  function readKey(key) {
    try { var raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
  }
  function adoptedSession() {
    return readKey(ID_KEYS.identity) || readKey(LEGACY_KEYS.identity);
  }

  var HUB_TIMEOUT_MS = 3500;   /* the bridge default is 8000; a preview degrades faster */
  function makeHubClient(opts) {
    opts = opts || {};
    var base = opts.base || null;
    var token = opts.token || null;
    var rawFetch = (typeof fetch !== 'undefined') ? fetch.bind(window) : null;

    function configured() { return !!(base && rawFetch); }

    function call(method, path, o) {
      o = o || {};
      if (!configured()) {
        return Promise.resolve({ ok: false, status: 0, body: {}, error: 'hub-not-configured' });
      }
      var ac = new AbortController();
      var timer = setTimeout(function () { ac.abort(); }, HUB_TIMEOUT_MS);
      var h = {};
      if (o.body !== undefined) h['content-type'] = 'application/json';
      if (o.headers) for (var hk in o.headers) {
        if (Object.prototype.hasOwnProperty.call(o.headers, hk)) h[hk] = o.headers[hk];
      }
      if (o.auth) {
        var t = (o.auth === true) ? token : o.auth;
        if (t) h['authorization'] = 'Bearer ' + t;
      }
      return rawFetch(base + path, {
        method: method,
        headers: h,
        body: (o.body === undefined) ? undefined : JSON.stringify(o.body),
        signal: ac.signal
      }).then(function (res) {
        return res.json().catch(function () { return {}; }).then(function (parsed) {
          if (!res.ok) return { ok: false, status: res.status, body: parsed, error: parsed.error || ('HTTP ' + res.status) };
          return { ok: true, status: res.status, body: parsed, error: null };
        });
      }).catch(function (e) {
        return { ok: false, status: 0, body: {}, error: (e && e.name === 'AbortError') ? 'timeout' : 'network' };
      }).then(function (v) { clearTimeout(timer); return v; });
    }

    return {
      get base() { return base; },
      get token() { return token; },
      setToken: function (t) { token = t || null; return token; },
      configured: configured,
      session: function (name) {
        return call('POST', '/session', { body: { name: name || null } }).then(function (r) {
          if (r.ok && r.body && r.body.token) token = r.body.token;
          return r;
        });
      },
      verify: function (t) {
        return call('POST', '/session/verify', { body: { token: t || token || '' } }).then(function (r) {
          if (r.ok && r.body && r.body.sub) token = t || token;
          return r;
        });
      },
      wallet: function (playerId, o) {
        o = o || {};
        var path = '/wallet?player=' + encodeURIComponent(playerId);
        if (o.migrate != null && isFinite(Number(o.migrate))) {
          path += '&migrate=' + encodeURIComponent(Math.round(Number(o.migrate)));
        }
        return call('GET', path);
      },
      /* one settled round = one move (PRD 7.3: an idempotency-key is
         mandatory and a replayed key must not double-pay). delta > 0
         credits, delta < 0 debits; the hub answers { balanceAfter }. */
      move: function (playerId, delta, reason, idemKey) {
        var n = Math.round(Number(delta) || 0);
        if (!n) return Promise.resolve({ ok: false, status: 0, body: {}, error: 'zero-delta' });
        return call('POST', n < 0 ? '/wallet/debit' : '/wallet/credit', {
          body: { playerId: playerId, delta: Math.abs(n), reason: reason || 'misc', roomId: null },
          headers: { 'idempotency-key': idemKey || ('nonce:' + Date.now().toString(36) + ':' + Math.random().toString(36).slice(2, 10)) },
          auth: true
        });
      },
      /* the bridge's verb pair, verbatim: sign is the caller's intent,
         the wire is always /wallet/credit or /wallet/debit. */
      credit: function (playerId, delta, reason, idemKey) {
        return this.move(playerId, Math.abs(Number(delta) || 0), reason, idemKey);
      },
      debit: function (playerId, delta, reason, idemKey) {
        return this.move(playerId, -Math.abs(Number(delta) || 0), reason, idemKey);
      },
      /* the daily streak wheel (§B1): one claim per 24h, the
         ladder rides with it. GET is the status, POST claims —
         the hub's ONE grant door pays it (wheel_claim).        */
      bonusStatus: function (playerId) {
        return call('GET', '/wallet/bonus?player=' + encodeURIComponent(playerId), { auth: true });
      },
      claimBonus: function (playerId) {
        return call('POST', '/wallet/bonus', {
          body: { playerId: playerId },
          auth: true
        });
      }
    };
  }

  /* same resolution as the login page: ?hub=<url>, then a hub the host
     declared (serve.js injects window.__HUB_BASE__), then the dev host,
     the dev hub on localhost — and off localhost the PUBLIC hub (poker's
     hub-party.js on PartyKit; a grandfathered hostname, infra not brand,
     CORS is the hub's own). */
  function hubBase() {
    var q = new URLSearchParams(location.search).get('hub');
    if (q) return q.replace(/\/+$/, '');
    if (typeof window.__HUB_BASE__ === 'string' && window.__HUB_BASE__) return window.__HUB_BASE__.replace(/\/+$/, '');
    if (location.port === '8899') return '/hub';           /* served by the dev host */
    var local = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
    if (local) return 'http://localhost:8899/hub';         /* the dev hub, directly */
    return 'https://maison-21.joaoalbuq.partykit.dev/parties/main/hub';
  }
  var BASE = hubBase();
  var hub = makeHubClient({ base: BASE });

  var who = document.getElementById('who');
  function showWho(name, chips) {
    var full = String(name == null ? '' : name);
    who.textContent = '';
    var b = document.createElement('b');
    b.textContent = full;                       /* full name — CSS ellipsizes it */
    who.appendChild(b);
    if (typeof chips === 'number') {
      var s = document.createElement('span');
      s.className = 'chips';
      s.textContent = ' · ' + chips.toLocaleString('en-US') + ' chips';
      who.appendChild(s);
    }
    who.className = 'tool wallet';
    who.removeAttribute('href');
    who.setAttribute('aria-label', 'Your wallet: ' + full +
      (typeof chips === 'number' ? ', ' + chips.toLocaleString('en-US') + ' chips' : ''));
  }
  function showSignInLink() {
    who.textContent = 'Sign in';
    who.className = 'tool';
    who.setAttribute('href', 'login-16x9.html');
    who.removeAttribute('aria-label');
  }
  /* the signed-in seat: who the hub verified, and a per-tab hand counter
     so every settled round gets its OWN idempotency key — a reused key
     would be swallowed as a replay and the hand would never pay.        */
  var you = { sub: null, name: null, sid: null, hand: 0 };
  try {
    you.sid = sessionStorage.getItem('999.table.sid');
    if (!you.sid) {
      you.sid = Math.random().toString(36).slice(2, 10);
      sessionStorage.setItem('999.table.sid', you.sid);
    }
    you.hand = parseInt(sessionStorage.getItem('999.table.hand') || '0', 10) || 0;
  } catch (e) { you.sid = you.sid || Math.random().toString(36).slice(2, 10); }

  function loadWallet() {
    var rec = adoptedSession();
    var token = null;
    try { token = sessionStorage.getItem('poker.token'); } catch (e) { }
    if (!token && rec) token = rec.token || null;
    if (!token) return;                              /* nobody signed in — the link stays */
    if (rec && rec.name) showWho(rec.name, null);    /* greet at once; the hub confirms below */
    hub.verify(token).then(function (r) {
      if (!r.ok) { showSignInLink(); return; }       /* a stale session goes back to the link */
      you.sub = r.body.sub; you.name = r.body.name;
      showWho(r.body.name, null);
      refreshWallet();
      probeBonus();                    /* is the daily wheel waiting? */
      /* sign-in can land mid-deal: the hand in flight gets its
         stake the moment the seat is known — a hand already
         settled never does (and never orphans a bet). */
      var live = game.hands[YOUR];
      if (live && !live.betChain && !live.result && game.phase !== 'pause' && game.phase !== 'idle') {
        placeBet(live, false, YOUR);
      }
    });
  }
  /* the pill always renders the hub's answer, never a number we kept. */
  function refreshWallet() {
    if (!you.sub) return Promise.resolve(null);
    return hub.wallet(you.sub).then(function (w) {
      if (w.ok && typeof w.body.balance === 'number') showWho(you.name, w.body.balance);
      return w;
    });
  }

  /* ---- the daily bonus, claimed from the betting interlude ----
     The floor already pauses there — the oldest ritual is the
     newest money: one claim per 24h, the streak ladder rides
     with it, and the VIP perk multiplies the prize. The button
     shows only when the hub says READY — no grey nagging. A
     claim credits through the hub's ONE grant door (its own
     wheel_claim row), and the pill renders the hub's answer. */
  var bonusReady = false, bonusClaiming = false;
  function renderBonus() {
    var b = document.getElementById('bonusBtn');
    if (!b) return;
    b.hidden = !bonusReady || !you.sub || bonusClaiming;
    if (bonusReady && you.sub) {
      b.textContent = bonusClaiming ? 'Claiming…' : '🎡 Bonus';
      b.disabled = bonusClaiming;
      b.title = 'Your daily streak bonus is ready at the wheel';
    }
  }
  function probeBonus() {
    bonusReady = false;
    renderBonus();
    if (!you.sub) return;
    hub.bonusStatus(you.sub).then(function (r) {
      bonusReady = !!(r.ok && r.body && r.body.ready);
      renderBonus();
    });
  }
  function claimBonus() {
    if (!you.sub || bonusClaiming) return;
    bonusClaiming = true;
    renderBonus();
    hub.claimBonus(you.sub).then(function (r) {
      bonusClaiming = false;
      if (r.ok && r.body && r.body.balanceAfter != null) {
        bonusReady = false;
        showWho(you.name, r.body.balanceAfter);   /* the hub's answer, not ours */
        bonusWin(r.body.amount);
        refreshWallet();
      } else if (r.status === 429) {
        bonusReady = false;   /* already claimed: come back tomorrow */
      }
      renderBonus();
    });
  }
  /* The crossing's chime. A felt has just topped its OWN accumulated
     spread — a statistical outlier, not a win — so this is said, not
     celebrated: a low fifth on triangles, quiet, and long in the room
     so it arrives from somewhere rather than snapping at the ear.
     It never carries the panner: a crossing is a property of a book,
     not of a seat, so it sits where the strip sits.           */
  function crossChime() {
    var c = ready(); if (!c) return;
    var t = c.currentTime + 0.02;
    var g = ROOM999.gain('chime');
    tone(c, 392.00, t, 0.62, 'triangle', g * 0.62, null, null, CHIME_ROOM());
    tone(c, 587.33, t + 0.055, 0.52, 'triangle', g * 0.40, null, null, CHIME_ROOM());
  }
  function bonusWin(amount) {
    /* one two-note chime (the betsOpen shape, one octave apart) for
       the wheel's answer — quiet, like every voice here (spec 4.5).
       It is the same shape as the betting chime, so it answers the
       room like one, but a little under it: the wheel pays out, it
       does not call a round — a small bloom, not a bloom-and-call.
       And it pays for the tail out of its own dry level, so the
       send never buys loudness.                              */
    var c = ready(); if (!c) return;
    var t = c.currentTime + 0.02;
    var bg = ROOM999.gain('bonus');
    tone(c, 659.25, t, 0.3, 'triangle', bg * 0.76, null, null, BONUS_ROOM());
    tone(c, 1318.5, t + 0.12, 0.3, 'triangle', bg * 0.52, null, null, BONUS_ROOM());
    var b = document.getElementById('bonusBtn');
    if (b && typeof amount === 'number') {
      b.hidden = false;
      b.textContent = '+' + amount.toLocaleString('en-US');
    }
  }

  /* ================= real stakes on the table =============
     A stake is REAL money (PRD 7.3): the bet is debited when
     the hand is dealt, a double debits one more unit, and
     settle PAYS the hand — a win returns the stake plus 1:1,
     a push returns the stake, a loss keeps it. The stake is
     taken first, so a hand can never overdraw the wallet.
     Every move carries its own idempotency key (bet / dbl /
     pay + hand number): a replay never double-pays, and a
     reconnect never eats a hand. Reasons follow the hub's
     ledger conventions: bj_bet (a debit = play volume),
     bj_prize, bj_push.                                       */
  var UNIT_BET = 25;
  function handKey(kind) {
    return 'table:' + you.sub + ':' + you.sid + ':' + kind + ':' + you.hand;
  }
  function applyMove(kind, verb, amount, reason) {
    return hub[verb](you.sub, amount, reason, handKey(kind)).then(function (r) {
      if (r.ok && typeof r.body.balanceAfter === 'number') {
        showWho(you.name, r.body.balanceAfter);      /* the hub's answer, not ours */
        return r.body.balanceAfter;
      }
      refreshWallet();                               /* 409/timeout: fall back to hub truth */
      return null;
    });
  }
  function placeBet(h, extra, seat) {
    if (!you.sub) return;                            /* nobody signed in — no stakes */
    if (!extra) {
      you.hand++;                                    /* one hand number per round */
      try { sessionStorage.setItem('999.table.hand', String(you.hand)); } catch (e) { }
    }
    h.betChain = (h.betChain || Promise.resolve()).then(function () {
      return applyMove(extra ? 'dbl' : 'bet', 'debit', UNIT_BET, 'bj_bet').then(function (bal) {
        if (bal != null) {
          h.stake = (h.stake || 0) + UNIT_BET;
          /* the felt keeps the ledger: a chip lands at the box
             when — and only when — the debit actually lands   */
          h.chipT0 = (h.chipT0 || []).concat(performance.now());
          var sp = chipSpot(seat == null ? YOUR : seat, 0);
          /* ...and the chip clacks as it lands, at ITS OWN seat —
             projected by the same camera as the deal's whooshes,
             so your wager sounds from the box the camera holds it,
             never out of the middle whatever seat that is. The
             fall still stretches with the cinematic           */
          chipClack(0.42 * pace, 1, null, panFor({ x: sp[0], y: 0.12, z: sp[1] }));
        }
        return bal;
      });
    });
  }
  function settleWallet() {
    if (!you.sub) return;                            /* nobody signed in — nothing to settle */
    var h = game.hands[YOUR];
    if (!h) return;
    (h.betChain || Promise.resolve()).then(function () {
      var stake = h.stake || 0;
      if (!stake || !h.result) { refreshWallet(); return; }        /* unstaked: hub truth */
      if (h.result !== 'win' && h.result !== 'push') { refreshWallet(); return; }  /* a loss keeps the stake */
      /* the canon's numbers at the money edge: a natural credits
         its 3:2 in whole chips (25 -> 63), a win 2:1, a push back */
      var prize = h.result === 'push' ? stake : h.natural ? SHOE999.chips(stake * 2.5) : 2 * stake;
      return applyMove('pay', 'credit', prize,
        h.result === 'push' ? 'bj_push' : 'bj_prize');
    });
  }

  /* ================= GEOMETRY (spec constants) =============
     Felt 4.05 x 2.35 world HALF-extents (8.10 x 4.70 cloth).
     The cloth plate is anisotropic: 45 x 32 plate units map onto
     the felt — 0.09 world per plate-x, 0.0734 per plate-y.
     Card 0.749 x 1.049 world = 8.33 x 14.29 plate.
     Hand stacks: one card of cloth wide; each card after the
     first lifts STACK_LIFT of its length, exposing its top strip
     where the rank prints — so the corner index font
     (FACE_INDEX_PX) must fit a STACK_MIN strip on a 448px face.
     The dealer keeps a non-overlapping sideways fan: pitched at
     least one card width apart, never coincident quads.          */
  var FELT_RX = 4.05, FELT_RZ = 2.35;
  var CARD_W = 0.749, CARD_L = 1.049;
  var STACK_LIFT = 0.135, STACK_MIN = 0.132;
  var FACE_PX = 448, FACE_INDEX_PX = 62;
  var CAM_PITCH = 1.0, CAM_FOV = 48;

  var BOX_N = 6;
  function boxX(i) { return (i - (BOX_N - 1) / 2) * 1.14; }
  var BOX_Z = 1.28;            /* near arc — the boxes sit here  */
  var DEALER_Z = -1.55;        /* far edge — the dealer's row     */
  var FAN_PITCH = 0.86;        /* >= one card width (0.749)       */

  /* ================= small math ============================ */
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }

  function mPersp(fovy, aspect, near, far) {
    var f = 1 / Math.tan(fovy / 2), nf = 1 / (near - far);
    return new Float32Array([
      f / aspect, 0, 0, 0,
      0, f, 0, 0,
      0, 0, (far + near) * nf, -1,
      0, 0, 2 * far * near * nf, 0
    ]);
  }
  function mLookAt(eye, center) {
    var up = [0, 1, 0];
    var zx = eye[0] - center[0], zy = eye[1] - center[1], zz = eye[2] - center[2];
    var zl = Math.hypot(zx, zy, zz) || 1; zx /= zl; zy /= zl; zz /= zl;
    var xx = up[1] * zz - up[2] * zy, xy = up[2] * zx - up[0] * zz, xz = up[0] * zy - up[1] * zx;
    var xl = Math.hypot(xx, xy, xz) || 1; xx /= xl; xy /= xl; xz /= xl;
    var yx = zy * xz - zz * xy, yy = zz * xx - zx * xz, yz = zx * xy - zy * xx;
    return new Float32Array([
      xx, yx, zx, 0,
      xy, yy, zy, 0,
      xz, yz, zz, 0,
      -(xx * eye[0] + xy * eye[1] + xz * eye[2]),
      -(yx * eye[0] + yy * eye[1] + yz * eye[2]),
      -(zx * eye[0] + zy * eye[1] + zz * eye[2]), 1
    ]);
  }
  function mMul(a, b) {
    var o = new Float32Array(16);
    for (var c = 0; c < 4; c++) for (var r = 0; r < 4; r++) {
      o[c * 4 + r] = a[r] * b[c * 4] + a[4 + r] * b[c * 4 + 1] + a[8 + r] * b[c * 4 + 2] + a[12 + r] * b[c * 4 + 3];
    }
    return o;
  }
  /* translate + yaw + non-uniform xz scale */
  function mXform(x, y, z, ry, sx, sz) {
    var c = Math.cos(ry), s = Math.sin(ry);
    return new Float32Array([
      c * sx, 0, -s * sx, 0,
      0, 1, 0, 0,
      s * sz, 0, c * sz, 0,
      x, y, z, 1
    ]);
  }

  /* ================= WebGL base ============================ */
  var cv = document.getElementById('gl');
  var gl = cv.getContext('webgl', { antialias: true, alpha: false, powerPreference: 'high-performance' });
  if (!gl) {
    document.getElementById('statusTxt').textContent = 'WebGL unavailable — the 3D table cannot open';
    return;
  }

  var VS = [
    'attribute vec3 aPos;', 'attribute vec2 aUV;',
    'uniform mat4 uMVP;',
    'varying vec2 vUV;', 'varying vec3 vPos;',
    'void main(){ vUV = aUV; vPos = aPos;',
    '  gl_Position = uMVP * vec4(aPos, 1.0); }'
  ].join('\n');

  var FS = [
    'precision mediump float;',
    'varying vec2 vUV;', 'varying vec3 vPos;',
    'uniform sampler2D uTex;', 'uniform float uUseTex;',
    'uniform vec4 uTint;', 'uniform float uAdd;',
    'uniform vec4 uWorld;',
    'void main(){',
    '  vec4 t = texture2D(uTex, vUV);',
    '  vec3 col = mix(uTint.rgb, t.rgb * uTint.rgb, uUseTex);',
    '  vec2 wxz = uWorld.xy + (vUV - 0.5) * uWorld.zw;',
    '  float lamp = 1.0 - 0.14 * smoothstep(2.2, 8.6, length(wxz));',
    '  col *= lamp;',
    '  float a = t.a * uTint.a;',
    '  if (uAdd > 0.5) { gl_FragColor = vec4(col * a, a); }',
    '  else { gl_FragColor = vec4(col, a); }',
    '}'
  ].join('\n');

  function shader(type, src) {
    var s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  }
  var prog = gl.createProgram();
  gl.attachShader(prog, shader(gl.VERTEX_SHADER, VS));
  gl.attachShader(prog, shader(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  gl.useProgram(prog);

  var aPos = gl.getAttribLocation(prog, 'aPos');
  var aUV = gl.getAttribLocation(prog, 'aUV');
  var uMVP = gl.getUniformLocation(prog, 'uMVP');
  var uTex = gl.getUniformLocation(prog, 'uTex');
  var uUseTex = gl.getUniformLocation(prog, 'uUseTex');
  var uTint = gl.getUniformLocation(prog, 'uTint');
  var uAdd = gl.getUniformLocation(prog, 'uAdd');
  var uWorld = gl.getUniformLocation(prog, 'uWorld');
  gl.enableVertexAttribArray(aPos);
  gl.enableVertexAttribArray(aUV);
  gl.uniform1i(uTex, 0);

  /* unit quad on the XZ plane; v=1 is the FAR edge so uploaded
     canvas textures read upright toward the dealer.             */
  var quadBuf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
    -0.5, 0, -0.5, 0, 1,
     0.5, 0, -0.5, 1, 1,
    -0.5, 0,  0.5, 0, 0,
     0.5, 0,  0.5, 1, 0
  ]), gl.STATIC_DRAW);
  var quadIdx = gl.createBuffer();
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, quadIdx);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array([0, 1, 2, 2, 1, 3]), gl.STATIC_DRAW);

  var TEX_CACHE = {};
  function canvasTexture(key, w, h, draw) {
    if (TEX_CACHE[key]) return TEX_CACHE[key];
    var c = document.createElement('canvas');
    c.width = w; c.height = h;
    draw(c.getContext('2d'), w, h);
    var t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, c);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    TEX_CACHE[key] = t;
    return t;
  }

  function drawQuad(tex, useTex, tint, x, y, z, ry, sx, sz, additive) {
    gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
    gl.vertexAttribPointer(aPos, 3, gl.FLOAT, false, 20, 0);
    gl.vertexAttribPointer(aUV, 2, gl.FLOAT, false, 20, 12);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, quadIdx);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.uniform1f(uUseTex, useTex);
    gl.uniform4fv(uTint, tint);
    gl.uniform1f(uAdd, additive ? 1 : 0);
    gl.uniform4f(uWorld, x, z, sx, sz);
    gl.uniformMatrix4fv(uMVP, false, mMul(MVP, mXform(x, y, z, ry, sx, sz)));
    gl.drawElements(gl.TRIANGLES, 6, gl.UNSIGNED_SHORT, 0);
  }

  var MVP = mPersp(CAM_FOV * Math.PI / 180, 1, 0.1, 60);

  /* ================= procedural textures ===================
     Every texture is drawn in a canvas at runtime — no asset
     pipeline, no downloads (spec: textures procedural).        */
  function hexRgb(hex) {
    var h = hex.replace('#', '');
    return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
  }
  function rgba(hex, a) { var c = hexRgb(hex); return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; }

  var SUIT = ['\u2660', '\u2665', '\u2666', '\u2663'];   /* spade heart diamond club */
  var RED = [false, true, true, false];

  /* ---- the felt: 200 px per world unit -------------------
     The cloth plate is ANISOTROPIC: 0.09 world per plate-x,
     0.0734 per plate-y — so the weave tiles are 18 x 15 px,
     not square. Drawing them square would squash the cloth.   */
  var FELT_PX = 200;
  var feltCv = document.createElement('canvas');
  feltCv.width = Math.round(FELT_RX * 2 * FELT_PX);
  feltCv.height = Math.round(FELT_RZ * 2 * FELT_PX);
  var feltTex = gl.createTexture();

  function paintFelt() {
    var c = feltCv.getContext('2d'), W = feltCv.width, H = feltCv.height;
    var f = current.felt, p = current.print, d = current.deep;

    c.clearRect(0, 0, W, H);
    var g = c.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, rgba(d, 0.42));
    g.addColorStop(0.28, f);
    g.addColorStop(0.72, f);
    g.addColorStop(1, rgba(d, 0.5));
    c.fillStyle = g;
    c.fillRect(0, 0, W, H);

    /* anisotropic weave: 18px plate-x by 15px plate-y */
    for (var y = 0; y < H; y += 15) {
      for (var x = 0; x < W; x += 18) {
        var v = Math.random() * 22 - 11;
        c.fillStyle = 'rgba(' + (v > 0 ? '255,255,255,' : '0,0,0,') + Math.abs(v) / 260 + ')';
        c.fillRect(x, y, 18, 15);
      }
    }

    /* the printed identity — spec 4.2 */
    c.textAlign = 'center';
    c.textBaseline = 'middle';
    c.fillStyle = rgba(p, 0.16);
    c.font = '800 ' + Math.round(0.42 * FELT_PX) + 'px Georgia, "Times New Roman", serif';
    c.fillText('BLACKJACK', W / 2, H * 0.30);
    try { c.letterSpacing = '0.30em'; } catch (e) { }
    c.font = '600 ' + Math.round(0.105 * FELT_PX) + 'px Georgia, serif';
    c.fillStyle = rgba(p, 0.13);
    c.fillText('DEALER MUST DRAW ALL 17', W / 2, H * 0.30 + 0.30 * FELT_PX);
    try { c.letterSpacing = '0.18em'; } catch (e) { }
    c.font = '700 ' + Math.round(0.17 * FELT_PX) + 'px Georgia, serif';
    c.fillStyle = rgba(p, 0.15);
    c.fillText('3 : 2', W * 0.22, H * 0.36);
    c.fillText('999', W * 0.78, H * 0.36);
    try { c.letterSpacing = '0em'; } catch (e) { }

    /* the betting arc + six box spots + the dealer's arc */
    c.strokeStyle = rgba(p, 0.14);
    c.lineWidth = Math.round(0.014 * FELT_PX);
    c.beginPath();
    c.ellipse(W / 2, H * 0.92, W * 0.46, H * 0.42, 0, Math.PI * 1.08, Math.PI * 1.92);
    c.stroke();
    for (var i = 0; i < BOX_N; i++) {
      var bx = (boxX(i) + FELT_RX) * FELT_PX;
      var bz = (BOX_Z + 0.86 + FELT_RZ) * FELT_PX;   /* bet spot, toward the player */
      c.beginPath();
      c.ellipse(bx, bz, 0.30 * FELT_PX, 0.21 * FELT_PX, 0, 0, Math.PI * 2);
      c.stroke();
    }
    c.beginPath();
    c.ellipse(W / 2, (DEALER_Z + 0.95 + FELT_RZ) * FELT_PX, W * 0.30, 0.26 * FELT_PX, 0, 0, Math.PI * 2);
    c.stroke();

    /* soft centre light pool, baked */
    var lp = c.createRadialGradient(W / 2, H * 0.52, 0, W / 2, H * 0.52, W * 0.55);
    lp.addColorStop(0, rgba(current.accent, 0.07));
    lp.addColorStop(1, rgba(current.accent, 0));
    c.fillStyle = lp;
    c.fillRect(0, 0, W, H);

    gl.bindTexture(gl.TEXTURE_2D, feltTex);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, feltCv);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  }

  /* ---- card faces ----------------------------------------
     320 x 448 = the card's 0.749 x 1.049 world ratio.
     The corner index prints at y = 16 with a 62px font
     (FACE_INDEX_PX) so its ink reaches 16 + 62*0.7 = 59.4px —
     inside the 13.5% (60px) top strip STACK_LIFT exposes.
     A ten prints "10", never "T".                               */
  function faceTexture(rank, suit) {
    var key = 'f' + rank + suit;
    return canvasTexture(key, 320, 448, function (c, W, H) {
      c.fillStyle = '#f7f2e6';
      c.fillRect(0, 0, W, H);
      c.strokeStyle = 'rgba(20,16,10,0.16)';
      c.lineWidth = 6;
      c.strokeRect(8, 8, W - 16, H - 16);
      var ink = RED[suit] ? '#b3242c' : '#191410';
      c.fillStyle = ink;
      c.textAlign = 'left';
      c.textBaseline = 'top';
      c.font = '800 ' + FACE_INDEX_PX + 'px "Segoe UI", Arial, sans-serif';
      c.fillText(rank, 18, 16);           /* y=16, the visible strip */
      c.font = '700 46px "Segoe UI Symbol", "Segoe UI", Arial, sans-serif';
      c.fillText(SUIT[suit], 20, 84);
      /* the body mark */
      c.textAlign = 'center';
      c.textBaseline = 'middle';
      c.font = '700 168px "Segoe UI Symbol", "Segoe UI", Arial, sans-serif';
      c.fillText(SUIT[suit], W / 2, H / 2 - 8);
      c.font = '800 74px Georgia, serif';
      c.fillText(rank, W / 2, H / 2 + 118);
      /* mirrored index, bottom-right */
      c.save();
      c.translate(W - 18, H - 16);
      c.rotate(Math.PI);
      c.textAlign = 'left'; c.textBaseline = 'top';
      c.font = '800 ' + FACE_INDEX_PX + 'px "Segoe UI", Arial, sans-serif';
      c.fillText(rank, 0, 0);
      c.restore();
    });
  }

  var backTex = null;
  function getBackTex() {
    return backTex || (backTex = (function () {
      return canvasTexture('back', 320, 448, function (c, W, H) {
        c.fillStyle = current.deep;
        c.fillRect(0, 0, W, H);
        c.strokeStyle = rgba(current.accent, 0.5);
        c.lineWidth = 5;
        c.strokeRect(14, 14, W - 28, H - 28);
        c.save();
        c.beginPath(); c.rect(22, 22, W - 44, H - 44); c.clip();
        c.strokeStyle = rgba(current.accent, 0.18);
        c.lineWidth = 3;
        for (var x = -H; x < W + H; x += 26) {
          c.beginPath(); c.moveTo(x, 0); c.lineTo(x + H, H); c.stroke();
          c.beginPath(); c.moveTo(x, H); c.lineTo(x + H, 0); c.stroke();
        }
        c.restore();
        c.fillStyle = rgba(current.accent, 0.75);
        c.textAlign = 'center'; c.textBaseline = 'middle';
        c.font = '800 92px Georgia, serif';
        c.fillText('999', W / 2, H / 2);
      });
    })());
  }

  /* the cut card: house red, gold border, the house 999 — the
     one card nobody plays and everybody watches */
  var cutTex = null;
  function getCutTex() {
    return cutTex || (cutTex = canvasTexture('cut', 320, 448, function (c, W, H) {
      c.fillStyle = '#a5252e';
      c.fillRect(0, 0, W, H);
      c.strokeStyle = 'rgba(216,181,106,0.9)';
      c.lineWidth = 6;
      c.strokeRect(14, 14, W - 28, H - 28);
      c.strokeStyle = 'rgba(216,181,106,0.4)';
      c.lineWidth = 3;
      c.strokeRect(32, 32, W - 64, H - 64);
      c.fillStyle = 'rgba(216,181,106,0.85)';
      c.textAlign = 'center'; c.textBaseline = 'middle';
      c.font = '800 88px Georgia, serif';
      c.fillText('999', W / 2, H / 2);
    }));
  }

  /* ---- the "next to play" ring + chips -------------------- */
  var ringTex = canvasTexture('ring', 256, 256, function (c, W, H) {
    var g = c.createRadialGradient(W / 2, H / 2, W * 0.16, W / 2, H / 2, W * 0.5);
    g.addColorStop(0, 'rgba(255,255,255,0)');
    g.addColorStop(0.62, 'rgba(255,255,255,0.85)');
    g.addColorStop(0.82, 'rgba(255,255,255,0.22)');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    c.fillStyle = g;
    c.fillRect(0, 0, W, H);
  });

  var CHIP_TINTS = ['#d8b56a', '#c84444', '#e8e4d8', '#3d7fd6', '#2f9e63'];
  var chipTex = canvasTexture('chip', 128, 128, function (c, W, H) {
    c.clearRect(0, 0, W, H);
    c.beginPath(); c.arc(W / 2, H / 2, W * 0.46, 0, Math.PI * 2);
    c.fillStyle = '#fff'; c.fill();
    c.lineWidth = 7; c.strokeStyle = 'rgba(0,0,0,0.28)';
    c.beginPath(); c.arc(W / 2, H / 2, W * 0.425, 0, Math.PI * 2); c.stroke();
    for (var k = 0; k < 8; k++) {
      var a = k * Math.PI / 4;
      c.fillStyle = 'rgba(255,255,255,0.85)';
      c.beginPath();
      c.arc(W / 2 + Math.cos(a) * W * 0.375, H / 2 + Math.sin(a) * H * 0.375, 11, 0, Math.PI * 2);
      c.fill();
    }
    c.beginPath(); c.arc(W / 2, H / 2, W * 0.24, 0, Math.PI * 2);

  /* The shoe is a CUT CARD, not a metronome (spec 4.5): four

      var h = game.hands[b], at = (CHIP_DELAY + beat * WALK_BEAT) * pace;   /* the cinematic stretches the whole walk */
      h.flyT0 = performance.now() + at;  /* its chips wait for their beat */
      later(at, function () {
        game.payoutBox = b;
        if (h.payDelta) spawnPay(b, h.payDelta);
        walkCue(b, h);           /* clacks with the chips; a stinger at your box */
      });
      beat++;
    });
    /* your verdict always sounds: the walk skips an unstaked
       box (no sign-in, no felt stack), but the stinger is owed
       to YOUR hand regardless (spec 4.5)                          */
    var youHand = game.hands[YOUR];
    if (game.walk.indexOf(YOUR) < 0 && youHand && youHand.result) {
      later(CHIP_DELAY * pace, function () { stinger(youHand.result); });
    }
    var walkEnd = (CHIP_DELAY + Math.max(beat, 1) * WALK_BEAT) * pace;
    var take = game.walk.filter(function (b) { return game.hands[b].result === 'lose' || game.hands[b].result === 'bust'; }).length;
    var give = game.walk.reduce(function (acc, b) { return acc + (game.hands[b].flyPay || 0); }, 0);
    trayChips = clamp(trayChips + take - give, 0, TRAY_SLOTS * TRAY_STACK_H);  /* the house ledger moves */
    later(walkEnd, function () {
      /* spec 4.4: a round ENDS on the dealer's hand — the walk
         never parks on the last paid box                       */
      game.payoutBox = -1;
      setStatus('Round settles — the frame returns to the dealer');

  }
  function clearRound() {
    game.token++;

    for (var i2 = 0; i2 < BOX_N; i2++) discarded += (game.hands[i2] || { cards: [] }).cards.length;
    discarded += game.dealer.cards.length;
    game.dealer = { cards: [] };
    game.hands = [];

  /* ================= the camera director ===================
     "The camera is a rule, not an interpolation" (spec 4.4):
       · after the deal, the shot is the cards, not the room
       · while a box decides, the camera HOLDS that box
       · during the dealer's play the dealer's hand owns the frame
       · a round ends on the dealer's hand
       · a table holding cards never parks on the wide shot
     CAM_PITCH = 1.0 rad, CAM_FOV = 48. User zoom (the 3D zoom
     control) survives every shot change.                        */
  var cam = { eye: [0, 5.9, 5.3], look: [0, 0, -0.1] };
  var userZoom = false;
  function zoomMul() { return userZoom ? 0.78 : 1; }

  function pose(look, dist, az, halfW) {
    var aspect = VW / Math.max(VH, 1);
    dist *= clamp(1.15 / aspect, 1, 1.8);              /* widen, never crop */
    if (halfW) {
      /* a shot fits its SUBJECT: with the real viewport aspect, narrow
         screens back the camera off — the table (or the held box, or the
         dealer's fan) never crops, and nothing is stretched to make it fit
         (16:9 frame, 16:9 frustum). */
      dist = Math.max(dist, halfW / (Math.tan(CAM_FOV * Math.PI / 360) * Math.max(aspect, 0.2)));
    }
    dist *= zoomMul();                                 /* the user's zoom survives every shot */

  }

  function desiredShot() {
    if (game.phase === 'shuffle') {
      /* the shoe ceremony holds the shoe: the riffling deck is
         the subject until it squares up and the deal begins  */
      var sp = pose([SHOE[0] - 0.35, 0.38, SHOE[2] + 0.45], 3.2, -0.25, 1.4);
      sp.name = 'The shoe';
      return sp;
    }
    if (game.phase === 'bets') {
      /* the window's subject is the bet itself: your box and the
         breathing betting circle in front of it                 */
      var yx = boxX(YOUR);
      var bp = pose([yx * 0.62, 0.05, BOX_Z + 0.35], 3.15, -yx * 0.13, Math.abs(yx) * 0.38 + 0.95);
      bp.name = 'Place your bets';
      return bp;
    }
    if (game.phase === 'settle' && game.payoutBox >= 0) {
      /* the payout walk holds the box it is paying — the same
         close hold the box got while it decided                */
      var pb = boxX(game.payoutBox);
      var pq = pose([pb * 0.62, 0.05, BOX_Z], 2.95, -pb * 0.13, Math.abs(pb) * 0.38 + 0.85);
      pq.name = 'Paying seat ' + (game.payoutBox + 1);
      return pq;
    }
    if (game.phase === 'dealer' || game.phase === 'settle') {
      /* the dealer's hand owns the frame — and the round ends on it.
         halfW is the six-card fan (2.53) plus margin: the fan never crops,
         whatever the viewport. */
      var p = pose([0, 0.05, DEALER_Z + 0.55], 3.5, 0, 2.7);
      p.name = "The dealer's hand";

    }
    if (game.phase === 'acting' && game.acting >= 0) {
      /* while a box decides, hold THAT box — aim at the box itself and
         come in close (2.95, not the old 4.55): with the frustum fixed a
         wide hold left the box a sliver. halfW is the box's stack plus its
         off-axis seat margin, so narrow frames back the camera off rather
         than crop the cards. */
      var bx = boxX(game.acting);
      var q = pose([bx * 0.62, 0.05, BOX_Z], 2.95, -bx * 0.13, Math.abs(bx) * 0.38 + 0.85);
      q.name = 'Holding seat ' + (game.acting + 1);
      return q;
    }
    if (cardsOut()) {
      /* dealing: the shot is the cards, not the whole room */
      var t = pose([0, 0.05, 0.12], 6.3, 0, 4.4);
      t.name = 'The table';
      return t;
    }
    var w = pose([0, 0.05, -0.12], 8.6, 0, 4.4);
    w.name = 'Wide table';
    return w;
  }

  function updateCamera(dt) {
    var goal = desiredShot();
    var k = 1 - Math.exp(-dt * 3.2);
    for (var i = 0; i < 3; i++) {

  }

  /* ================= labels (projected totals) =============
     Totals print BELOW the hand — projected from the live
     camera so they clear every card corner at any rotation.     */
  var labelsWrap = document.getElementById('labels');
  var labelEls = [];
  for (var li = 0; li <= BOX_N; li++) {

  }
  function panFor(spot) {

       right; pans stop 0.85 short of the rail so a hard pan
       never fully clips a channel.                        */
    var pr = project([spot.x, spot.y, spot.z]);

  function updateLabels() {

    var barTop = document.querySelector('.bar').getBoundingClientRect().top;
    var dodge = function (y) { return Math.min(y, barTop - 34); };

    for (var i = 0; i < BOX_N; i++) {

      if (!p) { el.style.opacity = 0; continue; }
      /* a tight hold can push a total past the frame edge — a half-cut pill
         helps no one: neighbours hide until they fit again, but the held
         box's own total dodges inward and stays on screen */
      if (p.x < 60 || p.x > VW - 60) {

        p.x = clamp(p.x, 60, VW - 60);
      }
      el.style.opacity = 1;
      el.style.left = p.x + 'px';
      el.style.top = dodge(p.y) + 'px';
      var s = score(h.cards);
      el.querySelector('b').textContent = s > 21 ? 'BUST' : String(s);
      el.querySelector('span').textContent = (i === YOUR ? 'You · seat ' : 'Seat ') + (i + 1);
      el.className = 'lab' + (h.result === 'win' ? ' win' : h.result === 'lose' || h.result === 'bust' ? ' lose' : '') + (s > 21 ? ' bust' : '');
    }
    var del = labelEls[BOX_N], d = game.dealer;
    if (!d.cards.length) { del.style.opacity = 0; return; }
    var dp = project([0, 0.12, DEALER_Z + 1.02]);
    if (!dp) { del.style.opacity = 0; return; }
    if (dp.x < 60 || dp.x > VW - 60) { del.style.opacity = 0; return; }
    del.style.opacity = 1;
    del.style.left = dp.x + 'px';
    del.style.top = dodge(dp.y) + 'px';
    var ds2 = score(d.cards);
    del.querySelector('b').textContent = ds2 > 21 ? 'BUST' : String(ds2);
    del.querySelector('span').textContent = 'Dealer';
    del.className = 'lab' + (ds2 > 21 ? ' win' : '');
  }

  /* ---- the +delta riding the payout walk ------------------
     The number is the settlement's own — what the wallet just
     moved (2:1 on a win, the stake back on a push), never
     re-derived here (spec 5). It lives IN the scene now: a
     plank rising from the box's total while its chips arrive,
     then fading — projected by the same camera as the cards.   */
  var payFloats = [];
  var PAY_LIFE = 1500;
  function paySign(delta) { return '+' + delta; }
  function payFloatTex(delta) {
    return canvasTexture('pay' + delta, 512, 192, function (c, W, H) {
      c.clearRect(0, 0, W, H);
      var g = c.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, 'rgba(6,8,10,0)'); g.addColorStop(0.45, 'rgba(6,8,10,0.55)'); g.addColorStop(1, 'rgba(6,8,10,0)');
      c.fillStyle = g;
      c.fillRect(0, 0, W, H);
      c.textAlign = 'center'; c.textBaseline = 'middle';
      c.font = '800 118px Georgia, serif';
      c.strokeStyle = 'rgba(0,0,0,0.85)'; c.lineWidth = 14; c.lineJoin = 'round';
      c.strokeText(paySign(delta), W / 2, H / 2);

    });
  }
  function spawnPay(b, delta) {

  }
  function payFloatDrawn(f, ts) {
    /* the plank rises from the box's total, then fades at the
       top — alpha holds to 0.6 of its life and falls after.
       Under the cinematic it rides the stretched beat too   */
    var age = clamp((ts - f.t0) / (PAY_LIFE * pace), 0, 1);
    return {
      y: 0.12 + age * 0.52,
      a: age <= 0.6 ? 1 : 1 - (age - 0.6) / 0.4,
      z: BOX_Z + 1.12,
      w: 1.32

  }
  function drawPayFloats(ts) {
    for (var i = payFloats.length - 1; i >= 0; i--) {
      var f = payFloats[i], age = (ts - f.t0) / (PAY_LIFE * pace);
      if (age >= 1) { payFloats.splice(i, 1); continue; }
      var d = payFloatDrawn(f, ts);
      drawQuad(f.tex, 1, [1, 1, 1, d.a], boxX(f.box), d.y, d.z, 0, d.w, d.w * 0.375, false);
    }
  }

  /* ================= bet stacks (the felt keeps the ledger) ==
     A chip quad exists only where a stake landed: the player's
     chips land with the ledger debit (one per UNIT_BET — so a
     double doubles the stack), the bots' nominal chips land with
     the deal. At settle the felt pays the round the way the
     wallet did: a losing stack flies to the house tray, and a
     winner's payout flies from the tray back to the box.        */
  var CHIP_D = 0.56, CHIP_H = 0.024;
  var CHIP_POP = 420;                 /* a chip drops in when its bet lands */
  var WALK_BEAT = 760;                /* the payout walk: one box per beat  */
  var CHIP_DELAY = 200;               /* settle: the verdict lands first    */
  var CHIP_FLY = 560, CHIP_STAG = 90; /* a flight lands inside its beat     */
  var PAY_LAG = 90;                   /* the payout launches a beat behind  */
  var TRAY_SLOTS = 5, TRAY_STACK_H = 5, TRAY_SINK = 0.012;
  var trayChips = TRAY_SLOTS * 2;     /* the house's working float          */

    return clamp(Math.round(t / TRAY_SLOTS), 0, TRAY_STACK_H);
  }
  function trayShift(t) {             /* the tray rides the money: heavy rides right, paid down eases left */
    return clamp((t - TRAY_SLOTS * 2) / (TRAY_SLOTS * TRAY_STACK_H + 5) * 0.13, -0.055, 0.065);
  }

  function chipSpot(b, slot) {
    return [boxX(b) + (slot % 2 ? 0.022 : -0.022), BOX_Z + 0.86 + ((slot % 3) - 1) * 0.018];
  }
  function traySpot(k) {
    /* lands IN FRONT of the tray row — never coincident quads */
    return [-1.18 + (k % 5) * 0.64, DEALER_Z - 0.62];
  }
  function traySlotX(k) {
    /* the tray's own columns — the floats only ever move to
       these x positions, so the flight lane stays empty      */
    return -1.18 + (k % TRAY_SLOTS) * 0.64;
  }
  function drawBetStack(b, ts) {
    var h = game.hands[b];
    if (!h) return;
    var chips = h.chipT0 || [], i;
    var flying = h.flyT0 != null && ts >= h.flyT0;
    var toDealer = flying && (h.result === 'lose' || h.result === 'bust');
    for (i = 0; i < chips.length; i++) {
      if (toDealer) chipFly(b, i, i, h.flyT0, ts, true);
      else chipDrop(b, i, chips[i], ts);
    }

    }
  }
  function chipDrop(b, slot, t0, ts) {
    /* the drop-in: a chip lands the moment its stake does —
       under the cinematic the fall stretches with its clack */
    var p = clamp((ts - t0) / (CHIP_POP * pace), 0, 1), e = 1 - Math.pow(1 - p, 3);
    var sp = chipSpot(b, slot), s = lerp(CHIP_D * 0.72, CHIP_D, e);
    drawQuad(chipTex, 1, hexTint(CHIP_TINTS[b % CHIP_TINTS.length], clamp(p * 5, 0, 1)),
      sp[0], lerp(0.62, 0.012 + slot * CHIP_H, e), sp[1], 0, s, s, false);
  }
  function chipFly(b, slot, k, t0, ts, toDealer) {
    /* the settle flight: chips arc over the cloth between the
       box and the house tray, staggered so a stack unwinds —
       under the cinematic the flight stretches with its clack,
       the deal's own one-knob rule: stretch the flight and the
       sound stretched with it                              */

    var to = toDealer ? traySpot(k) : chipSpot(b, slot);

    var y1 = 0.012 + (toDealer ? 0 : slot) * CHIP_H;

      lerp(from[0], to[0], e), lerp(y0, y1, e) + Math.sin(q * Math.PI) * 0.55,
      lerp(from[1], to[1], e), 0, s, s, false);
  }

  /* ================= audio ceremony (spec 4.5) =============
     Chip clacks, card whooshes and snaps, the shoe's riffle
     and win/lose stingers — every sound is Web Audio SYNTHESIS
     (no CDN, no bundled sample, no runtime download), gated by the 🔊 tool toggle. A browser
     sounds nothing before the first gesture, so the context is
     created and resumed on the first pointerdown/keydown — the
     game itself never waits on audio. Sounds also stay quiet
     behind the rotate gate and in a hidden tab. Timing rides
     the audio clock (never setTimeout): a clack lands when its
     chip lands, a whoosh rides the card's flight and the snap
     lands it — impact, then sound. A push is silent apart from its returning chips.   */
  var audioOn = true;
  try { audioOn = localStorage.getItem('999.table.audio') !== 'off'; } catch (e) { }
  var actx = null, master = null, noiseBuf = null, reverbBus = null, wetA = null, wetB = null, wetPan = null;
  var wet = { hold: 0 };               /* one flyer owns the walls at a time */
  function roomIR(c, big) {
    /* the room, synthesized - no samples, no downloads: a dozen
       milliseconds of air, then the first reflections off the
       tables and rails around the felt, then a tail that loses
       its top end as the cloth and air take it. Normalized so
       the room sits quietly under the deal, never over it.
       big = the cinema's hall: the same walls pushed back - a
       longer tail, a later first answer and wider reflections,
       sized to breathe with the stretched flights          */
    var rt = big ? 2.8 : 1.35, pre = big ? 0.026 : 0.012;

      }

      }
      var sum = 0;

  }
  function ready() {
    /* null = silent: muted, gate up, hidden tab, no API, or no

    try {
      if (!actx) {

        master = actx.createGain();
        master.connect(actx.destination);

           below) - the bus trims the shared share, the walls answer
           where the sound belongs, not everywhere the same. Two
           characters hang on the bus: the felt's room and the
           cinema's hall, crossfaded when the toggle flips       */
        reverbBus = actx.createGain();
        reverbBus.gain.value = 0.35;

        convFelt.buffer = roomIR(actx);

        reverbBus.connect(convFelt);
        reverbBus.connect(convHall);
        wetA = actx.createGain();
        wetA.gain.value = cineOn ? 0 : 1;    /* a page born in cinema wakes in the hall */
        wetB = actx.createGain();
        wetB.gain.value = cineOn ? 1 : 0;
        convFelt.connect(wetA); convHall.connect(wetB);
        /* the return itself leans: while a card flies, the walls
           answer subtly OPPOSITE its seat - the far wall speaking
           back - then the room re-centers when the card lands  */

          wetA.connect(wetPan); wetB.connect(wetPan);

        var r = actx.resume();

      }

    } catch (e) { return null; }
  }
  function wakeAudio() { ready(); }
  document.addEventListener('pointerdown', wakeAudio);
  document.addEventListener('keydown', wakeAudio);

  /* The sends are NOT written here: ROOM999 holds every voice both
     felts share, its shipped gain and shipped send, and whatever the
     Levels panel has tuned since. These bindings are one-line reads, so
     the table and the floor cannot drift on a number that lives in
     exactly one place.                                                */
  var RIFFLE_ROOM = function () { return ROOM999.send('riffle'); };
  var WHOOSH_ROOM = function () { return ROOM999.send('whoosh'); };
  var STINGER_ROOM = function () { return ROOM999.send('stinger'); };
  var CLACK_ROOM = function () { return ROOM999.send('clack'); };
  /* the three small voices, each sent for its own moment: the
     whisper leans in because paper is nearly all room, the
     chime leans in hardest because calling a round across a
     quiet felt IS the room, and the shoe's tap stays nearly dry
     because it fires on every card and must never stack. */
  var CUT_ROOM = function () { return ROOM999.send('cut'); };
  var BETS_ROOM = function () { return ROOM999.send('bets'); };
  var TAP_ROOM = function () { return ROOM999.send('tap'); };
  var BONUS_ROOM = function () { return ROOM999.send('bonus'); };
  var CHIME_ROOM = function () { return ROOM999.send('chime'); };
  /* the ceremony fills the air, the whoosh IS air and swims, the
     verdict blooms, and the clacks stay dry-ish near the cloth */
  /* ---- the Levels panel: hear and tune a voice on its own -------
     Same rows as the floor's, from ROOM999, so both felts show the same
     voices and the same numbers; playing one fires its REAL function, so
     what you hear is exactly what a round will play.                    */
  var levelsOn = false;
  (function () {
    var btn = document.getElementById('levelsBtn'), box = document.getElementById('levelsBox');
    if (btn) btn.addEventListener('click', function () {
      levelsOn = !levelsOn;
      if (box) box.hidden = !levelsOn;
      if (levelsOn) renderLevels();
    });
    if (box) box.addEventListener('click', levelsClick);
  })();
  function renderLevels() {
    var b = document.getElementById('levelsBox');
    if (!b) return;
    b.innerHTML = ROOM999.panelHtml('table');
  }
  function playVoice(id) {
    if (id === 'riffle') riffleSound(null);
    else if (id === 'whoosh') { cardWhoosh(0, null, null); }
    else if (id === 'snap') cardSnap(0, null);
    else if (id === 'clack') chipClack(0);
    else if (id === 'stinger') stinger('win');
    else if (id === 'cut') cutCue();
    else if (id === 'bets') betsOpen(0);
    else if (id === 'tap') shoeTap(0);
    else if (id === 'bonus') bonusWin(100);
    else if (id === 'chime') crossChime();

  function levelsClick(e) {
    var play = e.target.closest && e.target.closest('[data-lvplay]');
    if (play) { playVoice(play.getAttribute('data-lvplay')); return; }
    var reset = e.target.closest && e.target.closest('[data-lvreset]');
    if (reset) {
      var rid = reset.getAttribute('data-lvreset');
      ROOM999.reset(rid === 'all' ? undefined : rid);
      renderLevels();
      return;
    }
    var step = e.target.closest && e.target.closest('[data-lvstep]');
    if (!step) return;
    var dir = step.getAttribute('data-lvstep');
    var voice = step.closest('[data-lvvoice]');
    var kindBox = step.closest('[data-lvkind]');
    if (dir == null || !voice || !kindBox) return;
    var id = voice.getAttribute('data-lvvoice');
    if (ROOM999.step(id, kindBox.getAttribute('data-lvkind'), Number(dir)) == null) return;
    playVoice(id);
    renderLevels();
