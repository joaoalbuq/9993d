<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b2b1d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="media/icon-192.png">
<link rel="apple-touch-icon" href="media/icon-180.png">
<title>999 Casino — The table · fullscreen 16:9</title>
<style>
  /* ============================================================
     table-16x9.html — the fullscreen 16:9 table, REVAMP PREVIEW.
     The next side-by-side page after login-16x9.html: it sits
     beside the existing app and edits nothing.

     House rules kept from the revamp spec:
       · zero runtime dependencies, no CDN, no asset pipeline
       · the 3D stage is raw WebGL with runtime canvas textures
       · safe-area insets on every interactive element
       · no page scroll; the felt-filling stage owns the viewport
       · portrait is primary; landscape widens the camera, never crops
     Geometry follows the spec's table constants (see GEOMETRY).
     ============================================================ */

  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --felt:  #1f6b45;
    --deep:  #0b2b1d;
    --rail:  #241a12;
    --accent:#d8b56a;
    --ink:   #f4ead2;
    --print: #f7f1e2;
  }

  html, body { height: 100%; }
  body {
    background: var(--deep);
    color: var(--ink);
    font-family: -apple-system, "SF Pro Display", "Segoe UI", Roboto, Inter, system-ui, sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-font-smoothing: antialiased;
  }

  #gl {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    display: block; z-index: 0;
    touch-action: none;
  }

  /* projected totals / names — positioned per frame from the 3D camera */
  #labels { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
  .lab {
    position: absolute; transform: translate(-50%, -50%);
    text-align: center; white-space: nowrap;
    text-shadow: 0 2px 10px rgba(0,0,0,.75);
  }
  .lab b { display: block; font-size: 30px; font-weight: 800; letter-spacing: 0.02em; line-height: 1.05; }
  .lab span { display: block; margin-top: 2px; font-size: 11px; font-weight: 700; letter-spacing: 0.28em;
    opacity: 0.72; text-transform: uppercase; }
  .lab.win b { color: color-mix(in srgb, var(--accent) 92%, white); }
  .lab.lose b { opacity: 0.55; }
  .lab.bust b { color: #ff9d8a; }
  .pay {
    position: absolute; transform: translate(-50%, -50%);
    font-size: 26px; font-weight: 800; letter-spacing: 0.02em;
    color: color-mix(in srgb, var(--accent) 92%, white);
    text-shadow: 0 2px 12px rgba(0,0,0,.85); white-space: nowrap;
  }

  /* ---------- the 16:9 stage (HUD over the felt) ----------- */
  #stage {
    position: fixed; left: 50%; top: 50%;
    width: 1600px; height: 900px;
    transform: translate(-50%, -50%) scale(1);
    transform-origin: center;
    font-size: 24px;
    z-index: 2;
    pointer-events: none;
  }
  #stage > * { pointer-events: auto; }

  .hud-top {
    position: absolute; left: 3em; right: 3em; top: 2em;
    display: flex; align-items: center; justify-content: space-between; gap: 1em;
  }
  .brandchip {
    display: flex; align-items: center; gap: 0.7em;
    font-size: 0.72em; font-weight: 700; letter-spacing: 0.34em; text-transform: uppercase;
    color: color-mix(in srgb, var(--ink) 82%, transparent);
    background: rgba(5, 14, 10, 0.5);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
    border-radius: 2em; padding: 0.75em 1.3em;
  }
  .brandchip b { color: var(--accent); letter-spacing: 0.18em; }

  .shotpill {
    font-size: 0.66em; font-weight: 700; letter-spacing: 0.3em; text-transform: uppercase;
    color: color-mix(in srgb, var(--ink) 72%, transparent);
    background: rgba(5, 14, 10, 0.5);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border: 1px solid color-mix(in srgb, var(--accent) 25%, transparent);
    border-radius: 2em; padding: 0.75em 1.3em;
    transition: opacity .3s ease;
  }

  .tools {
    position: absolute; right: 3em; top: 6.2em;
    display: flex; flex-direction: column; align-items: flex-end; gap: 0.8em;
  }
  .tool {
    font: inherit; font-size: 0.68em; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--ink); background: rgba(5, 14, 10, 0.55);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border: 1px solid color-mix(in srgb, var(--accent) 32%, transparent);
    border-radius: 1.4em; padding: 0.8em 1.35em;
    cursor: pointer; text-decoration: none;
    touch-action: manipulation;
    flex-shrink: 0;
    transition: border-color .15s ease, transform .14s ease;
  }
  .tool:hover { border-color: color-mix(in srgb, var(--accent) 70%, transparent); }
  .tool:active { transform: translateY(1px) scale(0.99); }
  /* the signed-in wallet: the name and the balance the hub reported. When
     space is tight the NAME yields (ellipsis) — the balance never does. */
  .tool.wallet { cursor: default; display: flex; align-items: center;
    max-width: min(46vw, 24em); flex-shrink: 1; min-width: 0; }
  .tool.wallet:hover { border-color: color-mix(in srgb, var(--accent) 32%, transparent); }
  .tool.wallet b { color: var(--accent); min-width: 0; overflow: hidden;
    white-space: nowrap; text-overflow: ellipsis; }
  .tool.wallet .chips { flex-shrink: 0; white-space: nowrap; }

  .swatches { display: flex; gap: 0.5em; flex-shrink: 0; background: rgba(5, 14, 10, 0.5);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border: 1px solid color-mix(in srgb, var(--accent) 25%, transparent);
    border-radius: 2em; padding: 0.55em 0.75em; }
  .sw {
    width: 1.7em; height: 1.7em; border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.25);
    cursor: pointer; padding: 0;
    transition: transform .16s ease, box-shadow .16s ease;
  }
  .sw:hover { transform: translateY(-2px); }
  .sw[aria-pressed="true"] {
    box-shadow: 0 0 0 2px var(--deep), 0 0 0 4px var(--accent);
  }

  /* ---------- the thumb action bar ------------------------- */
  .bar {
    position: absolute; left: 50%; bottom: 0;
    transform: translateX(-50%);
    width: min(46em, calc(100% - 4em));
    display: flex; flex-direction: column; align-items: center; gap: 0.85em;
    padding: 1em 1.6em calc(1.1em + env(safe-area-inset-bottom));
    background: linear-gradient(180deg, rgba(5,14,10,0) 0%, rgba(5,14,10,0.72) 32%, rgba(5,14,10,0.92) 100%);
    border-radius: 2em 2em 0 0;
  }
  .status {
    font-size: 0.72em; font-weight: 700; letter-spacing: 0.32em; text-transform: uppercase;
    color: color-mix(in srgb, var(--ink) 82%, transparent);
    text-align: center; min-height: 1.2em;
  }
  .status .dot { display: inline-block; width: 0.62em; height: 0.62em; border-radius: 50%;
    background: var(--accent); margin-right: 0.7em; vertical-align: 0.06em; }
  .acts { display: flex; gap: 0.7em; width: 100%; justify-content: center; }
  .act {
    flex: 1 1 0; max-width: 9.5em; height: 3.6em;
    border-radius: 1.3em; border: 1px solid color-mix(in srgb, var(--accent) 34%, transparent);
    background: rgba(255,255,255,0.08);
    color: var(--ink); font: inherit; font-size: 0.92em; font-weight: 700; letter-spacing: 0.06em;
    cursor: pointer; touch-action: manipulation;
    transition: transform .14s ease, filter .14s ease, opacity .14s ease;
  }
  .act.primary {
    border: none;
    background: linear-gradient(180deg,
      color-mix(in srgb, var(--accent) 88%, white),
      color-mix(in srgb, var(--accent) 78%, black));
    color: #171006;
  }
  .act:hover:not([disabled]) { filter: brightness(1.06); }
  .act:active:not([disabled]) { transform: translateY(1px) scale(0.985); }
  .act[disabled] { opacity: 0.38; cursor: default; }
  .act.book {
    box-shadow: 0 0 0 2px rgba(216,181,106,0.85);
    border-color: rgba(216,181,106,0.9);
    color: #f4e9c8;
  }
  .tool.on { color: #d8b56a; border-color: rgba(216,181,106,0.55); }
  .training {
    position: fixed; left: 12px; top: 56px; z-index: 6;
    background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.09);
    border-radius: 8px; padding: 0.5em 0.8em;
    font-size: 0.74em; letter-spacing: 0.06em; line-height: 1.55;
    color: #e8e4d8; font-variant-numeric: tabular-nums;
  }
  .act.chip.on {
    border-color: var(--accent);
    background: color-mix(in srgb, var(--accent) 26%, rgba(255,255,255,0.08));
  }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }

  /* ---------- phone landscape (short viewport) ------------- */
  body.compact #stage {
    inset: 0; left: 0; top: 0; width: auto; height: 100dvh; transform: none;
    font-size: clamp(11px, 2.7vh, 15px);
  }
  body.compact .hud-top { top: max(0.9em, env(safe-area-inset-top)); left: 1.4em; right: 1.4em; }
  body.compact .tools { top: 4.6em; right: 1.4em; }
  body.compact .bar {
    width: 100%; border-radius: 0;
    padding: 0.7em 1em calc(0.8em + env(safe-area-inset-bottom));
    flex-direction: row; justify-content: center;
  }
  body.compact .status { font-size: 0.62em; }
  body.compact .acts { width: auto; }
  body.compact .act { height: 3.2em; max-width: 7.6em; }

  /* ---------- portrait (phone / iPad upright) -------------- */
  body.stacked #stage {
    inset: 0; left: 0; top: 0; width: auto; height: 100dvh; transform: none;
    font-size: clamp(13px, 3.6vw, 19px);
  }
  body.stacked .hud-top {
    top: max(1em, env(safe-area-inset-top));
    left: max(1em, env(safe-area-inset-left)); right: max(1em, env(safe-area-inset-right));
  }
  body.stacked .shotpill { display: none; }
  /* …and the wallet takes the header's freed right slot, so the tools row
     stays all controls and the name keeps its letters */
  body.stacked .tool.wallet {
    position: fixed;
    top: max(1em, env(safe-area-inset-top));
    right: max(1em, env(safe-area-inset-right));
    max-width: min(52vw, 24em);
  }
  body.stacked .tools {
    top: auto; bottom: calc(9.4em + env(safe-area-inset-bottom));
    right: max(1em, env(safe-area-inset-right));
    max-width: calc(100% - 2em);              /* the row never outgrows the screen */
    flex-direction: row; align-items: center;
  }
  body.stacked .bar {
    width: 100%; border-radius: 2em 2em 0 0;
    padding: 0.9em 1.1em calc(1em + env(safe-area-inset-bottom));
  }
  body.stacked .act { height: 3.9em; }

  /* phones get fatter thumbs */
  body.phone .act { height: 4.1em; font-size: 1em; }
  body.phone .tool { padding: 0.95em 1.5em; }

  /* ---------- the rotate gate: phones/tablets go landscape ---
     Portrait is not an arrangement on a phone or tablet — it is a
     gate: turn sideways and the whole 16:9 screen is the table.   */
  #gate {
    position: fixed; inset: 0; z-index: 60;
    display: none; align-items: center; justify-content: center;
    text-align: center; padding: 2em;
    background:
      radial-gradient(120% 90% at 50% 18%, rgba(31, 107, 69, 0.5), transparent 62%),
      var(--deep);
  }
  body.gated #gate { display: flex; }
  .gate-card { max-width: 22em; }
  .gate-phone {
    width: 2.9em; height: 5.2em; margin: 0 auto 1.5em;
    border: 3px solid var(--accent); border-radius: 0.7em;
    position: relative;
    animation: gateSpin 2.4s cubic-bezier(.6, .05, .35, .95) infinite alternate;
  }
  .gate-phone::after {
    content: ''; position: absolute; left: 50%; bottom: 0.45em;
    width: 0.7em; height: 0.7em; transform: translateX(-50%);
    border: 2px solid var(--accent); border-radius: 50%; opacity: 0.7;
  }
  @keyframes gateSpin { from { transform: rotate(0); } to { transform: rotate(90deg); } }
  .gate-kicker {
    font-size: 0.72em; letter-spacing: 0.38em; text-transform: uppercase;
    color: color-mix(in srgb, var(--ink) 60%, transparent);
  }
  .gate-card h2 { margin-top: 0.55em; font-size: 1.9em; color: var(--print); }
  .gate-sub {
    margin-top: 0.7em; font-size: 0.95em; line-height: 1.55;
    color: color-mix(in srgb, var(--ink) 78%, transparent);
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
    .gate-phone { transform: rotate(90deg); }   /* the end pose, held still */
  }
</style>
</head>
<body>

<div id="gate">
  <div class="gate-card">
    <div class="gate-phone"></div>
    <p class="gate-kicker">999 Casino · Blackjack</p>
    <h2>Turn your phone sideways</h2>
    <p class="gate-sub">The table plays landscape — rotate your device to play the whole screen.</p>
  </div>
</div>

<canvas id="gl"></canvas>
<div id="labels" aria-hidden="true"></div>

<div id="stage">
  <header class="hud-top">
    <div class="brandchip"><b>999</b> Casino · Blackjack</div>
    <div class="shotpill" id="shotpill">Wide table</div>
  </header>

  <div class="training" id="trainBox" hidden></div>

  <div class="tools">
    <a class="tool" id="who" href="login-16x9.html">Sign in</a>
    <button class="tool" id="zoom" type="button">Zoom out</button>
    <button class="tool" id="audioBtn" type="button" title="Toggle sound">🔊 Sound</button>
    <button class="tool" id="cineBtn" type="button" title="Cinematic deal (C)">◻ Normal</button>
    <button class="tool" id="coachBtn" type="button" title="Training overlay: book marks and the Hi-Lo count">🎓 Coach</button>
    <button class="tool" id="fsBtn" type="button" title="Toggle fullscreen">⤢ Fullscreen</button>
    <button class="tool" id="installBtn" type="button" hidden>⤓ Install</button>
    <div class="swatches" id="swatches" role="group" aria-label="Table cloth palette"></div>
  </div>

  <footer class="bar">
    <p class="status" id="status"><span class="dot"></span><span id="statusTxt">Dealing…</span></p>
    <div class="acts" id="actBar" role="group" aria-label="Table actions">
      <button class="act primary" id="btnHit" type="button" disabled>Hit</button>
      <button class="act" id="btnStand" type="button" disabled>Stand</button>
      <button class="act" id="btnDouble" type="button" disabled>Double</button>
      <button class="act" id="btnSplit" type="button" disabled>Split</button>
    </div>
    <div class="acts" id="betBar" hidden role="group" aria-label="Place your bet">
      <button class="act chip" id="bonusBtn" type="button" hidden></button>
      <button class="act chip" data-bet="25" type="button">Bet 25</button>
      <button class="act chip" data-bet="100" type="button">Bet 100</button>
      <button class="act chip" data-bet="500" type="button">Bet 500</button>
      <button class="act primary" id="btnDealNow" type="button">Deal</button>
    </div>
  </footer>
</div>

<script>
(function () {
  'use strict';

  /* ================= cloth palettes ========================
     VENDORED from 999-bridge/src/theme.js (commit 5185558) —
     the same records as login-16x9.html. Ids are load-bearing:
     they travel in ?theme=<id> and in saved choices — add, do
     not rename. Four tokens per palette: felt (the playing
     surface), rail (the bed the table sits in), accent (the
     lines and edges), ink (the print ON the cloth). This scene
     wears two DERIVED values, computed with the bridge's own
     shade(), never hand-picked:
       deep   the room behind the table = shade(rail, -0.35)
       print  the real `ink` token, printing on the felt        */
  var DEFAULT_PALETTE_ID = 'classic-house';
  var PALETTES = [
    { id: 'classic-house', label: 'Classic House',  felt: '#0B5C3A', rail: '#1A1A1A', accent: '#C9A227', ink: '#D4AF37' },
    { id: 'platinum',      label: 'Night Platinum', felt: '#0E1412', rail: '#121212', accent: '#C0C0C8', ink: '#E8E8EC' },
    { id: 'ocean',         label: 'Ocean Ops',      felt: '#0A2F2C', rail: '#05080C', accent: '#2EC4B6', ink: '#00D4E6' },
    { id: 'felt-noir',     label: 'Felt Noir',      felt: '#0F3D2E', rail: '#0B0F0C', accent: '#1F6B4A', ink: '#F2EFE4' },
    { id: 'amethyst',      label: 'Amethyst Salon', felt: '#1A0F24', rail: '#0A0710', accent: '#B8A0E8', ink: '#D4C4F0' },
    { id: 'black-gold',    label: 'Black Gold',     felt: '#0A0F0C', rail: '#111111', accent: '#D4A017', ink: '#B8860B' }
  ];
  function paletteById(id) {
    for (var i = 0; i < PALETTES.length; i++) if (PALETTES[i].id === id) return PALETTES[i];
    return PALETTES[0];
  }
  function isPaletteId(v) {
    if (typeof v !== 'string') return false;
    for (var i = 0; i < PALETTES.length; i++) if (PALETTES[i].id === v) return true;
    return false;
  }
  /* hex -> hex, walking toward white (t>0) or black (t<0) — verbatim
     from theme.js, so no consumer invents a hue. */
  function shade(hex, t) {
    var m = /^#?([0-9a-f]{6})$/i.exec(String(hex || '').trim());
    if (!m) return hex;
    var n = parseInt(m[1], 16);
    var target = t >= 0 ? 255 : 0;
    var a = Math.min(1, Math.abs(t));
    var ch = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map(function (c) {
      return Math.round(c + (target - c) * a);
    });
    return '#' + ch.map(function (c) { return c.toString(16).padStart(2, '0'); }).join('');
  }
  function clothRecord(p) {
    return {
      id: p.id, label: p.label,
      felt: p.felt, rail: p.rail, accent: p.accent,
      print: p.ink,
      deep: shade(p.rail, -0.35),
      ink: shade(p.ink, 0.55)
    };
  }
  var CLOTHS = PALETTES.map(clothRecord);
  var THEME_KEY = 'maison21.theme';            /* what maison-21/src/theme.ts reads — one choice, three consumers */
  var LEGACY_CLOTH_KEY = '999.login.cloth.v1'; /* pre-bridge key, adopted once */
  function loadClothId() {
    var q = null;
    try { q = new URLSearchParams(location.search).get('theme'); } catch (e) { }
    if (isPaletteId(q)) return q;              /* ids travel in the embed URL */
    var v = null;
    try { v = localStorage.getItem(THEME_KEY); } catch (e) { }
    if (isPaletteId(v)) return v;
    try { v = localStorage.getItem(LEGACY_CLOTH_KEY); } catch (e) { }
    return isPaletteId(v) ? v : DEFAULT_PALETTE_ID;
  }
  function saveClothId(id) {
    try { localStorage.setItem(THEME_KEY, id); } catch (e) { }
    try { localStorage.setItem(LEGACY_CLOTH_KEY, id); } catch (e) { }
  }
  var current = CLOTHS[0];

  /* ================= who is at this table ==================
     The session minted at login lives in storage (canonical
     999.identity.v1, adopted from the legacy royale.* key) — the
     table reads it back, verifies it with the hub, and wears the
     name and the balance the HUB reports, never a local guess.
     Transport is the same vendored makeHubClient as
     login-16x9.html (999-bridge/src/hub-client.js, commit
     5185558): it never throws — every call resolves
     {ok, status, body, error}.                                  */
  var ID_KEYS = { identity: '999.identity.v1' };
  var LEGACY_KEYS = { identity: 'royale.identity.v1' };
  function readKey(key) {
    try { var raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
  }
  function adoptedSession() {
    return readKey(ID_KEYS.identity) || readKey(LEGACY_KEYS.identity);
  }

  var HUB_TIMEOUT_MS = 3500;   /* the bridge default is 8000; a preview degrades faster */
  function makeHubClient(opts) {
    opts = opts || {};
    var base = opts.base || null;
    var token = opts.token || null;
    var rawFetch = (typeof fetch !== 'undefined') ? fetch.bind(window) : null;

    function configured() { return !!(base && rawFetch); }

    function call(method, path, o) {
      o = o || {};
      if (!configured()) {
        return Promise.resolve({ ok: false, status: 0, body: {}, error: 'hub-not-configured' });
      }
      var ac = new AbortController();
      var timer = setTimeout(function () { ac.abort(); }, HUB_TIMEOUT_MS);
      var h = {};
      if (o.body !== undefined) h['content-type'] = 'application/json';
      if (o.headers) for (var hk in o.headers) {
        if (Object.prototype.hasOwnProperty.call(o.headers, hk)) h[hk] = o.headers[hk];
      }
      if (o.auth) {
        var t = (o.auth === true) ? token : o.auth;
        if (t) h['authorization'] = 'Bearer ' + t;
      }
      return rawFetch(base + path, {
        method: method,
        headers: h,
        body: (o.body === undefined) ? undefined : JSON.stringify(o.body),
        signal: ac.signal
      }).then(function (res) {
        return res.json().catch(function () { return {}; }).then(function (parsed) {
          if (!res.ok) return { ok: false, status: res.status, body: parsed, error: parsed.error || ('HTTP ' + res.status) };
          return { ok: true, status: res.status, body: parsed, error: null };
        });
      }).catch(function (e) {
        return { ok: false, status: 0, body: {}, error: (e && e.name === 'AbortError') ? 'timeout' : 'network' };
      }).then(function (v) { clearTimeout(timer); return v; });
    }

    return {
      get base() { return base; },
      get token() { return token; },
      setToken: function (t) { token = t || null; return token; },
      configured: configured,
      session: function (name) {
        return call('POST', '/session', { body: { name: name || null } }).then(function (r) {
          if (r.ok && r.body && r.body.token) token = r.body.token;
          return r;
        });
      },
      verify: function (t) {
        return call('POST', '/session/verify', { body: { token: t || token || '' } }).then(function (r) {
          if (r.ok && r.body && r.body.sub) token = t || token;
          return r;
        });
      },
      wallet: function (playerId, o) {
        o = o || {};

    var f = 1 / Math.tan(fovy / 2), nf = 1 / (near - far);

    var zl = Math.hypot(zx, zy, zz) || 1; zx /= zl; zy /= zl; zz /= zl;

      -(yx * eye[0] + yy * eye[1] + yz * eye[2]),

  function hexRgb(hex) {

  var FELT_PX = 200;

  function paintFelt() {

    var g = c.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, rgba(d, 0.42));

    c.textAlign = 'center';
    c.textBaseline = 'middle';
    c.fillStyle = rgba(p, 0.16);
    c.font = '800 ' + Math.round(0.42 * FELT_PX) + 'px Georgia, "Times New Roman", serif';
    c.fillText('BLACKJACK', W / 2, H * 0.30);
    try { c.letterSpacing = '0.30em'; } catch (e) { }
    c.font = '600 ' + Math.round(0.105 * FELT_PX) + 'px Georgia, serif';
    c.fillStyle = rgba(p, 0.13);
    c.fillText('DEALER MUST DRAW ALL 17', W / 2, H * 0.30 + 0.30 * FELT_PX);
    try { c.letterSpacing = '0.18em'; } catch (e) { }
    c.font = '700 ' + Math.round(0.17 * FELT_PX) + 'px Georgia, serif';
    c.fillStyle = rgba(p, 0.15);
    c.fillText('3 : 2', W * 0.22, H * 0.36);
    c.fillText('999', W * 0.78, H * 0.36);
    try { c.letterSpacing = '0em'; } catch (e) { }

    c.strokeStyle = rgba(p, 0.14);
    c.lineWidth = Math.round(0.014 * FELT_PX);
    c.beginPath();
    c.ellipse(W / 2, H * 0.92, W * 0.46, H * 0.42, 0, Math.PI * 1.08, Math.PI * 1.92);

  function renderTrain() {

    if (!coachOn) return;

    var tc = Math.round(hiLo / Math.max(dk, 0.25));
    var html = 'Hi-Lo ' + fmtT(hiLo) + ' · True ' + fmtT(tc) + ' · ' + dk.toFixed(1) + ' dk';

  function markT() {

  function clearRound() {

  /* ================= the camera director ===================
     "The camera is a rule, not an interpolation" (spec 4.4):
       · after the deal, the shot is the cards, not the room
       · while a box decides, the camera HOLDS that box
       · during the dealer's play the dealer's hand owns the frame
       · a round ends on the dealer's hand

         screens back the camera off — the table (or the held box, or the
         dealer's fan) never crops, and nothing is stretched to make it fit
         (16:9 frame, 16:9 frustum). */

  function desiredShot() {

    if (game.phase === 'bets') {

      var yx = boxX(YOUR);
      var bp = pose([yx * 0.62, 0.05, BOX_Z + 0.35], 3.15, -yx * 0.13, Math.abs(yx) * 0.38 + 0.95);
      bp.name = 'Place your bets';
      return bp;
    }
    if (game.phase === 'settle' && game.payoutBox >= 0) {
      /* the payout walk holds the box it is paying — the same
         close hold the box got while it decided                */
      var pb = boxX(game.payoutBox);

  /* ================= labels (projected totals) =============

  /* ---- the +delta riding the payout walk ------------------

  var CHIP_FLY = 560, CHIP_STAG = 90; /* a flight lands inside its beat     */

  }

  }

  }

       tick's top off on the way. No distance: the plain voice.
       With a pan the clack carries its SEAT too — the payout
       walk crosses the channels the way the deal's whooshes do */
    var c = ready(); if (!c) return;
    var t = c.currentTime + (delay || 0), g = gain == null ? 1 : gain;
    var far = dist != null;
    var near = far ? clamp(1 - (dist - 4.2) / 1.8, 0, 1) : 1;  /* 0 far .. 1 near */
    var dg = far ? lerp(0.62, 1, near) : 1;
    var out = null;
    if (pan != null && c.createStereoPanner) {
      out = c.createStereoPanner();     /* the chip's stereo seat */
      out.pan.setValueAtTime(clamp(pan, -1, 1), t);
      out.connect(master);
      toRoom(out);                      /* the send sits after the pan: the room keeps the direction */
    }
    burst(c, t, 0.05, 'bandpass', far ? lerp(1750, 2900, near) : 2600, 1.6, 0.30 * g * dg, out);
    tone(c, far ? lerp(248, 318, near) : 300, t, 0.075, 'triangle', 0.20 * g * dg, 170, out);
  }
  function cardSnap(delay) {
    /* the card hits the cloth at the end of its 430ms flight */
    var c = ready(); if (!c) return;
    var t = c.currentTime + (delay || 0);
    burst(c, t, 0.045, 'bandpass', 3000, 0.9, 0.22);
    burst(c, t, 0.02, 'highpass', 5200, 0, 0.10);
  }
  function cardWhoosh(delay, dur, dist, pan, panFrom) {
    /* the slide rides the whole flight: a soft swell of shaped
       noise that opens at the shoe, peaks mid-air and is gone
       by the time the snap lands. The sound carries the
       DISTANCE flown: a card to the dealer's fan is close and
       bright, one to the far box is deeper and quieter — the
       air between you and the card takes the shimmer out.
       And it carries the card's SEAT: the whoosh pans from the
       shoe to the box it lands in, so a deal to the left walks
       the left channel as the eye follows the card. Quiet
       overall, so the card never shouts over the chips       */
    var c = ready(); if (!c) return;
    var t = c.currentTime + (delay || 0), D = dur || 0.4;
    var near = clamp(1 - ((dist == null ? 4.4 : dist) - 2.4) / 4.0, 0, 1);  /* 0 far .. 1 near */
    var s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = noise(c);
    f.type = 'bandpass'; f.Q.value = 0.8;
    f.frequency.setValueAtTime(lerp(500, 780, near) + Math.random() * 260, t);
    f.frequency.exponentialRampToValueAtTime(lerp(1250, 2150, near), t + D * 0.7);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(lerp(0.036, 0.055, near), t + D * 0.45);
    g.gain.exponentialRampToValueAtTime(0.0001, t + D);
    s.connect(f); f.connect(g);
    if (pan != null && c.createStereoPanner) {
      var p = c.createStereoPanner();   /* the card's stereo seat: shoe to box */
      p.pan.setValueAtTime(clamp(panFrom == null ? pan : panFrom, -1, 1), t);
      if (panFrom != null) p.pan.linearRampToValueAtTime(clamp(pan, -1, 1), t + D);
      g.connect(p); p.connect(master); toRoom(p);   /* the send sits after the pan */
    } else {
      g.connect(master); toRoom(g);     /* no panning API: the whoosh stays centered */
    }
    s.start(t); s.stop(t + D + 0.03);
  }
  function chipFan(count, delay0, step, dist, panFrom, panTo) {
    /* a stack unwinds or arrives — clacks staggered like the
       chips they belong to, each carrying the flight's distance
       and its SEAT: the fan pans from where the chips leave to
       where they land, one step across the channels per chip,
       the way the deal's whooshes carry the shoe to the box   */
    for (var k = 0; k < count; k++) {
      var pk = panFrom == null ? null : (panTo == null ? panFrom : lerp(panFrom, panTo, count > 1 ? k / (count - 1) : 1));
      chipClack(delay0 + k * step, Math.max(1 - k * 0.06, 0.5), dist, pk);
    }
  }
  function riffleShuffle(delay0) {
    /* the shoe ceremony (spec 4.5): the halves lift with a
       paper slide, the riffle runs off the thumbs card by card,
       then two taps square the deck up — every sound timed to
       the animation it belongs to                          */
    var c = ready(); if (!c) return;
    var t = c.currentTime + (delay0 || 0);
    burst(c, t + 0.06, 0.34, 'bandpass', 850, 0.7, 0.09, null, RIFFLE_ROOM);   /* the halves lift apart */
    for (var k = 0; k < 14; k++) {
      /* the riffle: a rapid run of shaped snaps, one per card */
      var at = t + 0.55 + k * 0.062;
      burst(c, at, 0.055, 'bandpass', 1500 + Math.random() * 1400, 2.6, 0.11, null, RIFFLE_ROOM);
      if (k % 3 === 0) tone(c, 240 + Math.random() * 60, at, 0.05, 'triangle', 0.035, 170, null, RIFFLE_ROOM);
    }
    burst(c, t + 1.58, 0.05, 'bandpass', 1900, 1.2, 0.12, null, RIFFLE_ROOM);  /* squaring up: two taps */
    tone(c, 190, t + 1.58, 0.09, 'triangle', 0.15, 120, null, RIFFLE_ROOM);
    burst(c, t + 1.80, 0.055, 'bandpass', 1500, 1.2, 0.11, null, RIFFLE_ROOM);
    tone(c, 165, t + 1.80, 0.11, 'triangle', 0.13, 105, null, RIFFLE_ROOM);
  }
  /* the new-shoe chime: two soft notes over "place your bets",
     quiet enough to sit under the room (spec 4.5 vocabulary)  */
  function betsOpen(delay) {
    var c = ready(); if (!c) return;
    var t = c.currentTime + (delay || 0);
    tone(c, 783.99, t, 0.34, 'triangle', 0.05, 659.25);
    tone(c, 1046.5, t + 0.12, 0.3, 'triangle', 0.03);
  }
  function cutCue() {
    /* the cut card surfaces at the shoe: one soft paper whisper
       and a low tick — quiet enough to sit under the round     */
    var c = ready(); if (!c) return;
    var t = c.currentTime + 0.02;
    burst(c, t, 0.32, 'bandpass', 900, 0.8, 0.05);
    tone(c, 233.08, t + 0.14, 0.12, 'triangle', 0.055, 155);
  }
  function stinger(result) {
    /* one stinger per round is ceremony; six would be noise —
       it only ever marks YOUR verdict                       */
    var c = ready(); if (!c) return;
    var t = c.currentTime + 0.02;
    if (result === 'win') {
      /* a bright rising triad — C5 E5 G5 with an octave shimmer,
         leaning into the room: the verdict is allowed to bloom */
      tone(c, 523.25, t, 0.32, 'triangle', 0.18, null, null, STINGER_ROOM);
      tone(c, 659.25, t + 0.09, 0.32, 'triangle', 0.18, null, null, STINGER_ROOM);
      tone(c, 783.99, t + 0.18, 0.55, 'triangle', 0.20, null, null, STINGER_ROOM);
      tone(c, 1567.98, t + 0.18, 0.5, 'sine', 0.07, null, null, STINGER_ROOM);
    } else {
      /* lose / bust: a short sigh falling to the felt */
      tone(c, 392, t, 0.22, 'triangle', 0.15, 262, null, null, STINGER_ROOM);
      tone(c, 196, t + 0.13, 0.42, 'sine', 0.13, 147, null, null, STINGER_ROOM);
    }
  }
  function walkCue(b, h) {
    /* the clacks land with the chips (the flights end at
       CHIP_FLY, the payout a PAY_LAG behind), then your box
       takes its stinger. The clacks carry the FLIGHT DISTANCE
       tray to box - the payout walk's own distance model -
       and the flight's SEAT: the fan pans from where the
       chips leave to where they land, projected by the same
       camera as the deal's whooshes, so the walk moves across
       the channels as the eye follows the chips. Under the
       cinematic the clacks stretch WITH the flights - the
       same pace multiplier on both, so impact stays on the
       landing, just later                                  */
    var toDealer = h.result === 'lose' || h.result === 'bust';
    var n = toDealer ? (h.chipT0 || []).length : (h.flyPay || 0);
    var from = toDealer ? chipSpot(b, 0) : traySpot(0);
    var to = toDealer ? traySpot(0) : chipSpot(b, 0);
    var dist = Math.hypot(to[0] - from[0], to[1] - from[1]);
    chipFan(n, CHIP_FLY * pace + (toDealer ? 0 : PAY_LAG * pace), CHIP_STAG * pace, dist,
      panFor({ x: from[0], y: 0.12, z: from[1] }),
      panFor({ x: to[0], y: 0.12, z: to[1] }));
    if (b === YOUR) stinger(h.result);
  }

  /* ---- the shoe, the rack, the tray — real furniture ------
     The shoe is a STACK of card backs that sinks as it deals
     and refills whole at the riffle; the discard rack is its
     mirror, growing with every card that played; the tray's
     five columns rise when the house takes a stack and sink
     when it pays one out. Between the shoe and the rack the
     dealer reads the print: DISCARD · TRAY · SHOE.            */
  var FURNI_STEP = 0.011;
  var FURNI_WHITE = [1, 1, 1, 1];
  function furniLean(k) { return ((k * 37) % 5 - 2) * 0.007; }   /* a real stack never squares up */
  function stackRange(count, cap, base) {
    return Math.max(base, Math.round((count / cap) * 10));
  }
  function trayCols(t) {              /* per-slot fills, empty slots first */
    var fill = trayFill(t), cols = [];
    for (var k = 0; k < TRAY_SLOTS; k++) cols.push(k < fill ? TRAY_STACK_H : 0);
    return cols;
  }
  function drawFurniture(ts) {
    var y = 0.012;
    /* the SHOE: a base + a stack of backs sinking as it deals,
       stilled mid-shuffle (the riffle owns the cards then)   */
    drawQuad(feltTex, 0, hexTint(current.deep, 1), SHOE[0], y, SHOE[2], -0.18, 1.25, 0.9, false);
    drawQuad(chipTex, 0, hexTint(current.rail, 1), SHOE[0], y + 0.004, SHOE[2], -0.18, 1.13, 0.78, false);
    if (game.phase !== 'shuffle') {
      var inShoe = Math.max(0, SHOE_CARDS - shoeDealt);
      for (var k = 0; k < stackRange(inShoe, SHOE_CARDS, 3); k++) {
        drawQuad(getBackTex(), 1, FURNI_WHITE, SHOE[0] + furniLean(k), y + 0.006 + k * FURNI_STEP, SHOE[2] + furniLean(k + 2), -0.18 + (k % 3) * 0.008, CARD_W, CARD_L, false);
      }
    }
    /* the DISCARD RACK: the shoe's mirror, growing as cards return */
    drawQuad(feltTex, 0, hexTint(current.deep, 1), -SHOE[0], y, SHOE[2], 0.18, 1.25, 0.9, false);
    drawQuad(chipTex, 0, hexTint(current.rail, 1), -SHOE[0], y + 0.004, SHOE[2], 0.18, 1.13, 0.78, false);
    for (var j = 0; j < stackRange(discarded, SHOE_CARDS, 0); j++) {
      drawQuad(getBackTex(), 1, FURNI_WHITE, -SHOE[0] + furniLean(j), y + 0.006 + j * FURNI_STEP, SHOE[2] + furniLean(j + 1), 0.18 + (j % 3) * 0.008, CARD_W, CARD_L, false);
    }
    /* the TRAY: five stacked columns that ride the ledger */
    var cols = trayCols(trayChips), shift = trayShift(trayChips);
    drawQuad(feltTex, 0, hexTint(current.deep, 1), -0.54 + shift, y, DEALER_Z - 0.78, 0, 3.62, 0.62, false);
    drawQuad(chipTex, 0, hexTint(current.rail, 1), -0.54 + shift, y + 0.004, DEALER_Z - 0.78, 0, 3.5, 0.5, false);
    for (var tc = 0; tc < TRAY_SLOTS; tc++) {
      var sx = traySlotX(tc) + shift;
      for (var tk = 0; tk < cols[tc]; tk++) {
        drawQuad(chipTex, 1, hexTint(CHIP_TINTS[tc], 1), sx + (tk % 2 ? 0.016 : -0.014), y + 0.006 + tk * CHIP_H, DEALER_Z - 0.78 + (tk % 3 - 1) * 0.012, 0, 0.5, 0.5, false);
      }
    }
    /* the felt print between them, theme-coloured (spec 4.2) */
    gl.depthMask(false);
    drawQuad(chipTex, 0, hexTint(current.print, 0.13), SHOE[0], y + 0.005, SHOE[2] + 0.62, -0.18, 0.58, 0.26, false);
    drawQuad(chipTex, 0, hexTint(current.print, 0.13), -SHOE[0], y + 0.005, SHOE[2] + 0.62, 0.18, 0.58, 0.26, false);
    drawQuad(chipTex, 0, hexTint(current.print, 0.13), -0.54 + shift, y + 0.005, DEALER_Z - 0.78 + 0.44, 0, 0.58, 0.26, false);
    gl.depthMask(true);
  }

  /* ---- the riffle at the shoe (spec 4.5) -----------------
     Twelve card backs at the shoe and nothing else moving:
     the deck splits into two halves, the halves lean together
     as the cards interleave back in, and the stack straightens
     through the square-up. The riffle sounds with the cards.  */
  function drawShuffle(ts) {
    if (game.phase !== 'shuffle' || game.shuffleT0 == null) return;
    var t = ts - game.shuffleT0;
    var W = [1, 1, 1, 1];
    /* the halves lift apart, then close as they riffle together */
    var sep = 0.52 * clamp(t / 550, 0, 1) * (1 - 0.85 * clamp((t - 1150) / 1250, 0, 1));
    var tilt = 0.3 * Math.sin(Math.PI * clamp((t - 300) / 1250, 0, 1));
    var sq = clamp((t - 1550) / 850, 0, 1);   /* the square-up straightens the stack */
    for (var k = 0; k < 12; k++) {
      var side = k % 2, half = (k / 2) | 0;
      var p = clamp((t - (550 + k * 72)) / 210, 0, 1), e = 1 - Math.pow(1 - p, 2.4);
      var x = lerp(SHOE[0] + (side ? sep : -sep), SHOE[0] + (side ? 0.014 : -0.014) * (1 - sq), e);
      var y = lerp(0.36 + half * 0.011, 0.36 + k * 0.01, e) + Math.sin(p * Math.PI) * 0.16;
      var r = lerp(side ? tilt : -tilt, 0, e);
      drawQuad(getBackTex(), 1, W, x, y, SHOE[2], r, CARD_W, CARD_L, false);
    }
  }

  /* The cut card SURFACES when the shuffle is near: it rises
     out of the shoe's stack, settles at an angle at the shoe's
     back, and stands through the shoe's last round — then the
     riffle takes the shoe back and the card is gone with it.  */
  function drawCutCard(ts) {
    if (!cutT0 || game.phase === 'shuffle') return;
    var p = clamp((ts - cutT0) / 900, 0, 1), e = 1 - Math.pow(1 - p, 2.4);
    var y = lerp(0.36, 0.52, e) + Math.sin(ts / 950) * 0.012 * e;
    drawQuad(getCutTex(), 1, [1, 1, 1, 0.2 + 0.8 * e], SHOE[0] - 0.02, y, SHOE[2] - 0.14, -0.22, CARD_W, CARD_L, false);
  }

  /* ================= render loop =========================== */
  var proj = mPersp(CAM_FOV * Math.PI / 180, 1, 0.1, 60);
  var lastTs = 0, animOn = false, rafId = 0;

  function drawScene(ts) {
    var dt = lastTs ? Math.min((ts - lastTs) / 1000, 0.1) : 0.016;
    lastTs = ts;

    updateCamera(dt);
    /* the frustum matches the frame: a 16:9 viewport gets a 16:9 frustum.
       The old square frustum stretched the table to fill whatever screen it
       got — shapes wrong, and the table's sides cropped at 16:9. */
    proj = mPersp(CAM_FOV * Math.PI / 180, VW / Math.max(VH, 1), 0.1, 60);
    MVP = mMul(proj, mLookAt(cam.eye, cam.look));

    gl.clearColor(hexRgb(current.deep)[0] / 255, hexRgb(current.deep)[1] / 255, hexRgb(current.deep)[2] / 255, 1);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    gl.enable(gl.DEPTH_TEST);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);

    var white = [1, 1, 1, 1];

    /* the rail, then the felt — the felt fills the frame */
    drawQuad(feltTex, 0, hexTint(current.rail, 1), 0, 0, 0, 0, FELT_RX * 2 + 1.15, FELT_RZ * 2 + 1.15, false);
    drawQuad(feltTex, 1, white, 0, 0.004, 0, 0, FELT_RX * 2, FELT_RZ * 2, false);

    /* shoe / discard rack / chip tray — the live set (spec 4.2),
       built as stacked geometry: the shoe's stack shrinks as it
       deals, the rack grows as cards come back, and the tray's
       columns rise and sink with the money the walk moves      */
    drawFurniture(ts);

    /* the shoe ceremony (spec 4.5): the deck riffles where the
       shoe sits — split, interleave, square up */
    drawShuffle(ts);
    drawCutCard(ts);       /* once it surfaces, the cut card stands at the shoe */

    /* the betting interlude: the circle breathes at your box and
       the felt previews the stake you picked — chips, not text  */
    if (game.phase === 'bets') {
      var bspot = chipSpot(YOUR, 0), bpulse = 0.5 + 0.28 * Math.sin(ts / 320);
      gl.depthMask(false);
      gl.blendFunc(gl.ONE, gl.ONE);
      drawQuad(ringTex, 1, hexTint(current.accent, bpulse), bspot[0], 0.008, bspot[1], 0, 1.7, 1.45, true);
      gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
      gl.depthMask(true);
      var prev = Math.min(5, Math.round(UNIT_BET / 25));
      for (var pv = 0; pv < prev; pv++) {
        drawQuad(chipTex, 1, hexTint(CHIP_TINTS[YOUR % CHIP_TINTS.length], 0.9),
          bspot[0], 0.012 + pv * CHIP_H, bspot[1], 0, CHIP_D, CHIP_D, false);
      }
    }

    /* each box's bet stack — the felt's chips tell the truth:
       a stack appears where a stake landed, grows with a
       double, and at settle flies to the winner or the dealer */
    for (var b = 0; b < BOX_N; b++) drawBetStack(b, ts);

    /* the "next to play" ring — driven by the game's acting box
       (seat id = reported index + 1), on the cloth at the box.  */
    if (game.phase === 'acting' && game.acting >= 0) {
      var pulse = 0.55 + 0.25 * Math.sin(ts / 320);
      gl.depthMask(false);
      gl.blendFunc(gl.ONE, gl.ONE);
      drawQuad(ringTex, 1, hexTint(current.accent, pulse), boxX(game.acting), 0.008, BOX_Z + 0.18, 0, 3.15, 2.35, true);
      gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
      gl.depthMask(true);
    }

    /* the cards — vertical stacks for the boxes, a sideways
       fan for the dealer, all flying out of the shoe            */
    var now = ts;
    function drawCardMesh(c) {
      var p = clamp((now - c.t0) / c.dur, 0, 1);
      var e = 1 - Math.pow(1 - p, 3);
      var tgt = cardTarget(c);
      var x = lerp(c.from[0], tgt.x, e);
      var z = lerp(c.from[2], tgt.z, e);
      var y = lerp(c.from[1], tgt.y, e) + Math.sin(p * Math.PI) * 0.5 * (1 - e * 0.35);
      var ry = lerp(-0.35, tgt.ry, e);
      drawQuad(faceTexture(c.rank, c.suit), 1, white, x, y, z, ry, CARD_W, CARD_L, false);
    }
    for (var i2 = 0; i2 < BOX_N; i2++) {
      var hh = game.hands[i2];
      if (!hh) continue;
      for (var k = 0; k < hh.cards.length; k++) drawCardMesh(hh.cards[k]);
    }
    for (var j = 0; j < game.dealer.cards.length; j++) drawCardMesh(game.dealer.cards[j]);

    updateLabels();
    drawPayFloats(ts);
  }

  function frame(ts) {
    drawScene(ts);
    if (animOn) rafId = requestAnimationFrame(frame);
  }
  function startAnim() {
    if (animOn) return;
    animOn = true;
    lastTs = 0;
    rafId = requestAnimationFrame(frame);
  }
  function stopAnim() { animOn = false; if (rafId) cancelAnimationFrame(rafId); }
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) stopAnim(); else startAnim();
  });

  /* ================= UI plumbing ========================== */
  function hexTint(hex, a) {
    var c = hexRgb(hex);
    return [c[0] / 255, c[1] / 255, c[2] / 255, a];
  }

  var statusTxt = document.getElementById('statusTxt');
  function setStatus(s) { statusTxt.textContent = s; }

  var btnHit = document.getElementById('btnHit');
  var btnStand = document.getElementById('btnStand');
  var btnDouble = document.getElementById('btnDouble');
  var btnSplit = document.getElementById('btnSplit');

  function updateActions() {
    var live = game.phase === 'acting' && game.acting === YOUR;
    var h = game.hands[YOUR];
    btnHit.disabled = !live;
    btnStand.disabled = !live;
    btnDouble.disabled = !live || !h || h.cards.length !== 2;
    /* pairs split on the live table; the preview keeps the control
       visible in the thumb bar but inert */
    btnSplit.disabled = true;
  }
  function enableActions(on) {
    if (!on) {
      btnHit.disabled = btnStand.disabled = btnDouble.disabled = btnSplit.disabled = true;
      return;
    }
    updateActions();
  }
  btnHit.addEventListener('click', playerHit);
  btnStand.addEventListener('click', playerStand);
  btnDouble.addEventListener('click', playerDouble);
  var betChips = document.querySelectorAll('#betBar [data-bet]');
  for (var bi = 0; bi < betChips.length; bi++) {
    (function (btn) {
      btn.addEventListener('click', function () { setStake(Number(btn.getAttribute('data-bet'))); });
    })(betChips[bi]);
  }
  var btnDealNow = document.getElementById('btnDealNow');
  if (btnDealNow) btnDealNow.addEventListener('click', endBets);
  var bonusBtn = document.getElementById('bonusBtn');
  if (bonusBtn) bonusBtn.addEventListener('click', claimBonus);

  /* keyboard parity for the desktop preview */
  window.addEventListener('keydown', function (e) {
    if (e.key === 'h' || e.key === 'H') playerHit();
    else if (e.key === 's' || e.key === 'S') playerStand();
    else if (e.key === 'd' || e.key === 'D') playerDouble();
    else if (e.key === 'c' || e.key === 'C') setCine(!cineOn);
  });

  /* the 3D zoom control — the label reflects the NEXT action,
     and user zoom survives every director shot change (4.4).   */
  var zoomBtn = document.getElementById('zoom');
  function syncZoomLabel() { zoomBtn.textContent = userZoom ? 'Zoom in' : 'Zoom out'; }
  zoomBtn.addEventListener('click', function () {
    userZoom = !userZoom;
    syncZoomLabel();
  });

  /* the audio toggle (spec 4.5: gated by the app's audio
     toggles) — the label names the current state            */
  var audioBtn = document.getElementById('audioBtn');
  function syncAudioBtn() {
    if (audioBtn) audioBtn.textContent = audioOn ? '🔊 Sound' : '🔇 Muted';
  }
  if (audioBtn) audioBtn.addEventListener('click', function () {
    audioOn = !audioOn;
    try { localStorage.setItem('999.table.audio', audioOn ? 'on' : 'off'); } catch (e) { }
    if (master) master.gain.value = audioOn ? 1 : 0;   /* instant mute */
    if (reverbBus) reverbBus.gain.value = audioOn ? 0.35 : 0;   /* the room answers the mute too */
    syncAudioBtn();
    wakeAudio();               /* this click IS the gesture */
  });

  /* the cinematic deal toggle — slow motion where the flights
     and their sounds stretch together (key C)                  */
  var cineBtn = document.getElementById('cineBtn');
  if (cineBtn) cineBtn.addEventListener('click', function () { setCine(!cineOn); });
  setCine(cineOn);

  /* the training overlay toggle — book marks + the count meter */
  var coachBtn = document.getElementById('coachBtn');
  if (coachBtn) coachBtn.addEventListener('click', function () { setCoach(!coachOn); });
  setCoach(coachOn);

  /* ================= fullscreen (mobile landscape) ==========
     The first tap on a phone drops the browser chrome and locks
     the screen to landscape where the platform allows (Android).
     iOS refuses both and simply keeps the edge-to-edge layout;
     every call is therefore best-effort, never fatal.            */
  var fsBtn = document.getElementById('fsBtn');
  function fsEl() { return document.fullscreenElement || document.webkitFullscreenElement || null; }
  function lockLand() {
    try {
      var so = window.screen && window.screen.orientation;
      if (so && so.lock) { var q = so.lock('landscape'); if (q && q.catch) q.catch(function () { }); }
    } catch (e) { }
  }
  function enterFs() {
    var el = document.documentElement;
    try {
      var p = el.requestFullscreen || el.webkitRequestFullscreen || el.webkitRequestFullScreen;
      if (!p) return;
      var r = p.call(el);
      if (r && r.then) r.then(lockLand).catch(function () { });
      else lockLand();
    } catch (e) { }
  }
  function toggleFs() {
    try {
      if (fsEl()) {
        var x = document.exitFullscreen || document.webkitExitFullscreen;
        if (x) { x.call(document); return; }
      }
    } catch (e) { }
    enterFs();
  }
  function syncFsBtn() {
    if (fsBtn) fsBtn.textContent = fsEl() ? '⤫ Exit fullscreen' : '⤢ Fullscreen';
  }
  if (fsBtn) fsBtn.addEventListener('click', toggleFs);
  document.addEventListener('fullscreenchange', function () { syncFsBtn(); fit(); });
  document.addEventListener('webkitfullscreenchange', function () { syncFsBtn(); fit(); });

  /* “auto on first tap once loading”: the first touch in landscape
     enters fullscreen — one gesture, one tap, then never again.   */
  var fsArmed = true;
  document.addEventListener('pointerdown', function () {
    if (!fsArmed) return;
    if (document.body.classList.contains('gated')) return;   /* still portrait — wait for the turn */
    if (!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches)) return;  /* desktop: the ⤢ toggle */
    fsArmed = false;
    enterFs();
  }, true);

  /* cloth swatches — one record paints the HUD and the 3D felt */
  var swWrap = document.getElementById('swatches');
  CLOTHS.forEach(function (c) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'sw';
    b.title = c.label;
    b.setAttribute('aria-label', 'Table cloth: ' + c.label);
    b.setAttribute('aria-pressed', 'false');
    b.style.background = 'radial-gradient(circle at 32% 28%, ' + c.felt + ', ' + c.deep + ' 78%)';
    b.addEventListener('click', function () { applyCloth(c); });
    swWrap.appendChild(b);
  });

  /* ================= boot ================================= */
  applyCloth(CLOTHS.filter(function (c) { return c.id === loadClothId(); })[0] || CLOTHS[0]);
  syncZoomLabel();
  syncAudioBtn();
  fit();
  startAnim();
  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', fit);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', fit);
  startRound();
  loadWallet();               /* the signed-in name + balance, from the hub */

  /* ================= install: the home-screen app ===========
     The manifest locks the display to landscape fullscreen; the
     ⤓ button owns Chrome's install prompt when the browser
     offers one. iOS never fires the event — it installs via the
     Share sheet (the portal says so).                            */
  var installBtn = document.getElementById('installBtn');
  var installEvt = null;
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    installEvt = e;
    if (installBtn) installBtn.hidden = false;
  });
  window.addEventListener('appinstalled', function () {
    installEvt = null;
    if (installBtn) installBtn.hidden = true;
  });
  if (installBtn) installBtn.addEventListener('click', function () {
    var e = installEvt;
    if (!e) return;
    installEvt = null;
    installBtn.hidden = true;
    e.prompt();
    if (e.userChoice && e.userChoice.then) e.userChoice.then(function () { }, function () { });
  });

  /* the service worker: Chrome's installability criteria still
     require a fetch handler — sw.js is a network-first
     pass-through with an offline shell fallback.                */
  if ('serviceWorker' in navigator) {
    try { navigator.serviceWorker.register('sw.js').catch(function () { }); } catch (e) { }
  }
})();
</script>
</body>
</html>
